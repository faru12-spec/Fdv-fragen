alter.","c":false},{"l":"C","t":"Vorsignal zum Senksignal - Die Stromabnehmer müssen ab dem Senksignal gesenkt sein.","c":false},{"l":"D","t":"Vorsignal zum Umschaltsignal - Es folgt eine Schutzstrecke mit Spannungswechsel.","c":false}],"fdv":"7.1.3 Signale für Schutzstrecken - Begriff: Vorsignal zum Ausschaltsignal. Bedeutung: Vorbereitung zum Ausschalten. Beziehung zu anderen Signalen: Es folgt ein Ausschaltsignal.","note":"","optTags":{"A":[],"B":[],"C":[],"D":[]},"optNotes":{"A":"","B":"","C":"","D":""},"img":"images/image228.png","contentVersion":1},{"nr":375,"p":1,"term":"Ausschaltsignal (Ziff. 7.1.3)","approved":false,"q":"Wie lautet der Begriff dieses Signals gemäss FDV R 300.2, Ziff. 7.1.3, und was bedeutet es?","opts":[{"l":"A","t":"Einschaltsignal - Weiterfahrt mit eingeschaltetem Hauptschalter.","c":false},{"l":"B","t":"Ausschaltsignal - Vorbeifahrt mit ausgeschaltetem Hauptschalter.","c":true},{"l":"C","t":"Vorsignal zum Ausschaltsignal - Vorbereitung zum Ausschalten.","c":false},{"l":"D","t":"Streckentrennung - Halt für Fahrzeuge mit gehobenem Stromabnehmer bei ausgeschalteter Streckenfahrleitung.","c":false}],"fdv":"7.1.3 Signale für Schutzstrecken - Begriff: Ausschaltsignal. Bedeutung: Vorbeifahrt mit ausgeschaltetem Hauptschalter. Beziehung zu anderen Signalen: Dem Ausschaltsignal kann ein Vorsignal vorausgehen und es folgt ein Einschaltsignal.","note":"","optTags":{"A":[],"B":[],"C":[],"D":[]},"optNotes":{"A":"","B":"","C":"","D":""},"img":"images/image229.png","contentVersion":1},{"nr":376,"p":1,"term":"Einschaltsignal (Ziff. 7.1.3)","approved":false,"q":"Wie lautet der Begriff dieses Signals gemäss FDV R 300.2, Ziff. 7.1.3, und was bedeutet es?","opts":[{"l":"A","t":"Ausschaltsignal - Vorbeifahrt mit ausgeschaltetem Hauptschalter.","c":false},{"l":"B","t":"Endsignal zur Systemschutzstrecke - Weiterfahrt mit dem betreffenden Stromsystem.","c":false},{"l":"C","t":"Einschaltsignal - Weiterfahrt mit eingeschaltetem Hauptschalter.","c":true},{"l":"D","t":"Endsignal zum Senksignal - Erlaubnis zum Heben der Stromabnehmer.","c":false}],"fdv":"7.1.3 Signale für Schutzstrecken - Begriff: Einschaltsignal. Bedeutung: Weiterfahrt mit eingeschaltetem Hauptschalter. Beziehung zu anderen Signalen: Es geht ein Ausschaltsignal voraus. Wenn eine mit Lichtsignalen ausgerüstete Schutzstrecke an Spannung gelegt ist und ohne Ausschalten des Hauptschalters befahren werden darf, zeigen auch das Vor- und das Ausschaltsignal, sofern sie beleuchtet sind, das Bild des Einschaltsignals.","note":"","optTags":{"A":[],"B":[],"C":[],"D":[]},"optNotes":{"A":"","B":"","C":"","D":""},"img":"images/image230.png","contentVersion":1},{"nr":377,"p":1,"term":"Streckentrennung (Ziff. 7.1.4)","approved":false,"q":"Wie lautet der Begriff dieses Signals gemäss FDV R 300.2, Ziff. 7.1.4, und was bedeutet es?","opts":[{"l":"A","t":"Senksignal - Halt für Fahrzeuge mit gehobenem Stromabnehmer.","c":false},{"l":"B","t":"Ausschaltsignal - Vorbeifahrt mit ausgeschaltetem Hauptschalter.","c":false},{"l":"C","t":"Zonen-Schutzsstrecke - Halt für Einsystem- und Mehrsystem-Triebfahrzeuge mit gehobenem Stromabnehmer.","c":false},{"l":"D","t":"Streckentrennung - Halt für Fahrzeuge mit gehobenem Stromabnehmer bei ausgeschalteter Streckenfahrleitung.","c":true}],"fdv":"7.1.4 Signal für Streckentrennung im Bahnbetrieb - Begriff: Streckentrennung. Bedeutung: Halt für Fahrzeuge mit gehobenem Stromabnehmer bei ausgeschalteter Streckenfahrleitung. Beziehung zu anderen Signalen: Die Streckentrennung ist bahnhofseitig mit dem Signal Streckentrennung gekennzeichnet, streckenseitig durch das Einfahrsignal begrenzt.","note":"","optTags":{"A":[],"B":[],"C":[],"D":[]},"optNotes":{"A":"","B":"","C":"","D":""},"img":"images/image231.png","contentVersion":1},{"nr":378,"p":1,"term":"Zonen-Schutzsstrecke (Ziff. 7.2.2)","approved":false,"q":"Wie lautet der Begriff dieses Signals gemäss FDV R 300.2, Ziff. 7.2.2, und was bedeutet es?","opts":[{"l":"A","t":"Zonen-Schutzsstrecke - Halt für Einsystem-Triebfahrzeuge und für Mehrsystem-Triebfahrzeuge mit gehobenem Stromabnehmer; Ausnahme: Vorbeifahrt gestattet für Triebfahrzeuge mit gehobenem Stromabnehmer und ausgeschaltetem Hauptschalter, sofern die Stromabnehmer für beide Systeme verwendet werden können.","c":true},{"l":"B","t":"Streckentrennung - Halt für Fahrzeuge mit gehobenem Stromabnehmer bei ausgeschalteter Streckenfahrleitung, ausnahmslos.","c":false},{"l":"C","t":"Zonensignal - Zeigt den Schaltzustand der umschaltbaren Zone an, kein Haltsignal.","c":false},{"l":"D","t":"Umschaltsignal - Halt nur für Mehrsystem-Triebfahrzeuge, Einsystem-Triebfahrzeuge dürfen stets vorbeifahren.","c":false}],"fdv":"7.2.2 Zonen-Schutzstreckensignal - In Bahnhöfen mit umschaltbaren Zonen sind die Systemschutzstrecken mit Zonen-Schutzstreckensignalen gekennzeichnet. Begriff: Zonen-Schutzsstrecke. Bedeutung: Halt für Einsystem-Triebfahrzeuge mit gehobenem Stromabnehmer; Halt für Mehrsystem-Triebfahrzeuge mit gehobenem Stromabnehmer. Ausnahme: Vorbeifahrt für Triebfahrzeuge mit gehobenem Stromabnehmer und ausgeschaltetem Hauptschalter gestattet, sofern die Stromabnehmer für beide Systeme verwendet werden können.","note":"","optTags":{"A":[],"B":[],"C":[],"D":[]},"optNotes":{"A":"","B":"","C":"","D":""},"img":"images/image232.png","contentVersion":1},{"nr":379,"p":1,"term":"Zonensignal (Ziff. 7.2.3)","approved":false,"q":"Was zeigt das Zonensignal gemäss FDV R 300.2, Ziff. 7.2.3, an, und was bedeutet die Ziffer 25 darauf?","opts":[{"l":"A","t":"Es zeigt den Schaltzustand der umschaltbaren Zone an; die Ziffer 25 bedeutet 25 000 Volt, 50 Hz.","c":true},{"l":"B","t":"Es zeigt die zulässige Höchstgeschwindigkeit an; die Ziffer 25 bedeutet 25 km/h.","c":false},{"l":"C","t":"Es zeigt den Schaltzustand der umschaltbaren Zone an; die Ziffer 25 bedeutet Fahrleitung ausgeschaltet.","c":false},{"l":"D","t":"Es zeigt die Entfernung zur nächsten Schutzstrecke an; die Ziffer 25 bedeutet 25 Meter.","c":false}],"fdv":"7.2.3 Zonensignal - Das Zonensignal zeigt den Schaltzustand der umschaltbaren Zone an. Ziffer/Stromsystem: 0 = Fahrleitung ausgeschaltet; 11 = 11 000 Volt, 16,7 Hz; 15 = 15 000 Volt, 16,7 Hz; 25 = 25 000 Volt, 50 Hz; 3– = 3 000 Volt, Gleichstrom; 1– = bis 1 500 Volt, Gleichstrom.","note":"","optTags":{"A":[],"B":[],"C":[],"D":[]},"optNotes":{"A":"","B":"","C":"","D":""},"contentVersion":1},{"nr":380,"p":1,"term":"Vorsignal zum Umschaltsignal (Ziff. 7.2.4)","approved":false,"q":"Wie lautet der Begriff dieses Signals gemäss FDV R 300.2, Ziff. 7.2.4, und was bedeutet es?","opts":[{"l":"A","t":"Umschaltsignal - Halt für Ein- und Mehrsystem-Triebfahrzeuge mit gehobenem Stromabnehmer.","c":false},{"l":"B","t":"Vorsignal zum Umschaltsignal - Nach dem nächsten Systemwechselsignal folgt eine Schutzstrecke mit Spannungswechsel; die Zahl kündigt die neue Spannung nach der Schutzstrecke an.","c":true},{"l":"C","t":"Vorsignal zum Ausschaltsignal - Vorbereitung zum Ausschalten.","c":false},{"l":"D","t":"Zonensignal - Zeigt den Schaltzustand der umschaltbaren Zone an.","c":false}],"fdv":"7.2.4 Systemwechselsignal - Begriff: Vorsignal zum Umschaltsignal. Bedeutung: Nach dem nächsten Systemwechselsignal folgt eine Schutzstrecke mit Spannungswechsel. Die Zahl kündigt die neue Spannung nach der Schutzstrecke an. Beziehung zu anderen Signalen: Es folgt ein Umschaltsignal.","note":"","optTags":{"A":[],"B":[],"C":[],"D":[]},"optNotes":{"A":"","B":"","C":"","D":""},"img":"images/image234.png","contentVersion":1},{"nr":381,"p":1,"term":"Umschaltsignal (Ziff. 7.2.4)","approved":false,"q":"Wie lautet der Begriff dieses Signals gemäss FDV R 300.2, Ziff. 7.2.4, und was bedeutet es?","opts":[{"l":"A","t":"Vorsignal zum Umschaltsignal - Nach dem nächsten Systemwechselsignal folgt eine Schutzstrecke mit Spannungswechsel.","c":false},{"l":"B","t":"Endsignal zur Systemschutzstrecke - Weiterfahrt mit dem betreffenden Stromsystem.","c":false},{"l":"C","t":"Umschaltsignal - Halt für Einsystem-Triebfahrzeuge und für Mehrsystem-Triebfahrzeuge mit gehobenem Stromabnehmer; die obere Zahl bezieht sich auf die Fahrleitungsspannung vor, die untere auf die Fahrleitungsspannung nach der Schutzstrecke. Ausnahme: Vorbeifahrt gestattet für Triebfahrzeuge mit gehobenem Stromabnehmer und ausgeschaltetem Hauptschalter, sofern die Stromabnehmer für beide Systeme verwendet werden können.","c":true},{"l":"D","t":"Zonen-Schutzsstrecke - Halt für Einsystem-Triebfahrzeuge mit gehobenem Stromabnehmer, ausnahmslos für alle Triebfahrzeuge.","c":false}],"fdv":"7.2.4 Systemwechselsignal - Begriff: Umschaltsignal. Bedeutung: Die obere Zahl bezieht sich auf die Fahrleitungsspannung vor, die untere auf die Fahrleitungsspannung nach der Schutzstrecke. Halt für Einsystem-Triebfahrzeuge mit gehobenem Stromabnehmer; Halt für Mehrsystem-Triebfahrzeuge mit gehobenem Stromabnehmer. Ausnahme: Vorbeifahrt für Triebfahrzeuge mit gehobenem Stromabnehmer und ausgeschaltetem Hauptschalter gestattet, sofern die Stromabnehmer für beide Systeme verwendet werden können. Beziehung zu anderen Signalen: Bei Lichtsignalen geht ein Vorsignal voraus. Es folgt ein Endsignal.","note":"","optTags":{"A":[],"B":[],"C":[],"D":[]},"optNotes":{"A":"","B":"","C":"","D":""},"img":"images/image235.png","contentVersion":1},{"nr":382,"p":1,"term":"Endsignal zur Systemschutzstrecke (Ziff. 7.2.4)","approved":false,"q":"Wie lautet der Begriff dieses Signals gemäss FDV R 300.2, Ziff. 7.2.4, und was bedeutet es?","opts":[{"l":"A","t":"Endsignal zum Senksignal - Erlaubnis zum Heben der Stromabnehmer.","c":false},{"l":"B","t":"Umschaltsignal - Halt für Ein- und Mehrsystem-Triebfahrzeuge mit gehobenem Stromabnehmer.","c":false},{"l":"C","t":"Einschaltsignal - Weiterfahrt mit eingeschaltetem Hauptschalter.","c":false},{"l":"D","t":"Endsignal zur Systemschutzstrecke - Weiterfahrt mit dem betreffenden Stromsystem.","c":true}],"fdv":"7.2.4 Systemwechselsignal - Begriff: Endsignal zur Systemschutzstrecke. Bedeutung: Weiterfahrt mit dem betreffenden Stromsystem. Beziehung zu anderen Signalen: Es geht ein Umschaltsignal voraus.","note":"","optTags":{"A":[],"B":[],"C":[],"D":[]},"optNotes":{"A":"","B":"","C":"","D":""},"img":"images/image236.png","contentVersion":1},{"nr":383,"p":1,"term":"Stromabnehmersignal vor Systemschutzstrecken (Ziff. 7.2.1)","approved":false,"q":"Wie ist gemäss FDV R 300.2, Ziff. 7.2.1, der Anfang einer Systemschutzstrecke (zwischen Fahrleitungen verschiedener Stromsysteme) gekennzeichnet, die nur mit gesenktem Stromabnehmer befahren werden darf?","opts":[{"l":"A","t":"Mit dem Senksignal.","c":true},{"l":"B","t":"Mit dem Zonen-Schutzstreckensignal.","c":false},{"l":"C","t":"Mit dem Systemwechselsignal.","c":false},{"l":"D","t":"Mit dem Signal Streckentrennung.","c":false}],"fdv":"7.2.1 Stromabnehmersignal vor Systemschutzstrecken - Der Anfang einer Systemschutzstrecke (zwischen Fahrleitungen verschiedener Stromsysteme), die nur mit gesenktem Stromabnehmer befahren werden darf, ist mit dem Senksignal gekennzeichnet.","note":"","optTags":{"A":[],"B":[],"C":[],"D":[]},"optNotes":{"A":"","B":"","C":"","D":""},"contentVersion":1},{"nr":384,"p":1,"term":"Kennzeichnung Dauer-/fakultative Schutzstrecken (Ziff. 7.1.3)","approved":false,"q":"Wie sind gemäss FDV R 300.2, Ziff. 7.1.3, Anfang und Ende von Dauerschutzstrecken bzw. von fakultativen Schutzstrecken gekennzeichnet?","opts":[{"l":"A","t":"Dauerschutzstrecken: mit Signaltafeln. Fakultative Schutzstrecken: mit Lichtsignalen.","c":true},{"l":"B","t":"Dauerschutzstrecken: mit Lichtsignalen. Fakultative Schutzstrecken: mit Signaltafeln.","c":false},{"l":"C","t":"Beide Arten ausschliesslich mit Lichtsignalen.","c":false},{"l":"D","t":"Beide Arten ausschliesslich mit Signaltafeln.","c":false}],"fdv":"7.1.3 Signale für Schutzstrecken - Anfang und Ende von Dauerschutzstrecken sind mit Signaltafeln gekennzeichnet. Anfang und Ende von fakultativen Schutzstrecken sind mit Lichtsignalen gekennzeichnet.","note":"","optTags":{"A":[],"B":[],"C":[],"D":[]},"optNotes":{"A":"","B":"","C":"","D":""},"contentVersion":1},{"nr":385,"p":1,"term":"Halt – Gefahr - Bei Tag (Ziff. 8.1.1)","approved":false,"q":"Wie lautet der Begriff dieses Signals gemäss FDV R 300.2, Ziff. 8.1.1, und was bedeutet es?","opts":[{"l":"A","t":"Halt – Gefahr - Halt für Zugfahrten und Rangierbewegungen, unter Verwendung aller möglichen Bremsmittel.","c":true},{"l":"B","t":"Warnsignal - Halt für Zugfahrten und Rangierbewegungen auf parallel verlaufenden Gleisen.","c":false},{"l":"C","t":"Nothalt auf Arbeitsstellen - Halt für Zugfahrten und Rangierbewegungen.","c":false},{"l":"D","t":"Hilfssignal L - Zustimmung zur Vorbeifahrt am Halt zeigenden Hauptsignal und Fahrt auf Sicht.","c":false}],"fdv":"8.1.1 Haltsignal bei Gefahr - Muss eine Zugfahrt oder eine Rangierbewegung wegen drohender Gefahr angehalten werden, ist das Signal Halt – Gefahr zu geben. Bei Tag - Begriff: Halt – Gefahr. Bedeutung: Halt für Zugfahrten und Rangierbewegungen, unter Verwendung aller möglichen Bremsmittel. Das Signal ist in unmittelbarer Nähe des befahrenen Gleises, allenfalls mehrmals zu geben, wobei die Flagge bis zum Stillstand des Zuges oder der Rangierbewegung zu schwingen ist.","note":"","optTags":{"A":[],"B":[],"C":[],"D":[]},"optNotes":{"A":"","B":"","C":"","D":""},"img":"images/image237.png","contentVersion":1},{"nr":386,"p":1,"term":"Halt – Gefahr - Bei Nacht (Ziff. 8.1.1)","approved":false,"q":"Wie lautet der Begriff dieses Signals gemäss FDV R 300.2, Ziff. 8.1.1, und was bedeutet es?","opts":[{"l":"A","t":"Halt – Gefahr - Halt für Zugfahrten und Rangierbewegungen, unter Verwendung aller möglichen Bremsmittel.","c":true},{"l":"B","t":"Warnsignal - Halt für Zugfahrten und Rangierbewegungen auf parallel verlaufenden Gleisen.","c":false},{"l":"C","t":"Hilfssignal N - Zustimmung zur Vorbeifahrt am rot blinkenden Hauptsignal und Fahrt auf Sicht.","c":false},{"l":"D","t":"Bahnübergangsanlage gestört - Zustimmung zur Vorbeifahrt am rot blinkenden Hauptsignal und zum Befahren der gestörten Bahnübergangsanlage.","c":false}],"fdv":"8.1.1 Haltsignal bei Gefahr - Bei Nacht, rotes Licht - Begriff: Halt – Gefahr. Bedeutung: Halt für Zugfahrten und Rangierbewegungen, unter Verwendung aller möglichen Bremsmittel. Das Signal ist in unmittelbarer Nähe des befahrenen Gleises, allenfalls mehrmals zu geben, wobei das rote Licht bis zum Stillstand des Zuges oder der Rangierbewegung zu schwingen ist. Steht keine rote Flagge oder rotes Licht zur Verfügung, kann das Signal auch mit der Hand oder mit weissem Licht gegeben werden. Der LF gibt das Signal mit der Lokpfeife.","note":"","optTags":{"A":[],"B":[],"C":[],"D":[]},"optNotes":{"A":"","B":"","C":"","D":""},"img":"images/image238.png","contentVersion":1},{"nr":387,"p":1,"term":"Warnsignal (Ziff. 8.1.2)","approved":false,"q":"Wie lautet der Begriff dieses Signals gemäss FDV R 300.2, Ziff. 8.1.2, und was bedeutet es?","opts":[{"l":"A","t":"Halt – Gefahr - Halt für Zugfahrten und Rangierbewegungen, unter Verwendung aller möglichen Bremsmittel.","c":false},{"l":"B","t":"Warnsignal - Halt für Zugfahrten und Rangierbewegungen auf parallel verlaufenden Gleisen.","c":true},{"l":"C","t":"Nothalt auf Arbeitsstellen - Halt für Zugfahrten und Rangierbewegungen.","c":false},{"l":"D","t":"Hilfssignal L - Zustimmung zur Vorbeifahrt am Halt zeigenden oder unbeleuchteten Hauptsignal und Fahrt auf Sicht.","c":false}],"fdv":"8.1.2 Warnsignal - Begriff: Warnsignal. Bedeutung: Halt für Zugfahrten und Rangierbewegungen auf parallel verlaufenden Gleisen. Das Signal kann an den Fahrzeugen mit mehreren roten Lichtern oder mit einem rot blinkenden Rundumlicht gegeben werden.","note":"","optTags":{"A":[],"B":[],"C":[],"D":[]},"optNotes":{"A":"","B":"","C":"","D":""},"img":"images/image239.png","contentVersion":1},{"nr":388,"p":1,"term":"Nothalt auf Arbeitsstellen (Ziff. 8.1.3)","approved":false,"q":"Wie lautet der Begriff dieses Signals gemäss FDV R 300.2, Ziff. 8.1.3, und was bedeutet es?","opts":[{"l":"A","t":"Halt – Gefahr - Halt für Zugfahrten und Rangierbewegungen, unter Verwendung aller möglichen Bremsmittel.","c":false},{"l":"B","t":"Warnsignal - Halt für Zugfahrten und Rangierbewegungen auf parallel verlaufenden Gleisen.","c":false},{"l":"C","t":"Nothalt auf Arbeitsstellen - Halt für Zugfahrten und Rangierbewegungen.","c":true},{"l":"D","t":"Bahnübergangsanlage gestört - Zustimmung zur Vorbeifahrt am rot blinkenden Hauptsignal und zum Befahren der gestörten Bahnübergangsanlage.","c":false}],"fdv":"8.1.3 Nothalt auf Arbeitsstellen - Mehrere rote Lichter - Begriff: Nothalt auf Arbeitsstellen. Bedeutung: Halt für Zugfahrten und Rangierbewegungen.","note":"","optTags":{"A":[],"B":[],"C":[],"D":[]},"optNotes":{"A":"","B":"","C":"","D":""},"img":"images/image241.png","contentVersion":1},{"nr":389,"p":1,"term":"Hilfssignal L (Ziff. 8.2.2)","approved":false,"q":"Wie lautet der Begriff dieses Signals gemäss FDV R 300.2, Ziff. 8.2.2, und was bedeutet es?","opts":[{"l":"A","t":"Hilfssignal N - Zustimmung zur Vorbeifahrt am rot blinkenden Hauptsignal und Fahrt auf Sicht.","c":false},{"l":"B","t":"Bahnübergangsanlage gestört - Zustimmung zur Vorbeifahrt am rot blinkenden Hauptsignal und zum Befahren der gestörten Bahnübergangsanlage.","c":false},{"l":"C","t":"Warnsignal - Halt für Zugfahrten und Rangierbewegungen auf parallel verlaufenden Gleisen.","c":false},{"l":"D","t":"Hilfssignal L - Zustimmung zur Vorbeifahrt am Halt zeigenden oder unbeleuchteten Hauptsignal bzw. am rot blinkenden Hauptsignal, und Fahrt auf Sicht.","c":true}],"fdv":"8.2.2 Hilfssignal beim Signalsystem L - Begriff: Hilfssignal L. Bedeutung: Zustimmung zur Vorbeifahrt am Halt zeigenden oder unbeleuchteten Hauptsignal (Bild 807) bzw. am rot blinkenden Hauptsignal (Bild 809), und Fahrt auf Sicht. Beziehung zu anderen Signalen: Am nächsten Signal ist Halt zu erwarten, bzw. Warnung, sofern es sich um ein Vorsignal handelt. Das Hilfssignal befindet sich am gleichen Standort wie das zugehörige Halt zeigende oder unbeleuchtete Hauptsignal (Bild 807).","note":"","optTags":{"A":[],"B":[],"C":[],"D":[]},"optNotes":{"A":"","B":"","C":"","D":""},"img":"images/image242.png","contentVersion":1},{"nr":390,"p":1,"term":"Hilfssignal N (Ziff. 8.2.2)","approved":false,"q":"Wie lautet der Begriff dieses Signals gemäss FDV R 300.2, Ziff. 8.2.2, und was bedeutet es?","opts":[{"l":"A","t":"Hilfssignal N - Zustimmung zur Vorbeifahrt am rot blinkenden Hauptsignal und Fahrt auf Sicht.","c":true},{"l":"B","t":"Hilfssignal L - Zustimmung zur Vorbeifahrt am Halt zeigenden oder unbeleuchteten Hauptsignal bzw. am rot blinkenden Hauptsignal, und Fahrt auf Sicht.","c":false},{"l":"C","t":"Bahnübergangsanlage gestört - Zustimmung zur Vorbeifahrt am rot blinkenden Hauptsignal und zum Befahren der gestörten Bahnübergangsanlage.","c":false},{"l":"D","t":"Warnsignal - Halt für Zugfahrten und Rangierbewegungen auf parallel verlaufenden Gleisen.","c":false}],"fdv":"8.2.2 Hilfssignal beim Signalsystem N - Begriff: Hilfssignal N. Bedeutung: Zustimmung zur Vorbeifahrt am rot blinkenden Hauptsignal und Fahrt auf Sicht. Beziehung zu anderen Signalen: Am nächsten Signal ist Halt bzw. Warnung zu erwarten. Nach einer Merktafel für Streckengeschwindigkeit folgt kein Halt zeigendes Hauptsignal.","note":"","optTags":{"A":[],"B":[],"C":[],"D":[]},"optNotes":{"A":"","B":"","C":"","D":""},"img":"images/image244.png","contentVersion":1},{"nr":391,"p":1,"term":"Bahnübergangsanlage gestört (Ziff. 8.2.3)","approved":false,"q":"Wie lautet der Begriff dieses Signals gemäss FDV R 300.2, Ziff. 8.2.3, und was bedeutet es?","opts":[{"l":"A","t":"Hilfssignal N - Zustimmung zur Vorbeifahrt am rot blinkenden Hauptsignal und Fahrt auf Sicht.","c":false},{"l":"B","t":"Bahnübergangsanlage gestört - Zustimmung zur Vorbeifahrt am rot blinkenden Hauptsignal und zum Befahren der gestörten Bahnübergangsanlage.","c":true},{"l":"C","t":"Hilfssignal L - Zustimmung zur Vorbeifahrt am Halt zeigenden oder unbeleuchteten Hauptsignal bzw. am rot blinkenden Hauptsignal, und Fahrt auf Sicht.","c":false},{"l":"D","t":"Halt – Gefahr - Halt für Zugfahrten und Rangierbewegungen, unter Verwendung aller möglichen Bremsmittel.","c":false}],"fdv":"8.2.3 Hauptsignal gestörte Bahnübergangsanlage beim Signalsystem L - Begriff: Bahnübergangsanlage gestört. Bedeutung: Zustimmung zur Vorbeifahrt am rot blinkenden Hauptsignal und zum Befahren der gestörten Bahnübergangsanlage. Die im Bereich des Signals kontrollierten Fahrstrassenelemente und der zugehörige Streckenblock funktionieren normal. Beziehung zu anderen Signalen: Es kann ein Warnung zeigendes Vorsignal vorausgehen.","note":"","optTags":{"A":[],"B":[],"C":[],"D":[]},"optNotes":{"A":"","B":"","C":"","D":""},"img":"images/image245.png","contentVersion":1},{"nr":392,"p":1,"term":"Bahnübergangsanlage gestört - mehrere Anlagen (Ziff. 8.2.3)","approved":false,"q":"Was gilt gemäss FDV R 300.2, Ziff. 8.2.3, wenn ein Hauptsignal mit dem Signal 'Bahnübergangsanlage gestört' mehr als eine Bahnübergangsanlage überwacht?","opts":[{"l":"A","t":"Die Anzahl wird auf der Zusatzsignalisierung angegeben. In einer Zone mit Verschachtelung von Bahnübergangsanlagen ist auf die Zusatztafel zu verzichten.","c":true},{"l":"B","t":"Das Signal darf in diesem Fall nicht verwendet werden.","c":false},{"l":"C","t":"Es ist für jede Bahnübergangsanlage ein separates Hauptsignal mit eigenem Hilfssignal zu errichten.","c":false},{"l":"D","t":"Die Anzahl wird dem Lokführer ausschliesslich fernmündlich mitgeteilt, eine Zusatzsignalisierung ist nicht vorgesehen.","c":false}],"fdv":"8.2.3 Hauptsignal gestörte Bahnübergangsanlage beim Signalsystem L - Überwacht das Hauptsignal mehr als eine Bahnübergangsanlage, wird die Anzahl auf der Zusatzsignalisierung angegeben. In einer Zone mit Verschachtelung von Bahnübergangsanlagen ist auf die Zusatztafel zu verzichten.","note":"","optTags":{"A":[],"B":[],"C":[],"D":[]},"optNotes":{"A":"","B":"","C":"","D":""},"contentVersion":1},{"nr":393,"p":1,"term":"Kennzeichnung ungültiges Signal (Ziff. 9.1.1)","approved":false,"q":"Wodurch wird ein ungültiges Signal gemäss FDV R 300.2, Ziff. 9.1.1, gekennzeichnet (siehe Bild)?","opts":[{"l":"A","t":"Durch ein schwarz-weisses Kreuz oder dadurch, dass es verhüllt ist.","c":true},{"l":"B","t":"Durch ein rot-weisses Kreuz oder dadurch, dass es blinkt.","c":false},{"l":"C","t":"Durch einen dreieckigen weissen Aufsatz.","c":false},{"l":"D","t":"Durch das dauernde Zeigen des Signalbilds Halt.","c":false}],"fdv":"9.1.1 Kennzeichnung - Ein ungültiges Signal ist durch ein schwarz-weisses Kreuz gekennzeichnet oder es ist verhüllt.","note":"","optTags":{"A":[],"B":[],"C":[],"D":[]},"optNotes":{"A":"","B":"","C":"","D":""},"img":"images/image246.png","contentVersion":1},{"nr":394,"p":1,"term":"Signalbild bei mehreren Signalen am gleichen Standort (Ziff. 9.1.2)","approved":false,"q":"Welches Signal ist gemäss FDV R 300.2, Ziff. 9.1.2 gültig, wenn mehrere Signale am gleichen Standort angebracht sind (siehe Bild)?","opts":[{"l":"A","t":"Immer das obere der beiden Signale, unabhängig von einer Kennzeichnung.","c":false},{"l":"B","t":"Das nicht mit einem Kreuz versehene bzw. nicht verhüllte Signal.","c":true},{"l":"C","t":"Immer das untere der beiden Signale, unabhängig von einer Kennzeichnung.","c":false},{"l":"D","t":"Beide Signale gelten gleichzeitig als gültig.","c":false}],"fdv":"9.1.2 Signalbild - Sind mehrere Signale am gleichen Standort angebracht, sind die nicht mit einem Kreuz versehenen oder nicht verhüllten Signale gültig. Ungültige Signale zeigen kein Signalbild. Zu Prüfzwecken dürfen diese ein Signalbild zeigen, sofern keine Verwechslungsgefahr besteht.","note":"","optTags":{"A":[],"B":[],"C":[],"D":[]},"optNotes":{"A":"","B":"","C":"","D":""},"img":"images/image247.png","contentVersion":1},{"nr":395,"p":1,"term":"Lichtsignale mit dreieckigem Aufsatz (Ziff. 9.2.1)","approved":false,"q":"Was bedeutet der dreieckige weisse Aufsatz an einem Lichtsignal gemäss FDV R 300.2, Ziff. 9.2.1 (siehe Bild)?","opts":[{"l":"A","t":"Das Lichtsignal ist ungültig und darf nicht beachtet werden.","c":false},{"l":"B","t":"Das Lichtsignal zeigt damit zusätzlich Warnung an.","c":false},{"l":"C","t":"Das Lichtsignal ist zeitweise gültig; in unbeleuchtetem Zustand ist es ohne Bedeutung.","c":true},{"l":"D","t":"Das Lichtsignal gilt nur für Rangierbewegungen.","c":false}],"fdv":"9.2.1 Lichtsignale mit dreieckigem Aufsatz - Ein zeitweise gültiges Lichtsignal trägt einen dreieckigen weissen Aufsatz. Bedeutung: Das Lichtsignal ist in unbeleuchtetem Zustand ohne Bedeutung.","note":"","optTags":{"A":[],"B":[],"C":[],"D":[]},"optNotes":{"A":"","B":"","C":"","D":""},"img":"images/image248.png","contentVersion":1},{"nr":396,"p":1,"term":"Lichtsignale ohne dreieckigen Aufsatz, unbeleuchtet ohne Bedeutung (Ziff. 9.2.2)","approved":false,"q":"Welche der folgenden Lichtsignale sind gemäss FDV R 300.2, Ziff. 9.2.2, auch ohne dreieckigen Aufsatz in unbeleuchtetem Zustand ohne Bedeutung (Mehrfachauswahl)?","opts":[{"l":"A","t":"Besetztsignal System L","c":true},{"l":"B","t":"Gleisnummernsignal","c":true},{"l":"C","t":"Richtungssignal","c":true},{"l":"D","t":"Hauptsignal","c":false},{"l":"E","t":"Vorsignal","c":false},{"l":"F","t":"Hilfssignal System L","c":true},{"l":"G","t":"Signal für Bedarfshalt","c":true}],"fdv":"9.2.2 Lichtsignale ohne dreieckigen Aufsatz - Folgende Lichtsignale sind in unbeleuchtetem Zustand ohne Bedeutung: Besetztsignal System L, Signal für gleichzeitige Einfahrten, Gleisnummernsignal, Richtungssignal, Hilfssignal System L, Signal für Bedarfshalt, Signal für fakultative Schutzstrecke, Zonen-Schutzstreckensignal, Systemwechselsignal. Hauptsignale und Vorsignale gehören nicht zu dieser Liste - bei deren Dunkelsein ist das Hilfssignal-Verfahren massgebend.","note":"","optTags":{"A":[],"B":[],"C":[],"D":[],"E":[],"F":[],"G":[]},"optNotes":{"A":"","B":"","C":"","D":"","E":"","F":"","G":""},"contentVersion":1},{"nr":397,"p":1,"term":"Optische Alarmanlage (Ziff. 10.1.1)","approved":false,"q":"Wie lautet der Begriff dieses Signals gemäss FDV R 300.2, Ziff. 10.1.1, und was bedeutet es?","opts":[{"l":"A","t":"Optische Alarmanlage - Unterstützt die abgegebenen akustischen Alarmsignale oder ersetzt solche gemäss Weisung der ISB.","c":true},{"l":"B","t":"Alarmsignal Gefahr - Unmittelbare Gefahr.","c":false},{"l":"C","t":"Alarmsignal 1 - Es erfolgt eine Fahrt auf dem Nachbargleis.","c":false},{"l":"D","t":"Hindernis für Schneeräumung - Heben der Pflugschar bzw. der Schleudereinrichtung.","c":false}],"fdv":"10.1.1 Optischer Alarm - Begriff: Optische Alarmanlage. Bedeutung: Unterstützt die abgegebenen akustischen Alarmsignale oder ersetzt solche gemäss Weisung der ISB.","note":"","optTags":{"A":[],"B":[],"C":[],"D":[]},"optNotes":{"A":"","B":"","C":"","D":""},"img":"images/image249.png","contentVersion":1},{"nr":398,"p":1,"term":"Alarmsignal 1 (Ziff. 10.1.2)","approved":false,"q":"Wie lautet der Begriff dieses Signals gemäss FDV R 300.2, Ziff. 10.1.2, und was bedeutet es?","opts":[{"l":"A","t":"Alarmsignal 2 - Es erfolgt eine Fahrt auf dem Arbeits- oder Nachbargleis.","c":false},{"l":"B","t":"Alarmsignal 1 - Es erfolgt eine Fahrt auf dem Nachbargleis.","c":true},{"l":"C","t":"Alarmsignal Gefahr - Unmittelbare Gefahr.","c":false},{"l":"D","t":"Optische Alarmanlage - Unterstützt die abgegebenen akustischen Alarmsignale.","c":false}],"fdv":"10.1.2 Akustischer Alarm - 1 langer Ton auf- und absteigend oder konstant, mit akustischem Alarmmittel. Begriff: Alarmsignal 1. Bedeutung: Es erfolgt eine Fahrt auf dem Nachbargleis.","note":"","optTags":{"A":[],"B":[],"C":[],"D":[]},"optNotes":{"A":"","B":"","C":"","D":""},"img":"images/image250.png","contentVersion":1},{"nr":399,"p":1,"term":"Alarmsignal 2 (Ziff. 10.1.2)","approved":false,"q":"Wie lautet der Begriff dieses Signals gemäss FDV R 300.2, Ziff. 10.1.2, und was bedeutet es?","opts":[{"l":"A","t":"Alarmsignal 2 - Es erfolgt eine Fahrt auf dem Arbeits- oder Nachbargleis.","c":true},{"l":"B","t":"Alarmsignal 1 - Es erfolgt eine Fahrt auf dem Nachbargleis.","c":false},{"l":"C","t":"Alarmsignal Gefahr - Unmittelbare Gefahr.","c":false},{"l":"D","t":"Optische Alarmanlage - Unterstützt die abgegebenen akustischen Alarmsignale.","c":false}],"fdv":"10.1.2 Akustischer Alarm - 2 lange Töne auf- und absteigend oder konstant, mit akustischem Alarmmittel. Begriff: Alarmsignal 2. Bedeutung: Es erfolgt eine Fahrt auf dem Arbeits- oder Nachbargleis.","note":"","optTags":{"A":[],"B":[],"C":[],"D":[]},"optNotes":{"A":"","B":"","C":"","D":""},"img":"images/image251.png","contentVersion":1},{"nr":400,"p":1,"term":"Alarmsignal Gefahr (Ziff. 10.1.2)","approved":false,"q":"Wie lautet der Begriff dieses Signals gemäss FDV R 300.2, Ziff. 10.1.2, und was bedeutet es?","opts":[{"l":"A","t":"Alarmsignal 2 - Es erfolgt eine Fahrt auf dem Arbeits- oder Nachbargleis.","c":false},{"l":"B","t":"Alarmsignal 1 - Es erfolgt eine Fahrt auf dem Nachbargleis.","c":false},{"l":"C","t":"Alarmsignal Gefahr - Unmittelbare Gefahr.","c":true},{"l":"D","t":"Optische Alarmanlage - Unterstützt die abgegebenen akustischen Alarmsignale.","c":false}],"fdv":"10.1.2 Akustischer Alarm - Mindestens 4 rasch aufeinanderfolgende Töne, mit akustischem Alarmmittel. Begriff: Alarmsignal Gefahr. Bedeutung: Unmittelbare Gefahr.","note":"","optTags":{"A":[],"B":[],"C":[],"D":[]},"optNotes":{"A":"","B":"","C":"","D":""},"img":"images/image252.png","contentVersion":1},{"nr":401,"p":1,"term":"Hindernis für Schneeräumung (Ziff. 10.2)","approved":false,"q":"Wie lautet der Begriff dieses Signals gemäss FDV R 300.2, Ziff. 10.2, und was bedeutet es?","opts":[{"l":"A","t":"Beginn Grundwasserschutzzone - keine Bedeutung für Schneeräumung.","c":false},{"l":"B","t":"Alarmsignal Gefahr - Unmittelbare Gefahr.","c":false},{"l":"C","t":"Optische Alarmanlage - Unterstützt die abgegebenen akustischen Alarmsignale.","c":false},{"l":"D","t":"Hindernis für Schneeräumung - Heben der Pflugschar bzw. der Schleudereinrichtung.","c":true}],"fdv":"10.2 Merkzeichen für Schneeräumung - Bauten, die die Schneeräumung auf der Strecke behindern, sind mit Merkzeichen gekennzeichnet. Bei langen Hindernissen, z.B. Bahnübergängen, können am Anfang und am Ende Merkzeichen aufgestellt sein. Begriff: Hindernis für Schneeräumung. Bedeutung: Heben der Pflugschar bzw. der Schleudereinrichtung. Es sind auch andere Kennzeichnungen zugelassen.","note":"","optTags":{"A":[],"B":[],"C":[],"D":[]},"optNotes":{"A":"","B":"","C":"","D":""},"img":"images/image253.png","contentVersion":1},{"nr":402,"p":1,"term":"Beginn Grundwasserschutzzone (Ziff. 10.3)","approved":false,"q":"Wie lautet der Begriff dieses Signals gemäss FDV R 300.2, Ziff. 10.3, und was bedeutet es?","opts":[{"l":"A","t":"Beginn Grundwasserschutzzone.","c":true},{"l":"B","t":"Ende Grundwasserschutzzone.","c":false},{"l":"C","t":"Beginn Fassungsbereich einer Grundwasserschutzzone.","c":false},{"l":"D","t":"Ende Fassungsbereich einer Grundwasserschutzzone.","c":false}],"fdv":"10.3 Merktafeln für Grundwasserschutzzone - Die bei der Unkrautvertilgung zu schützenden Grundwasserzonen sind mit Merktafeln gekennzeichnet. Die Tafeln stehen in Bodennähe. Begriff: Beginn Grundwasserschutzzone.","note":"","optTags":{"A":[],"B":[],"C":[],"D":[]},"optNotes":{"A":"","B":"","C":"","D":""},"img":"images/image254.png","contentVersion":1},{"nr":403,"p":1,"term":"Ende Grundwasserschutzzone (Ziff. 10.3)","approved":false,"q":"Wie lautet der Begriff dieses Signals gemäss FDV R 300.2, Ziff. 10.3, und was bedeutet es?","opts":[{"l":"A","t":"Beginn Grundwasserschutzzone.","c":false},{"l":"B","t":"Ende Grundwasserschutzzone.","c":true},{"l":"C","t":"Beginn Fassungsbereich einer Grundwasserschutzzone.","c":false},{"l":"D","t":"Ende Fassungsbereich einer Grundwasserschutzzone.","c":false}],"fdv":"10.3 Merktafeln für Grundwasserschutzzone - Die bei der Unkrautvertilgung zu schützenden Grundwasserzonen sind mit Merktafeln gekennzeichnet. Die Tafeln stehen in Bodennähe. Begriff: Ende Grundwasserschutzzone.","note":"","optTags":{"A":[],"B":[],"C":[],"D":[]},"optNotes":{"A":"","B":"","C":"","D":""},"img":"images/image255.png","contentVersion":1},{"nr":404,"p":1,"term":"Beginn Fassungsbereich einer Grundwasserschutzzone (Ziff. 10.3)","approved":false,"q":"Wie lautet der Begriff dieses Signals gemäss FDV R 300.2, Ziff. 10.3, und was bedeutet es?","opts":[{"l":"A","t":"Beginn Grundwasserschutzzone.","c":false},{"l":"B","t":"Ende Grundwasserschutzzone.","c":false},{"l":"C","t":"Beginn Fassungsbereich einer Grundwasserschutzzone.","c":true},{"l":"D","t":"Ende Fassungsbereich einer Grundwasserschutzzone.","c":false}],"fdv":"10.3 Merktafeln für Grundwasserschutzzone - Die bei der Unkrautvertilgung zu schützenden Grundwasserzonen sind mit Merktafeln gekennzeichnet. Die Tafeln stehen in Bodennähe. Begriff: Beginn Fassungsbereich einer Grundwasserschutzzone.","note":"","optTags":{"A":[],"B":[],"C":[],"D":[]},"optNotes":{"A":"","B":"","C":"","D":""},"img":"images/image256.png","contentVersion":1},{"nr":405,"p":1,"term":"Ende Fassungsbereich einer Grundwasserschutzzone (Ziff. 10.3)","approved":false,"q":"Wie lautet der Begriff dieses Signals gemäss FDV R 300.2, Ziff. 10.3, und was bedeutet es?","opts":[{"l":"A","t":"Beginn Grundwasserschutzzone.","c":false},{"l":"B","t":"Ende Grundwasserschutzzone.","c":false},{"l":"C","t":"Beginn Fassungsbereich einer Grundwasserschutzzone.","c":false},{"l":"D","t":"Ende Fassungsbereich einer Grundwasserschutzzone.","c":true}],"fdv":"10.3 Merktafeln für Grundwasserschutzzone - Die bei der Unkrautvertilgung zu schützenden Grundwasserzonen sind mit Merktafeln gekennzeichnet. Die Tafeln stehen in Bodennähe. Begriff: Ende Fassungsbereich einer Grundwasserschutzzone.","note":"","optTags":{"A":[],"B":[],"C":[],"D":[]},"optNotes":{"A":"","B":"","C":"","D":""},"img":"images/image257.png","contentVersion":1},{"nr":406,"p":1,"term":"Signale für Arbeiten im Gleisbereich - Geltung für LF (Ziff. 10)","approved":false,"q":"Welche Bedeutung haben Signale für Arbeiten im Gleisbereich gemäss FDV R 300.2, Ziff. 10, für den Lokführer (LF)?","opts":[{"l":"A","t":"Sie sind für den LF als Haltsignal zu behandeln.","c":false},{"l":"B","t":"Sie sind für den LF als Warnsignal zu behandeln.","c":false},{"l":"C","t":"Sie haben für den LF keine Bedeutung.","c":true},{"l":"D","t":"Sie sind für den LF nur bei Dunkelheit massgebend.","c":false}],"fdv":"10 Signale für Arbeiten im Gleisbereich - Signale für Arbeiten im Gleisbereich haben für den LF keine Bedeutung.","note":"","optTags":{"A":[],"B":[],"C":[],"D":[]},"optNotes":{"A":"","B":"","C":"","D":""},"contentVersion":1},{"nr":407,"p":1,"term":"Kurze Fahrt (Fahrbegriff 6) - Streckentabelle","approved":true,"q":"Welche Aussage zur Geschwindigkeit beim Signal «Kurze Fahrt» (Fahrbegriff 6) trifft gemäss FDV R 300.2, Ziff. 5.2.8 zu?","opts":[{"l":"A","t":"Ist in der Streckentabelle eine kleinere Geschwindigkeit als 40 km/h aufgeführt, ist diese massgebend.","c":true},{"l":"B","t":"Die Geschwindigkeit von 40 km/h gilt immer, unabhängig davon, was in der Streckentabelle steht.","c":false},{"l":"C","t":"Die Streckentabelle ist bei «Kurze Fahrt» nicht relevant, das Signal hat immer Vorrang.","c":false},{"l":"D","t":"Ist in der Streckentabelle eine höhere Geschwindigkeit als 40 km/h aufgeführt, ist diese massgebend.","c":false}],"fdv":"Kurze Fahrt - Begriff: Kurze Fahrt (Fahrbegriff 6). Bedeutung: Ab diesem Signal bzw. den zugehörigen Weichen gilt die Höchstgeschwindigkeit 40 km/h. Ist in der Streckentabelle eine kleinere Geschwindigkeit aufgeführt, ist diese gültig.","note":"","optTags":{"A":[],"B":[],"C":[],"D":[]},"optNotes":{"A":"","B":"","C":"","D":""},"contentVersion":1},{"nr":408,"p":1,"term":"Kurze Fahrt (Fahrbegriff 6) - nächstes Signal","approved":true,"q":"Was gilt beim Signal «Kurze Fahrt» (Fahrbegriff 6) gemäss FDV R 300.2, Ziff. 5.2.8 bezüglich des nächsten Signals?","opts":[{"l":"A","t":"Das nächste Signal steht im normalen Blockabstand, wie bei den übrigen Fahrbegriffen.","c":false},{"l":"B","t":"Das nächste Signal steht in verkürztem Abstand.","c":true},{"l":"C","t":"Es folgt kein weiteres Signal mehr, die Fahrt endet ohne weitere Signalisierung.","c":false},{"l":"D","t":"Das nächste Signal ist ein Vorsignal in doppeltem Abstand.","c":false}],"fdv":"Kurze Fahrt - Begriff: Kurze Fahrt (Fahrbegriff 6). Bedeutung: ... Das nächste Signal steht in verkürztem Abstand.","note":"","optTags":{"A":[],"B":[],"C":[],"D":[]},"optNotes":{"A":"","B":"","C":"","D":""},"contentVersion":1},{"nr":409,"p":1,"term":"Kurze Fahrt (Fahrbegriff 6) - Beziehung zu anderen Signalen","approved":true,"q":"Welche Aussage zur Beziehung zu anderen Signalen trifft beim Signal «Kurze Fahrt» (Fahrbegriff 6) gemäss FDV R 300.2, Ziff. 5.2.8 zu?","opts":[{"l":"A","t":"Das nächste Signal zeigt Halt. Dem Signal kann auch ein Sperrsignal oder ein Gleisabschluss mit rotem Licht folgen.","c":true},{"l":"B","t":"Das nächste Signal zeigt immer Freie Fahrt.","c":false},{"l":"C","t":"Dem Signal kann kein Sperrsignal und kein Gleisabschluss folgen, da «Kurze Fahrt» dies ausschliesst.","c":false},{"l":"D","t":"Das nächste Signal zeigt Warnung, niemals Halt.","c":false}],"fdv":"Kurze Fahrt - Beziehung zu anderen Signalen: Das nächste Signal zeigt Halt. Dem Signal kann auch ein Sperrsignal oder ein Gleisabschluss mit rotem Licht folgen.","note":"","optTags":{"A":[],"B":[],"C":[],"D":[]},"optNotes":{"A":"","B":"","C":"","D":""},"contentVersion":1},{"nr":410,"p":1,"term":"Besetztes Gleis (beim Vorsignal) - Beziehung zu anderen Signalen","approved":true,"q":"Welche Aussage zur Beziehung zu anderen Signalen trifft beim Signal «Besetztes Gleis» (beim Vorsignal) gemäss FDV R 300.2, Ziff. 5.3.1 zu?","opts":[{"l":"A","t":"Bei beleuchtetem Besetztsignal zeigt das vorausgehende Signal immer Freie Fahrt.","c":false},{"l":"B","t":"Bei beleuchtetem Besetztsignal zeigt das vorausgehende Signal Geschwindigkeitsankündigung oder -ausführung 40 km/h. Das zugehörige Signal zeigt Warnung.","c":true},{"l":"C","t":"Das zugehörige Signal zeigt bei beleuchtetem Besetztsignal Halt statt Warnung.","c":false},{"l":"D","t":"Das vorausgehende Signal bleibt bei beleuchtetem Besetztsignal unverändert und zeigt weiterhin Fahrt.","c":false}],"fdv":"Besetztsignal (beim Vorsignal) - Beziehung zu anderen Signalen: Bei beleuchtetem Besetztsignal zeigt das vorausgehende Signal Geschwindigkeitsankündigung oder -ausführung 40 km/h. Das zugehörige Signal zeigt Warnung.","note":"","optTags":{"A":[],"B":[],"C":[],"D":[]},"optNotes":{"A":"","B":"","C":"","D":""},"contentVersion":1},{"nr":411,"p":1,"term":"Geltungsbereich (Ziff. 1.1)","approved":true,"q":"Was regeln die Vorschriften der FDV R 300.3 gemäss Ziff. 1.1 (Geltungsbereich)?","opts":[{"l":"A","t":"Das Vorgehen bei der Übermittlung von Nachrichten und die Verwendung der jeweiligen Mittel.","c":true},{"l":"B","t":"Ausschliesslich die technische Steuerung von Datenübermittlungseinrichtungen.","c":false},{"l":"C","t":"Die automatisierten Warnverfahren auf Arbeitsstellen, inklusive deren technischer Konfiguration.","c":false},{"l":"D","t":"Die Signalisierung und Bedeutung der ortsfesten Signale.","c":false}],"fdv":"Geltungsbereich - Begriff: Geltungsbereich. Bedeutung: Diese Vorschriften regeln das Vorgehen bei der Übermittlung von Nachrichten und die Verwendung der jeweiligen Mittel.","note":"","optTags":{"A":[],"B":[],"C":[],"D":[]},"optNotes":{"A":"","B":"","C":"","D":""},"contentVersion":1},{"nr":412,"p":1,"term":"Geltungsbereich - Ausnahmen (Ziff. 1.1)","approved":true,"q":"Was ist gemäss FDV R 300.3, Ziff. 1.1 NICHT Gegenstand dieser Vorschriften?","opts":[{"l":"A","t":"Datenübermittlung für die Steuerung technischer Einrichtungen sowie besondere automatisierte Warnverfahren (z.B. automatische Warnsysteme auf Arbeitsstellen).","c":true},{"l":"B","t":"Die Übermittlung von Nachrichten und die Verwendung der jeweiligen Mittel.","c":false},{"l":"C","t":"Die Sprache bei der mündlichen Übermittlung.","c":false},{"l":"D","t":"Die Kundeninformation bei Betriebsstörungen.","c":false}],"fdv":"Geltungsbereich - Bedeutung: Nicht Gegenstand dieser Vorschriften sind: Datenübermittlung für die Steuerung technischer Einrichtungen; besondere, automatisierte Warnverfahren (z.B. automatische Warnsysteme auf Arbeitsstellen).","note":"","optTags":{"A":[],"B":[],"C":[],"D":[]},"optNotes":{"A":"","B":"","C":"","D":""},"contentVersion":1},{"nr":413,"p":1,"term":"Sicherheit und sicherheitsrelevante Kommunikation (Ziff. 1.2)","approved":true,"q":"Welche Aussage zur sicherheitsrelevanten Kommunikation trifft gemäss FDV R 300.3, Ziff. 1.2 zu?","opts":[{"l":"A","t":"Die Sicherheit darf keinesfalls vom Zustandekommen einer Kommunikationsverbindung abhängig sein; sicherheitsrelevante Kommunikation hat Vorrang vor jeder anderen Kommunikation.","c":true},{"l":"B","t":"Sicherheitsrelevante Kommunikation wird gleichberechtigt mit anderen Kommunikationsarten behandelt.","c":false},{"l":"C","t":"Die Sicherheit darf von einer funktionierenden Kommunikationsverbindung abhängig gemacht werden, wenn keine Alternative besteht.","c":false},{"l":"D","t":"Sicherheitsrelevante Kommunikation hat nur bei Rangierbewegungen Vorrang.","c":false}],"fdv":"Sicherheit und sicherheitsrelevante Kommunikation - Bedeutung: Die Sicherheit darf keinesfalls vom Zustandekommen einer Kommunikationsverbindung abhängig sein. Sicherheitsrelevante Kommunikation hat Vorrang vor jeder anderen Kommunikation.","note":"","optTags":{"A":[],"B":[],"C":[],"D":[]},"optNotes":{"A":"","B":"","C":"","D":""},"contentVersion":1},{"nr":414,"p":1,"term":"Sprache - mündliche Übermittlung (Ziff. 1.3)","approved":true,"q":"Welche Sprache ist gemäss FDV R 300.3, Ziff. 1.3 für die mündliche Übermittlung zulässig?","opts":[{"l":"A","t":"Die Landessprachen (Dialekt); bei Uneinigkeit oder Verständigungsschwierigkeiten ist die örtliche Amtssprache anzuwenden.","c":true},{"l":"B","t":"Ausschliesslich die Amtssprache (Schriftsprache), Dialekt ist nicht zulässig.","c":false},{"l":"C","t":"Jede beliebige Sprache, auch wenn sich die Gesprächsteilnehmer nicht verständigen können.","c":false},{"l":"D","t":"Nur Englisch als internationale Verkehrssprache.","c":false}],"fdv":"Sprache - Bedeutung: Für die mündliche Übermittlung dürfen die Landessprachen (Dialekt) verwendet werden. Bei Uneinigkeit der am Gespräch Beteiligten und bei Verständigungsschwierigkeiten ist die örtliche Amtssprache anzuwenden.","note":"","optTags":{"A":[],"B":[],"C":[],"D":[]},"optNotes":{"A":"","B":"","C":"","D":""},"contentVersion":1},{"nr":415,"p":1,"term":"Sprache - schriftliche Übermittlung (Ziff. 1.3)","approved":true,"q":"Welche Sprache ist gemäss FDV R 300.3, Ziff. 1.3 für die schriftliche Übermittlung anzuwenden, und wer regelt die gegenseitigen sprachlichen Schnittstellen?","opts":[{"l":"A","t":"Die Amtssprachen (Schriftsprache); die ISB regeln die gegenseitigen sprachlichen Schnittstellen in den Betriebsvorschriften.","c":true},{"l":"B","t":"Die Landessprache (Dialekt); die EVU regeln die sprachlichen Schnittstellen.","c":false},{"l":"C","t":"Eine beliebige Sprache nach Wahl des Verfassers; es gibt keine Regelung der Schnittstellen.","c":false},{"l":"D","t":"Die Amtssprachen; die sprachlichen Schnittstellen werden durch das BAV einheitlich für alle ISB vorgegeben.","c":false}],"fdv":"Sprache - Bedeutung: Für die schriftliche Übermittlung sind die Amtssprachen (Schriftsprache) anzuwenden. Die ISB regeln die gegenseitigen sprachlichen Schnittstellen in den Betriebsvorschriften.","note":"","optTags":{"A":[],"B":[],"C":[],"D":[]},"optNotes":{"A":"","B":"","C":"","D":""},"contentVersion":1},{"nr":416,"p":1,"term":"Kundeninformation (Ziff. 1.4)","approved":true,"q":"Wer regelt gemäss FDV R 300.3, Ziff. 1.4 die gemeinsamen Prozessabläufe für die Kundeninformation?","opts":[{"l":"A","t":"Die ISB und die EVU regeln dies im gegenseitigen Einvernehmen.","c":true},{"l":"B","t":"Ausschliesslich die ISB, ohne Einbezug der EVU.","c":false},{"l":"C","t":"Ausschliesslich die EVU, ohne Einbezug der ISB.","c":false},{"l":"D","t":"Das BAV legt die Prozessabläufe verbindlich für alle Beteiligten fest.","c":false}],"fdv":"Kundeninformation - Bedeutung: Die ISB und die EVU regeln die gemeinsamen Prozessabläufe für die nötige Kundeninformation im gegenseitigen Einvernehmen.","note":"","optTags":{"A":[],"B":[],"C":[],"D":[]},"optNotes":{"A":"","B":"","C":"","D":""},"contentVersion":1},{"nr":417,"p":1,"term":"Inhalt von Nachrichten (Ziff. 2.1)","approved":true,"q":"Woraus besteht eine Nachricht gemäss FDV R 300.3, Ziff. 2.1?","opts":[{"l":"A","t":"Aus einem Inhalt sowie den Bezeichnungen des Absenders und eines Empfängers oder mehrerer Empfänger.","c":true},{"l":"B","t":"Nur aus dem Inhalt, Absender und Empfänger müssen nicht bezeichnet werden.","c":false},{"l":"C","t":"Aus einem Inhalt sowie ausschliesslich der Bezeichnung des Absenders, der Empfänger muss nicht bezeichnet werden.","c":false},{"l":"D","t":"Aus einer Anordnung und einem Befehl, unabhängig von Absender oder Empfänger.","c":false}],"fdv":"Inhalt von Nachrichten - Bedeutung: Eine Nachricht besteht aus einem Inhalt sowie den Bezeichnungen des Absenders und eines Empfängers oder mehrerer Empfänger.","note":"","optTags":{"A":[],"B":[],"C":[],"D":[]},"optNotes":{"A":"","B":"","C":"","D":""},"contentVersion":1},{"nr":418,"p":1,"term":"Art der Nachrichten (Ziff. 2.2)","approved":true,"q":"Was gilt gemäss FDV R 300.3, Ziff. 2.2 als Nachricht im Sinne der Fahrdienstvorschriften?","opts":[{"l":"A","t":"Alle im Bahnbetrieb notwendigen Anordnungen, Befehle, Meldungen, Verständigungen und Informationen.","c":true},{"l":"B","t":"Ausschliesslich schriftlich erteilte Befehle.","c":false},{"l":"C","t":"Nur mündliche Meldungen zwischen Fahrdienstleiter und Lokführer.","c":false},{"l":"D","t":"Nur sicherheitsrelevante Anordnungen; Informationen und Meldungen zählen nicht als Nachrichten.","c":false}],"fdv":"Art der Nachrichten - Bedeutung: Nachrichten im Sinne der Fahrdienstvorschriften sind alle im Bahnbetrieb notwendigen Anordnungen, Befehle, Meldungen, Verständigungen und Informationen.","note":"","optTags":{"A":[],"B":[],"C":[],"D":[]},"optNotes":{"A":"","B":"","C":"","D":""},"contentVersion":1},{"nr":419,"p":1,"term":"Abfassen von Nachrichten - Formulierung (Ziff. 2.3)","approved":true,"q":"Wie sind Nachrichten gemäss FDV R 300.3, Ziff. 2.3 zu formulieren?","opts":[{"l":"A","t":"Kurz, verständlich, folgerichtig und positiv, mit klaren und eindeutigen Begriffen, vollständigen Bezeichnungen und offiziellen Abkürzungen; die vorgeschriebenen Texte sind anzuwenden.","c":true},{"l":"B","t":"Möglichst ausführlich und mit eigenen Formulierungen, um Missverständnisse zu vermeiden.","c":false},{"l":"C","t":"Kurz, aber mit frei wählbaren Abkürzungen, sofern diese dem Absender geläufig sind.","c":false},{"l":"D","t":"Negativ formuliert, um auf Gefahren klar hinzuweisen.","c":false}],"fdv":"Abfassen von Nachrichten - Bedeutung: Nachrichten sind kurz und verständlich zu formulieren. Es sind klare und eindeutige Begriffe, vollständige Bezeichnungen sowie offizielle Abkürzungen zu verwenden. Die vorgeschriebenen Texte sind anzuwenden. Nachrichten sind folgerichtig und positiv zu formulieren.","note":"","optTags":{"A":[],"B":[],"C":[],"D":[]},"optNotes":{"A":"","B":"","C":"","D":""},"contentVersion":1},{"nr":420,"p":1,"term":"Abfassen von Nachrichten - Verantwortung (Ziff. 2.3)","approved":true,"q":"Wer ist gemäss FDV R 300.3, Ziff. 2.3 für die Richtigkeit übermittelter Nachrichten verantwortlich?","opts":[{"l":"A","t":"Der Absender.","c":true},{"l":"B","t":"Der Empfänger.","c":false},{"l":"C","t":"Sowohl Absender als auch Empfänger gemeinsam.","c":false},{"l":"D","t":"Die für die Kommunikationsverbindung zuständige technische Stelle.","c":false}],"fdv":"Abfassen von Nachrichten - Bedeutung: Für die Richtigkeit übermittelter Nachrichten ist der Absender verantwortlich.","note":"","optTags":{"A":[],"B":[],"C":[],"D":[]},"optNotes":{"A":"","B":"","C":"","D":""},"contentVersion":1},{"nr":421,"p":1,"term":"Art der Mittel (Ziff. 3.1)","approved":true,"q":"Was gilt gemäss FDV R 300.3, Ziff. 3.1 als technische Übermittlungseinrichtung im Sinne dieser Vorschrift?","opts":[{"l":"A","t":"Einrichtungen für die fernmündliche oder fernschriftliche Übermittlung von Nachrichten.","c":true},{"l":"B","t":"Ausschliesslich Einrichtungen für die schriftliche Übermittlung in Papierform.","c":false},{"l":"C","t":"Nur Einrichtungen für die mündliche Übermittlung von Person zu Person.","c":false},{"l":"D","t":"Alle Einrichtungen, die Nachrichten übermitteln, unabhängig davon ob mit oder ohne Technik.","c":false}],"fdv":"Art der Mittel - Bedeutung: Eine Nachricht kann mit oder ohne technische Einrichtungen übermittelt werden. Als technische Übermittlungseinrichtungen im Sinne dieser Vorschrift gelten Einrichtungen für die fernmündliche oder fernschriftliche Übermittlung von Nachrichten.","note":"","optTags":{"A":[],"B":[],"C":[],"D":[]},"optNotes":{"A":"","B":"","C":"","D":""},"contentVersion":1},{"nr":422,"p":1,"term":"Einteilung der Mittel (Ziff. 3.2)","approved":true,"q":"Welche Aussage zur Einteilung der Mittel gemäss FDV R 300.3, Ziff. 3.2 trifft zu?","opts":[{"l":"A","t":"Die Mittel werden in schriftlich, fernschriftlich, mündlich und fernmündlich eingeteilt.","c":true},{"l":"B","t":"Die Mittel werden nur in mündlich und schriftlich eingeteilt.","c":false},{"l":"C","t":"Die Mittel werden in digital und analog eingeteilt.","c":false},{"l":"D","t":"Die Mittel werden in dringlich und nicht dringlich eingeteilt.","c":false}],"fdv":"Einteilung der Mittel - Bedeutung: Die Mittel werden wie folgt eingeteilt: schriftlich, fernschriftlich, mündlich, fernmündlich.","note":"","optTags":{"A":[],"B":[],"C":[],"D":[]},"optNotes":{"A":"","B":"","C":"","D":""},"contentVersion":1},{"nr":423,"p":1,"term":"Einteilung der Mittel - schriftlich (Ziff. 3.2)","approved":true,"q":"Was versteht man gemäss FDV R 300.3, Ziff. 3.2 unter «schriftlich» als Mittel?","opts":[{"l":"A","t":"Abgabe in Papierform ohne technische Übermittlungseinrichtung, z.B. Formular Befehl, Fahrordnung, Weisung, Zirkular.","c":true},{"l":"B","t":"Textübermittlung mit E-Mail, SMS oder Telefax.","c":false},{"l":"C","t":"Mündliche Mitteilung von Person zu Person ohne technische Einrichtung.","c":false},{"l":"D","t":"Übermittlung per Telefon oder Funk.","c":false}],"fdv":"Einteilung der Mittel - Bedeutung: schriftlich: Abgabe in Papierform ohne technische Übermittlungseinrichtung z.B. Formulare (Formular Befehl, Fahrordnung), Weisung, Zirkular.","note":"","optTags":{"A":[],"B":[],"C":[],"D":[]},"optNotes":{"A":"","B":"","C":"","D":""},"contentVersion":1},{"nr":424,"p":1,"term":"Einteilung der Mittel - fernmündlich (Ziff. 3.2)","approved":true,"q":"Welches Beispiel gehört gemäss FDV R 300.3, Ziff. 3.2 zum Mittel «fernmündlich»?","opts":[{"l":"A","t":"Telefon, Mobiltelefon, Funk, Wechselsprecher.","c":true},{"l":"B","t":"E-Mail, Internet, Intranet, SMS, Pager, Telefax.","c":false},{"l":"C","t":"Formular Befehl, Fahrordnung, Weisung, Zirkular.","c":false},{"l":"D","t":"Mündliche Mitteilung von Person zu Person ohne technische Einrichtung.","c":false}],"fdv":"Einteilung der Mittel - Bedeutung: fernmündlich z.B. Telefon, Mobiltelefon, Funk, Wechselsprecher.","note":"","optTags":{"A":[],"B":[],"C":[],"D":[]},"optNotes":{"A":"","B":"","C":"","D":""},"contentVersion":1},{"nr":425,"p":1,"term":"Wahl der Mittel (Ziff. 3.3)","approved":true,"q":"Wer wählt gemäss FDV R 300.3, Ziff. 3.3 das Mittel zur Übermittlung, wenn nichts anderes vorgesehen ist?","opts":[{"l":"A","t":"Der Absender wählt das effizienteste Mittel.","c":true},{"l":"B","t":"Der Empfänger wählt das für ihn bequemste Mittel.","c":false},{"l":"C","t":"Der Fahrdienstleiter legt für alle Nachrichten einheitlich ein Mittel fest.","c":false},{"l":"D","t":"Es darf kein Mittel gewählt werden, wenn die Betriebsprozesse keine Regelung vorsehen.","c":false}],"fdv":"Wahl der Mittel - Bedeutung: Die Verwendung der einzelnen Mittel zum Übermitteln bestimmter Nachrichten ist, wo nötig, im Rahmen der Betriebsprozesse geregelt. Wo nichts anderes vorgesehen ist, wählt der Absender das effizienteste Mittel.","note":"","optTags":{"A":[],"B":[],"C":[],"D":[]},"optNotes":{"A":"","B":"","C":"","D":""},"contentVersion":1},{"nr":426,"p":1,"term":"Verwendung von Formularen (Ziff. 3.4)","approved":true,"q":"Welche Aussage zur Verwendung von Formularen trifft gemäss FDV R 300.3, Ziff. 3.4 zu?","opts":[{"l":"A","t":"Die vorhandenen Formulare sind auch bei fernmündlicher Übermittlung von Nachrichten zu verwenden.","c":true},{"l":"B","t":"Formulare sind nur bei schriftlicher Übermittlung zu verwenden, bei fernmündlicher Übermittlung entfallen sie.","c":false},{"l":"C","t":"Formulare dürfen bei fernmündlicher Übermittlung durch freie Formulierungen ersetzt werden.","c":false},{"l":"D","t":"Formulare sind ausschliesslich für fernschriftliche Übermittlung vorgesehen.","c":false}],"fdv":"Verwendung von Formularen - Bedeutung: Die vorhandenen Formulare sind auch bei fernmündlicher Übermittlung von Nachrichten zu verwenden.","note":"","optTags":{"A":[],"B":[],"C":[],"D":[]},"optNotes":{"A":"","B":"","C":"","D":""},"contentVersion":1},{"nr":427,"p":1,"term":"Einteilung der Verfahren (Ziff. 4.1)","approved":true,"q":"Wie wird eine Nachricht gemäss FDV R 300.3, Ziff. 4.1 abhängig von ihrer Sicherheitsrelevanz übermittelt?","opts":[{"l":"A","t":"Protokollpflichtig (Protokollieren), quittungspflichtig (Quittieren) oder informativ (Informieren).","c":true},{"l":"B","t":"Immer protokollpflichtig, unabhängig von der Sicherheitsrelevanz.","c":false},{"l":"C","t":"Nur quittungspflichtig oder informativ; Protokollieren gibt es gemäss FDV R 300.3 nicht.","c":false},{"l":"D","t":"Je nach Mittel: schriftlich, fernschriftlich, mündlich oder fernmündlich.","c":false}],"fdv":"Einteilung der Verfahren - Bedeutung: Eine Nachricht wird, abhängig von ihrer Sicherheitsrelevanz, protokollpflichtig (Protokollieren), quittungspflichtig (Quittieren) oder informativ (Informieren) übermittelt.","note":"","optTags":{"A":[],"B":[],"C":[],"D":[]},"optNotes":{"A":"","B":"","C":"","D":""},"contentVersion":1},{"nr":428,"p":1,"term":"Protokollieren - Ziel (Ziff. 4.2.1)","approved":true,"q":"Was ist gemäss FDV R 300.3, Ziff. 4.2.1 das Ziel des Protokollierens?","opts":[{"l":"A","t":"Bei der Übermittlung die höchstmögliche Sicherheit zu gewährleisten, insbesondere dass die Nachricht mit korrektem Inhalt an den richtigen Empfänger gelangt und die Übermittlung nachvollziehbar bleibt.","c":true},{"l":"B","t":"Die Übermittlung möglichst schnell und ohne Formalitäten abzuwickeln.","c":false},{"l":"C","t":"Sicherzustellen, dass die Nachricht nicht aufbewahrt werden muss.","c":false},{"l":"D","t":"Nur die relevanten Daten an den richtigen Empfänger zu übermitteln, ohne Nachvollziehbarkeit.","c":false}],"fdv":"Protokollieren - Bedeutung: Ziel des Protokollierens ist, bei der Übermittlung die höchstmögliche Sicherheit zu gewährleisten. Dies stellt insbesondere sicher, dass die Nachricht mit korrektem Inhalt an den richtigen Empfänger gelangt und die vollzogene Übermittlung nachvollziehbar bleibt.","note":"","optTags":{"A":[],"B":[],"C":[],"D":[]},"optNotes":{"A":"","B":"","C":"","D":""},"contentVersion":1},{"nr":429,"p":1,"term":"Protokollieren - fernmündliche Übermittlung (Ziff. 4.2.1)","approved":true,"q":"Wie läuft gemäss FDV R 300.3, Ziff. 4.2.1 die fernmündliche Übermittlung einer protokollpflichtigen Nachricht ab?","opts":[{"l":"A","t":"Der Absender schreibt die Nachricht vor dem Übermitteln nieder. Der Empfänger schreibt die erhaltene Nachricht auf und wiederholt sie wörtlich. Der Absender prüft die Wiederholung und bestätigt die Richtigkeit.","c":true},{"l":"B","t":"Der Empfänger bestätigt den Empfang automatisch durch eine Systemrückmeldung, ohne die Nachricht zu wiederholen.","c":false},{"l":"C","t":"Der Absender muss die Nachricht nicht niederschreiben, nur der Empfänger protokolliert sie.","c":false},{"l":"D","t":"Eine Wiederholung durch den Empfänger ist bei protokollpflichtigen Nachrichten nicht erforderlich.","c":false}],"fdv":"Protokollieren - Bedeutung: Erfolgt die Übermittlung fernmündlich, hat der Absender die Nachricht vor dem Übermitteln niederzuschreiben. Der Empfänger hat die erhaltene Nachricht aufzuschreiben und anschliessend wörtlich zu wiederholen. Der Absender prüft die Wiederholung und bestätigt die Richtigkeit der Nachricht.","note":"","optTags":{"A":[],"B":[],"C":[],"D":[]},"optNotes":{"A":"","B":"","C":"","D":""},"contentVersion":1},{"nr":430,"p":1,"term":"Protokollieren - automatische Systemrückmeldungen (Ziff. 4.2.1)","approved":true,"q":"Sind gemäss FDV R 300.3, Ziff. 4.2.1 automatische Systemrückmeldungen bei protokollpflichtigen Nachrichten zulässig?","opts":[{"l":"A","t":"Nein, automatische Systemrückmeldungen sind bei protokollpflichtigen Nachrichten nicht zulässig.","c":true},{"l":"B","t":"Ja, sie ersetzen die wörtliche Wiederholung durch den Empfänger.","c":false},{"l":"C","t":"Ja, aber nur bei fernschriftlicher Übermittlung.","c":false},{"l":"D","t":"Ja, sofern der Absender dem vorgängig zustimmt.","c":false}],"fdv":"Protokollieren - Bedeutung: Automatische Systemrückmeldungen sind bei protokollpflichtigen Nachrichten nicht zulässig.","note":"","optTags":{"A":[],"B":[],"C":[],"D":[]},"optNotes":{"A":"","B":"","C":"","D":""},"contentVersion":1},{"nr":431,"p":1,"term":"Protokollieren - Aufbewahrungsdauer (Ziff. 4.2.1)","approved":true,"q":"Wie lange ist eine Nachricht gemäss FDV R 300.3, Ziff. 4.2.1 mindestens aufzubewahren?","opts":[{"l":"A","t":"Mindestens 24 Stunden über den letzten massgebenden Zeitpunkt hinaus.","c":true},{"l":"B","t":"Mindestens 48 Stunden über den letzten massgebenden Zeitpunkt hinaus.","c":false},{"l":"C","t":"Nur bis zum Ende der eigenen Dienstzeit.","c":false},{"l":"D","t":"Eine Aufbewahrung ist nicht vorgeschrieben.","c":false}],"fdv":"Protokollieren - Bedeutung: Jede Nachricht ist mindestens 24 Stunden über den letzten massgebenden Zeitpunkt hinaus aufzubewahren.","note":"","optTags":{"A":[],"B":[],"C":[],"D":[]},"optNotes":{"A":"","B":"","C":"","D":""},"contentVersion":1},{"nr":432,"p":1,"term":"Protokollieren - fehlende Bestätigung (Ziff. 4.2.1)","approved":true,"q":"Was gilt gemäss FDV R 300.3, Ziff. 4.2.1, wenn bei einer protokollpflichtigen Nachricht die Bestätigung fehlt?","opts":[{"l":"A","t":"Die Nachricht ist als nicht übermittelt zu betrachten.","c":true},{"l":"B","t":"Die Nachricht gilt trotzdem als übermittelt, sofern sie korrekt niedergeschrieben wurde.","c":false},{"l":"C","t":"Die Nachricht muss nach 24 Stunden automatisch als übermittelt gelten.","c":false},{"l":"D","t":"Die Nachricht gilt als übermittelt, wenn der Absender dies dokumentiert.","c":false}],"fdv":"Protokollieren - Bedeutung: Fehlt die Bestätigung, ist die Nachricht als nicht übermittelt zu betrachten.","note":"","optTags":{"A":[],"B":[],"C":[],"D":[]},"optNotes":{"A":"","B":"","C":"","D":""},"contentVersion":1},{"nr":433,"p":1,"term":"Quittieren - Ziel und Ablauf (Ziff. 4.2.2)","approved":true,"q":"Was ist gemäss FDV R 300.3, Ziff. 4.2.2 das Ziel des Quittierens, und wie läuft die mündliche bzw. fernmündliche Quittung ab?","opts":[{"l":"A","t":"Sicherstellung, dass die relevanten Daten einer Nachricht an den richtigen Empfänger gelangen; der Empfänger wiederholt den relevanten Inhalt und nennt Name und Funktion, der Absender prüft die Wiederholung und quittiert die Richtigkeit.","c":true},{"l":"B","t":"Sicherstellung der höchstmöglichen Sicherheit durch vollständige Protokollierung bei Absender und Empfänger.","c":false},{"l":"C","t":"Der Absender wiederholt die Nachricht, der Empfänger bestätigt lediglich mit Ja oder Nein.","c":false},{"l":"D","t":"Die Nachricht wird grundsätzlich beim Empfänger dauerhaft festgehalten, unabhängig von der Gültigkeitsdauer.","c":false}],"fdv":"Quittieren - Bedeutung: Ziel des Quittierens ist die Sicherstellung, dass die relevanten Daten einer Nachricht an den richtigen Empfänger gelangen. Bei der mündlichen bzw. fernmündlichen Übermittlung ist für die Quittung der relevante Inhalt der Nachricht durch den Empfänger zu wiederholen und der Name sowie die Funktion sind anzugeben. Der Absender prüft die Wiederholung und quittiert die Richtigkeit.","note":"","optTags":{"A":[],"B":[],"C":[],"D":[]},"optNotes":{"A":"","B":"","C":"","D":""},"contentVersion":1},{"nr":434,"p":1,"term":"Quittieren - fernschriftliche Übermittlung (Ziff. 4.2.2)","approved":true,"q":"Was ersetzt gemäss FDV R 300.3, Ziff. 4.2.2 bei fernschriftlicher Übermittlung die Quittung?","opts":[{"l":"A","t":"Eine allfällige durch das System automatisch rückgemeldete Lesebestätigung.","c":true},{"l":"B","t":"Eine mündliche Wiederholung durch den Empfänger.","c":false},{"l":"C","t":"Nichts, eine fernschriftliche Übermittlung kann grundsätzlich nicht quittiert werden.","c":false},{"l":"D","t":"Die Unterschrift des Absenders auf dem Formular.","c":false}],"fdv":"Quittieren - Bedeutung: Bei fernschriftlicher Übermittlung ersetzt eine allfällige durch das System automatisch rückgemeldete Lesebestätigung die Quittung.","note":"","optTags":{"A":[],"B":[],"C":[],"D":[]},"optNotes":{"A":"","B":"","C":"","D":""},"contentVersion":1},{"nr":435,"p":1,"term":"Informieren (Ziff. 4.2.3)","approved":true,"q":"Welche Eigenschaften haben Nachrichten gemäss FDV R 300.3, Ziff. 4.2.3 (Informieren)?","opts":[{"l":"A","t":"Sie haben keinen sicherheitsrelevanten Charakter und werden weder protokolliert noch quittiert.","c":true},{"l":"B","t":"Sie sind stets protokollpflichtig, da sie wichtige Informationen enthalten.","c":false},{"l":"C","t":"Sie müssen immer quittiert werden, auch wenn sie nicht sicherheitsrelevant sind.","c":false},{"l":"D","t":"Sie dürfen nur schriftlich übermittelt werden.","c":false}],"fdv":"Informieren - Bedeutung: Diese Nachrichten haben keinen sicherheitsrelevanten Charakter und werden weder protokolliert noch quittiert.","note":"","optTags":{"A":[],"B":[],"C":[],"D":[]},"optNotes":{"A":"","B":"","C":"","D":""},"contentVersion":1},{"nr":436,"p":1,"term":"Anwendung der Verfahren - kein vorgegebenes Verfahren (Ziff. 4.3)","approved":true,"q":"Welches Verfahren ist gemäss FDV R 300.3, Ziff. 4.3 anzuwenden, wenn die jeweiligen Vorschriften kein Verfahren vorgeben?","opts":[{"l":"A","t":"Dasjenige Verfahren, welches nach Ermessen des Absenders dem Inhalt der Nachricht am ehesten entspricht.","c":true},{"l":"B","t":"Immer das Protokollieren, als sicherstes Verfahren.","c":false},{"l":"C","t":"Immer das Informieren, da dies das einfachste Verfahren ist.","c":false},{"l":"D","t":"Das vom Empfänger gewünschte Verfahren.","c":false}],"fdv":"Anwendung der Verfahren - Bedeutung: Das bei der Übermittlung anzuwendende Verfahren ist in den jeweiligen Vorschriften vorgegeben. Fehlt dieses, ist die Nachricht mit demjenigen Verfahren zu übermitteln, welches nach Ermessen des Absenders dem Inhalt der Nachricht am ehesten entspricht.","note":"","optTags":{"A":[],"B":[],"C":[],"D":[]},"optNotes":{"A":"","B":"","C":"","D":""},"contentVersion":1},{"nr":437,"p":1,"term":"Anwendung der Verfahren - technisch nicht anwendbar (Ziff. 4.3)","approved":true,"q":"Was gilt gemäss FDV R 300.3, Ziff. 4.3, wenn ein vorgeschriebenes Verfahren aufgrund technischer Vorgaben nicht anwendbar ist?","opts":[{"l":"A","t":"Es ist ein sichereres Verfahren oder ein anderes Mittel anzuwenden.","c":true},{"l":"B","t":"Die Nachricht darf in diesem Fall ganz entfallen.","c":false},{"l":"C","t":"Es ist ein weniger sicheres Verfahren anzuwenden, Hauptsache die Nachricht kommt an.","c":false},{"l":"D","t":"Die Übermittlung ist auf später zu verschieben, bis das vorgeschriebene Verfahren wieder möglich ist.","c":false}],"fdv":"Anwendung der Verfahren - Bedeutung: Ist auf Grund der technischen Vorgaben ein Verfahren nicht anwendbar, ist ein sichereres Verfahren oder ein anderes Mittel anzuwenden.","note":"","optTags":{"A":[],"B":[],"C":[],"D":[]},"optNotes":{"A":"","B":"","C":"","D":""},"contentVersion":1},{"nr":438,"p":1,"term":"Besetztes Gleis (beim Hauptsignal) - Vorsignal am gleichen Standort (Ziff. 5.3.1)","approved":true,"q":"Was gilt gemäss FDV R 300.2, Ziff. 5.3.1 für ein Vorsignal, das am gleichen Standort wie das Besetztsignal beim Hauptsignal angebracht ist?","opts":[{"l":"A","t":"Das Vorsignal ist dunkel.","c":true},{"l":"B","t":"Das Vorsignal zeigt Warnung.","c":false},{"l":"C","t":"Das Vorsignal zeigt Geschwindigkeits-Ankündigung 40 km/h.","c":false},{"l":"D","t":"Das Vorsignal zeigt Freie Fahrt (Fahrbegriff 1).","c":false}],"fdv":"Besetztsignal - Beziehung zu anderen Signalen: Ist am gleichen Standort ein Vorsignal angebracht, ist dieses dunkel.","note":"","optTags":{"A":[],"B":[],"C":[],"D":[]},"optNotes":{"A":"","B":"","C":"","D":""},"contentVersion":1},{"nr":439,"p":1,"term":"Besetztes Gleis (beim Hauptsignal) - zugehöriges Hauptsignal (Ziff. 5.3.1)","approved":true,"q":"Was zeigt gemäss FDV R 300.2, Ziff. 5.3.1 das zugehörige Hauptsignal bei beleuchtetem Besetztsignal?","opts":[{"l":"A","t":"Geschwindigkeits-Ausführung 40 km/h oder Kurze Fahrt.","c":true},{"l":"B","t":"Halt.","c":false},{"l":"C","t":"Freie Fahrt (Fahrbegriff 1).","c":false},{"l":"D","t":"Warnung.","c":false}],"fdv":"Besetztsignal - Beziehung zu anderen Signalen: Bei beleuchtetem Besetztsignal zeigt das zugehörige Hauptsignal Geschwindigkeits-Ausführung 40 km/h oder Kurze Fahrt.","note":"","optTags":{"A":[],"B":[],"C":[],"D":[]},"optNotes":{"A":"","B":"","C":"","D":""},"contentVersion":1},{"nr":440,"p":1,"term":"Handsignal bei Tag - Ausführung (Ziff. 2.7.2)","approved":true,"q":"Wie wird das Handsignal «Halt bei der signalgebenden Person» gemäss FDV R 300.2, Ziff. 2.7.2 bei Tag gegeben?","opts":[{"l":"A","t":"Ausgestreckter Arm quer zum Gleis.","c":true},{"l":"B","t":"Senkrechte, kreisförmige Bewegung des Arms in der Fahrrichtung.","c":false},{"l":"C","t":"Senkrecht nach oben gestreckter Arm.","c":false},{"l":"D","t":"Ausgestreckter Arm längs zum Gleis.","c":false}],"fdv":"Handsignal - Bei Tag: ausgestreckter Arm quer zum Gleis. Bei Nacht: ausgestreckter Arm mit weissem Licht quer zum Gleis.","note":"","optTags":{"A":[],"B":[],"C":[],"D":[]},"optNotes":{"A":"","B":"","C":"","D":""},"img":"images/image110.png","contentVersion":1},{"nr":441,"p":1,"term":"Handsignal bei Nacht - Ausführung (Ziff. 2.7.2)","approved":true,"q":"Wie wird das Handsignal «Halt bei der signalgebenden Person» gemäss FDV R 300.2, Ziff. 2.7.2 bei Nacht gegeben?","opts":[{"l":"A","t":"Ausgestreckter Arm mit weissem Licht quer zum Gleis.","c":true},{"l":"B","t":"Ausgestreckter Arm mit rotem Licht quer zum Gleis.","c":false},{"l":"C","t":"Senkrechte, kreisförmige Bewegung mit weissem Licht in der Fahrrichtung.","c":false},{"l":"D","t":"Ausgestreckter Arm mit weissem Licht längs zum Gleis.","c":false}],"fdv":"Handsignal - Bei Tag: ausgestreckter Arm quer zum Gleis. Bei Nacht: ausgestreckter Arm mit weissem Licht quer zum Gleis.","note":"","optTags":{"A":[],"B":[],"C":[],"D":[]},"optNotes":{"A":"","B":"","C":"","D":""},"img":"images/image111.png","contentVersion":1},{"nr":442,"p":1,"term":"Erstellung (Ziff. 5.1.1)","approved":true,"q":"Wer erstellt und aktualisiert gemäss FDV R 300.3, Ziff. 5.1.1 die Streckentabelle sowie den Fahrplan für Züge und für Rangierbewegungen auf die Strecke?","opts":[{"l":"A","t":"Die ISB.","c":true},{"l":"B","t":"Der Fahrdienstleiter (FDL).","c":false},{"l":"C","t":"Der Lokführer (LF).","c":false},{"l":"D","t":"Das EVU.","c":false}],"fdv":"Erstellung - Die ISB erstellt und aktualisiert: die Streckentabelle; den Fahrplan für Züge und für Rangierbewegungen auf die Strecke. Dies beinhaltet auch die Erstellung der Fahrordnungen und der graphischen Fahrpläne.","note":"","optTags":{"A":[],"B":[],"C":[],"D":[]},"optNotes":{"A":"","B":"","C":"","D":""},"contentVersion":1},{"nr":443,"p":1,"term":"Anordnung (Ziff. 5.1.2)","approved":true,"q":"Was ordnet die ISB gemäss FDV R 300.3, Ziff. 5.1.2 an?","opts":[{"l":"A","t":"Das Verkehren von regelmässigen, fakultativen und Extrafahrten, Abweichungen von früheren Anordnungen sowie den teilweisen oder vollständigen Ausfall einer Fahrt.","c":true},{"l":"B","t":"Ausschliesslich das Verkehren von Extrafahrten; regelmässige und fakultative Fahrten ordnet das EVU an.","c":false},{"l":"C","t":"Ausschliesslich die Fahrordnungen, nicht aber das Verkehren der Fahrten.","c":false},{"l":"D","t":"Nur den vollständigen Ausfall einer Fahrt; Abweichungen von früheren Anordnungen ordnet der FDL an.","c":false}],"fdv":"Anordnung - Die ISB ordnet an: das Verkehren von regelmässigen Fahrten, von fakultativen Fahrten, von Extrafahrten; Abweichungen von früheren Anordnungen; den teilweisen oder vollständigen Ausfall einer Fahrt.","note":"","optTags":{"A":[],"B":[],"C":[],"D":[]},"optNotes":{"A":"","B":"","C":"","D":""},"contentVersion":1},{"nr":444,"p":1,"term":"Verteilung - Rangierbewegungen (Ziff. 5.1.3)","approved":true,"q":"Wem sind die Fahrordnungen für Rangierbewegungen auf die Strecke gemäss FDV R 300.3, Ziff. 5.1.3 zusätzlich abzugeben?","opts":[{"l":"A","t":"Dem Fahrdienstleiter (FDL) allein.","c":false},{"l":"B","t":"Dem Betriebsleiter der ISB.","c":false},{"l":"C","t":"Niemandem zusätzlich; sie gehen nur an den Lokführer (LF).","c":false},{"l":"D","t":"Dem Rangierleiter (RL).","c":true}],"fdv":"Verteilung - Die Fahrordnungen und die Streckentabelle sind dem LF, bzw. die Fahrpläne dem übrigen Personal nach Bedarf, abzugeben. Die Fahrordnungen für Rangierbewegungen auf die Strecke sind zusätzlich dem RL abzugeben.","note":"","optTags":{"A":[],"B":[],"C":[],"D":[]},"optNotes":{"A":"","B":"","C":"","D":""},"contentVersion":1},{"nr":445,"p":1,"term":"Verteilung - kurzfristige Anordnungen (Ziff. 5.1.3)","approved":true,"q":"Wie verständigt der FDL den LF gemäss FDV R 300.3, Ziff. 5.1.3 bei kurzfristigen Anordnungen, und was hat der LF mindestens festzuhalten?","opts":[{"l":"A","t":"Protokollpflichtig; der LF hält die gesamte Anordnung wörtlich fest.","c":false},{"l":"B","t":"Quittungspflichtig; der LF hält mindestens die Zugnummer schriftlich fest.","c":true},{"l":"C","t":"Quittungspflichtig; der LF muss nichts festhalten.","c":false},{"l":"D","t":"Informativ; der LF muss nichts festhalten.","c":false}],"fdv":"Verteilung - Bei kurzfristigen Anordnungen verständigt der FDL den LF quittungspflichtig. Dabei hat der LF mindestens die Zugnummer schriftlich festzuhalten.","note":"","optTags":{"A":[],"B":[],"C":[],"D":[]},"optNotes":{"A":"","B":"","C":"","D":""},"contentVersion":1},{"nr":446,"p":1,"term":"Unterlagen für den LF (Ziff. 5.2)","approved":true,"q":"Welchen Unterlagen entnimmt der LF gemäss FDV R 300.3, Ziff. 5.2 die für die Führung der Fahrten notwendigen Angaben?","opts":[{"l":"A","t":"Ausschliesslich dem graphischen Fahrplan.","c":false},{"l":"B","t":"Der Fahrordnung und der Streckentabelle.","c":true},{"l":"C","t":"Der Taktfahrordnung und dem Fahrplan für das übrige Personal.","c":false},{"l":"D","t":"Ausschliesslich den mündlichen Anweisungen des FDL.","c":false}],"fdv":"Unterlagen für den LF - Der LF entnimmt die für die Führung der Fahrten notwendigen Angaben der Fahrordnung und der Streckentabelle.","note":"","optTags":{"A":[],"B":[],"C":[],"D":[]},"optNotes":{"A":"","B":"","C":"","D":""},"contentVersion":1},{"nr":447,"p":1,"term":"Inhalt der Fahrordnung - Mindestinhalt (Ziff. 5.3.1)","approved":true,"q":"Was muss die Fahrordnung gemäss FDV R 300.3, Ziff. 5.3.1 mindestens enthalten?","opts":[{"l":"A","t":"Ausschliesslich die Zug- und Bremsreihe.","c":false},{"l":"B","t":"Die Nummerierung der Fahrt und die Streckentabelle.","c":false},{"l":"C","t":"Die Nummerierung der Fahrt und die Verkehrszeiten mit zugehörigen Ortsangaben.","c":true},{"l":"D","t":"Die Verkehrsperiode und die Zug- und Bremsreihe.","c":false}],"fdv":"Inhalt der Fahrordnung - Die Fahrordnung muss mindestens enthalten: die Nummerierung der Fahrt; die Verkehrszeiten mit zugehörigen Ortsangaben.","note":"","optTags":{"A":[],"B":[],"C":[],"D":[]},"optNotes":{"A":"","B":"","C":"","D":""},"contentVersion":1},{"nr":448,"p":1,"term":"Inhalt der Fahrordnung - zusätzliche Angaben (Ziff. 5.3.1)","approved":true,"q":"Welche Angaben enthält die Fahrordnung gemäss FDV R 300.3, Ziff. 5.3.1 nur, sofern notwendig?","opts":[{"l":"A","t":"Die Verkehrszeiten mit zugehörigen Ortsangaben.","c":false},{"l":"B","t":"Die Verkehrsperiode, die Zug- und Bremsreihe sowie weitere für die Führung des Zuges erforderliche Angaben.","c":true},{"l":"C","t":"Die kilometrische Lage der Bahnhöfe und Haltestellen.","c":false},{"l":"D","t":"Die Nummerierung der Fahrt.","c":false}],"fdv":"Inhalt der Fahrordnung - Sofern notwendig, enthält sie zusätzlich: die Verkehrsperiode; die Zug- und Bremsreihe; weitere für die Führung des Zuges erforderliche Angaben. Zur Erleichterung können Sammelfahrordnungen erstellt werden.","note":"","optTags":{"A":[],"B":[],"C":[],"D":[]},"optNotes":{"A":"","B":"","C":"","D":""},"contentVersion":1},{"nr":449,"p":1,"term":"Fakultative Züge und Extrazüge (Ziff. 5.3.2)","approved":true,"q":"Was wird gemäss FDV R 300.3, Ziff. 5.3.2 mit der Anordnung von fakultativen Zügen und Extrazügen zusätzlich bekannt gegeben?","opts":[{"l":"A","t":"Die Zug- und Bremsreihe sowie die Streckengeschwindigkeit.","c":false},{"l":"B","t":"Der Tag der Ausführung; bei fakultativen Zügen, ob der Zug begleitet ist.","c":false},{"l":"C","t":"Der Tag der Ausführung bzw. die Verkehrsperiode; bei Extrazügen, ob der Zug begleitet ist.","c":true},{"l":"D","t":"Ausschliesslich die Zugnummer.","c":false}],"fdv":"Zusätzliche Angaben für fakultative Züge und Extrazüge - Mit der Anordnung werden zusätzlich bekannt gegeben: der Tag der Ausführung bzw. die Verkehrsperiode; bei Extrazügen, ob der Zug begleitet ist.","note":"","optTags":{"A":[],"B":[],"C":[],"D":[]},"optNotes":{"A":"","B":"","C":"","D":""},"contentVersion":1},{"nr":450,"p":1,"term":"Vereinfachte Fahrordnung (Ziff. 5.3.3)","approved":true,"q":"Was wird in der vereinfachten Fahrordnung für Züge gemäss FDV R 300.3, Ziff. 5.
