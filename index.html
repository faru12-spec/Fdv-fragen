const STORAGE_KEY = "fdv_r300_korrekturen_v1";

// Supabase-Anbindung: gemeinsamer Speicher statt lokalem window.storage,
// damit Korrekturen geraeteuebergreifend und ohne Export/Import synchron bleiben.
const SUPABASE_URL = "https://vvahjifduqicgiobiyxq.supabase.co";
const SUPABASE_KEY = "sb_publishable_WOoNJ3rc-kKemZp2cYSz4g_hMgkZgWh";
const SUPABASE_HEADERS = {
  "apikey": SUPABASE_KEY,
  "Authorization": "Bearer " + SUPABASE_KEY,
  "Content-Type": "application/json",
};

// Laedt alle gespeicherten Zeilen aus Supabase und baut daraus dasselbe
// "corrections"-Objekt (keyed by nr), das buildCorrections/mergeCorrections erwarten.
async function loadCorrectionsFromSupabase() {
  let res = await fetch(
    SUPABASE_URL + "/rest/v1/question_review?select=nr,approved,p,note,opt_tags,opt_notes,content_version",
    { headers: SUPABASE_HEADERS }
  );
  if (!res.ok) {
    // Fallback falls die Spalte content_version in der DB noch nicht existiert (Migration nicht ausgefuehrt)
    res = await fetch(
      SUPABASE_URL + "/rest/v1/question_review?select=nr,approved,p,note,opt_tags,opt_notes",
      { headers: SUPABASE_HEADERS }
    );
    if (!res.ok) throw new Error("Supabase Ladefehler: " + res.status);
  }
  const rows = await res.json();
  const out = {};
  rows.forEach(r => {
    out[r.nr] = {
      approved: r.approved,
      p: r.p,
      note: r.note,
      optTags: r.opt_tags,
      optNotes: r.opt_notes,
      contentVersion: r.content_version || 1,
    };
  });
  return out;
}

// Speichert die uebergebenen Korrekturen als Upsert (ein Request pro Frage-Batch).
// Gibt bei Fehlern die genaue Serverantwort zurueck, damit sie in der App sichtbar gemacht werden kann.
async function saveCorrectionsToSupabase(corrections) {
  const rows = Object.keys(corrections).map(nr => ({
    nr: parseInt(nr, 10),
    approved: corrections[nr].approved,
    p: corrections[nr].p,
    note: corrections[nr].note,
    opt_tags: corrections[nr].optTags,
    opt_notes: corrections[nr].optNotes,
    content_version: corrections[nr].contentVersion || 1,
  }));
  if (rows.length === 0) return { ok: true };
  let res = await fetch(SUPABASE_URL + "/rest/v1/question_review", {
    method: "POST",
    headers: { "apikey": SUPABASE_KEY, "Content-Type": "application/json", "Prefer": "resolution=merge-duplicates" },
    body: JSON.stringify(rows),
  });
  if (!res.ok) {
    // Fallback ohne content_version, falls die Spalte in der DB noch nicht existiert
    const rowsWithoutVersion = rows.map(r => { const { content_version, ...rest } = r; return rest; });
    res = await fetch(SUPABASE_URL + "/rest/v1/question_review", {
      method: "POST",
      headers: { "apikey": SUPABASE_KEY, "Content-Type": "application/json", "Prefer": "resolution=merge-duplicates" },
      body: JSON.stringify(rowsWithoutVersion),
    });
  }
  if (res.ok) return { ok: true };
  let detail = "";
  try { detail = await res.text(); } catch (e) {}
  return { ok: false, status: res.status, detail };
}

// Nur die tatsaechlichen Aenderungen pro Frage sichern (nicht den ganzen Fragenkatalog).
// So bleiben die eigenen Korrekturen auch erhalten, wenn sich INITIAL_QS spaeter aendert
// (z.B. weil eine neue Version der Datei mit anderen/weiteren Fragen erstellt wird).
function buildCorrections(qs, minNr, maxNr) {
  const out = {};
  qs.forEach(q => {
    if (minNr != null && (q.nr < minNr || q.nr > maxNr)) return;
    const touched =
      q.approved ||
      q.p !== 1 ||
      q.note.trim() !== "" ||
      Object.values(q.optTags).some(a => a.length > 0) ||
      Object.values(q.optNotes || {}).some(n => n.trim() !== "");
    if (touched) {
      out[q.nr] = {
        approved: q.approved,
        p: q.p,
        note: q.note,
        optTags: q.optTags,
        optNotes: q.optNotes,
        contentVersion: q.contentVersion || 1,
      };
    }
  });
  return out;
}

// Wenn eine Frage im Code eine hoehere contentVersion hat als der in der DB gespeicherte
// Stand, wurde ihr Text seither inhaltlich korrigiert - die alten Tags/Freigaben aus der
// DB sind dann ungueltig geworden und werden NICHT uebernommen (Frage bleibt "frisch").
// Gibt zusaetzlich zurueck, welche Fragen deswegen neu in die DB geschrieben werden muessen.
function mergeCorrections(baseQs, corrections) {
  const toResync = [];
  if (!corrections) return { merged: baseQs, toResync };
  const merged = baseQs.map(q => {
    const c = corrections[q.nr];
    const codeVersion = q.contentVersion || 1;
    if (!c) return q;
    const dbVersion = c.contentVersion || 1;
    if (dbVersion < codeVersion) {
      toResync.push(q.nr);
      return q; // Code-Stand behalten, DB-Korrektur verwerfen
    }
    return { ...q, ...c };
  });
  return { merged, toResync };
}

ar ist.","note":"","optTags":{"A":[],"B":[],"C":[],"D":[]},"optNotes":{"A":"","B":"","C":"","D":""}},{"nr":176,"p":1,"term":"Fahrdienstliche Tätigkeiten","approved":false,"q":"Was umfassen die «fahrdienstlichen Tätigkeiten» gemäss FDV R 300.1, Ziff. 2.5.2?","opts":[{"l":"A","t":"Ausschliesslich die Tätigkeiten des Lokführers während der Zugfahrt.","c":false},{"l":"B","t":"Die in den Schweizerischen Fahrdienstvorschriften geregelten Aufgaben und Funktionen.","c":true},{"l":"C","t":"Ausschliesslich die Tätigkeiten des Fahrdienstleiters im Stellwerk.","c":false},{"l":"D","t":"Alle Tätigkeiten im Gleisbereich, einschliesslich baulicher Arbeiten.","c":false}],"fdv":"Fahrdienstliche Tätigkeiten: die fahrdienstlichen Tätigkeiten umfassen die in den Schweizerischen Fahrdienstvorschriften geregelten Aufgaben und Funktionen.","note":"","optTags":{"A":[],"B":[],"C":[],"D":[]},"optNotes":{"A":"","B":"","C":"","D":""}},{"nr":177,"p":1,"term":"Gefahrgutwagen","approved":false,"q":"Was ist ein «Gefahrgutwagen» gemäss FDV R 300.1, Ziff. 2.5.2?","opts":[{"l":"A","t":"Ein Wagen mit Grosszettel (Placards) nach Muster 1 bis 9 gemäss RID.","c":true},{"l":"B","t":"Jeder Wagen, der ausschliesslich für den Gütertransport bestimmt ist.","c":false},{"l":"C","t":"Ein Wagen mit Grosszettel (Placards) nach Muster 1 bis 9, jedoch ausschliesslich für flüssige Stoffe.","c":false},{"l":"D","t":"Ein Wagen ohne normale Zug- und Stossvorrichtung, der Gefahrgüter transportiert.","c":false}],"fdv":"Gefahrgutwagen: ein Wagen mit Grosszettel (Placards) nach Muster 1 bis 9 gemäss RID.","note":"","optTags":{"A":[],"B":[],"C":[],"D":[]},"optNotes":{"A":"","B":"","C":"","D":""}},{"nr":178,"p":1,"term":"Gehweg","approved":false,"q":"Was ist ein «Gehweg» gemäss FDV R 300.1, Ziff. 2.5.2?","opts":[{"l":"A","t":"Ein Weg im Gleisbereich ausserhalb von Tunnel, der durch Personal zum Aufenthalt oder Arbeiten genutzt werden darf. Er ist auf Grund seiner Beschaffenheit (feiner Kies bzw. Sand oder asphaltiert, d.h. ohne Schotter) eindeutig erkennbar.","c":true},{"l":"B","t":"Ein Weg ausschliesslich innerhalb von Tunneln, der durch Personal zum Aufenthalt genutzt werden darf.","c":false},{"l":"C","t":"Jeder unbefestigte Streifen entlang des Gleises, unabhängig von seiner Beschaffenheit.","c":false},{"l":"D","t":"Ein Weg im Gleisbereich, der ausschliesslich mit Schotter befestigt ist.","c":false}],"fdv":"Gehweg: ein Weg im Gleisbereich ausserhalb von Tunnel, der durch Personal zum Aufenthalt oder Arbeiten genutzt werden darf. Er ist auf Grund seiner Beschaffenheit (feiner Kies bzw. Sand oder asphaltiert, d.h. ohne Schotter) eindeutig erkennbar.","note":"","optTags":{"A":[],"B":[],"C":[],"D":[]},"optNotes":{"A":"","B":"","C":"","D":""}},{"nr":179,"p":1,"term":"Anschlussgleisbetreiberin","approved":false,"q":"Was ist die «Anschlussgleisbetreiberin» gemäss FDV R 300.1, Ziff. 2.5.2?","opts":[{"l":"A","t":"EBU, das eine Eisenbahninfrastruktur betreibt.","c":false},{"l":"B","t":"Der Anschliesser, der für den infrastrukturseitigen Betrieb des Anschlussgleises verantwortlich ist.","c":true},{"l":"C","t":"EVU, welches den Netzzugang auf einer Infrastruktur beansprucht.","c":false},{"l":"D","t":"Der Anschliesser, der ausschliesslich für den Gütertransport auf dem Anschlussgleis verantwortlich ist.","c":false}],"fdv":"Anschlussgleisbetreiberin: der Anschliesser, der für den infrastrukturseitigen Betrieb des Anschlussgleises verantwortlich ist.","note":"","optTags":{"A":[],"B":[],"C":[],"D":[]},"optNotes":{"A":"","B":"","C":"","D":""}},{"nr":180,"p":1,"term":"Arbeitsstellen-Koordinator (AKO)","approved":false,"q":"Was gilt für den «Arbeitsstellen-Koordinator/in (AKO)» gemäss FDV R 300.1, Ziff. 2.5.2?","opts":[{"l":"A","t":"Befinden sich in gesperrten Gleisen mehrere Arbeitsstellen, kann ein SC als AKO eingesetzt werden.","c":true},{"l":"B","t":"Der AKO ist ausschliesslich für die Koordination zwischen zwei benachbarten Bahnhöfen zuständig.","c":false},{"l":"C","t":"Befinden sich in einem gesperrten Gleis mehrere Arbeitsstellen, muss zwingend für jede ein eigener SC eingesetzt werden.","c":false},{"l":"D","t":"Der AKO ersetzt den Fahrdienstleiter bei Arbeiten im Gleisbereich.","c":false}],"fdv":"Arbeitsstellen-Koordinator/in (AKO): befinden sich in gesperrten Gleisen mehrere Arbeitsstellen, kann ein SC als AKO eingesetzt werden.","note":"","optTags":{"A":[],"B":[],"C":[],"D":[]},"optNotes":{"A":"","B":"","C":"","D":""}},{"nr":181,"p":1,"term":"Driver Machine Interface (DMI)","approved":false,"q":"Was ist das «Driver Machine Interface (DMI)» gemäss FDV R 300.1, Ziff. 2.5.2?","opts":[{"l":"A","t":"Bedien- und Anzeigeelement, unabhängig vom Standort im Fahrzeug.","c":false},{"l":"B","t":"Bedien- und Anzeigeelement im Führerstand.","c":true},{"l":"C","t":"Die Einrichtung auf dem Triebfahrzeug zur Abgabe von akustischen Signalen.","c":false},{"l":"D","t":"Bedien- und Anzeigeelement ausserhalb des Führerstands, z.B. im Passagierraum.","c":false}],"fdv":"Driver Machine Interface (DMI): Bedien- und Anzeigeelement im Führerstand.","note":"","optTags":{"A":["needs_review"],"B":[],"C":[],"D":[]},"optNotes":{"A":"","B":"","C":"","D":""},"contentVersion":2},{"nr":182,"p":1,"term":"Gestörter Abschnitt","approved":false,"q":"Was ist ein «Gestörter Abschnitt» gemäss FDV R 300.1, Ziff. 2.5.2?","opts":[{"l":"A","t":"Ein Fahrweg, welcher durch ein gestörtes Element der Sicherungsanlage beeinflusst wird oder in welchem sich ein mittels Notbedienung in Grundstellung verbrachtes Element der Sicherungsanlage befindet. Dieser entspricht der Fahrstrasse, welche im Regelbetrieb ohne Notbedienung eingestellt werden kann. Er ist durch den FDL für jede Fahrt erneut zu bestimmen.","c":true},{"l":"B","t":"Jeder Fahrweg, der nach einer Störung dauerhaft für den Betrieb gesperrt bleibt.","c":false},{"l":"C","t":"Ein Fahrweg, welcher durch ein gestörtes Element der Sicherungsanlage beeinflusst wird und einmalig durch den FDL bestimmt und danach nicht mehr verändert wird.","c":false},{"l":"D","t":"Ein Fahrweg, welcher ausschliesslich durch Notbedienung eingestellt werden kann, unabhängig vom Regelbetrieb.","c":false}],"fdv":"Gestörter Abschnitt: ein Fahrweg, welcher durch ein gestörtes Element der Sicherungsanlage beeinflusst wird oder in welchem sich ein mittels Notbedienung in Grundstellung verbrachtes Element der Sicherungsanlage befindet. Dieser entspricht der Fahrstrasse, welche im Regelbetrieb ohne Notbedienung eingestellt werden kann. Er ist durch den FDL für jede Fahrt erneut zu bestimmen.","note":"","optTags":{"A":[],"B":[],"C":[],"D":[]},"optNotes":{"A":"","B":"","C":"","D":""}},{"nr":183,"p":1,"term":"Instruierte Person für elektrische Anlagen (IPEA)","approved":false,"q":"Was ist eine «Instruierte Person für elektrische Anlagen (IPEA)» gemäss FDV R 300.1, Ziff. 2.5.2?","opts":[{"l":"A","t":"Person mit Erfahrung im Umgang mit Starkstromanlagen, die Personen instruieren und ausbilden darf.","c":false},{"l":"B","t":"Person mit Berechtigung, um begrenzte, genau umschriebene Tätigkeiten in Starkstromanlagen auszuführen, gemäss Instruktion durch eine sachverständige Person. Sie kennt die örtlichen Verhältnisse und die zu treffenden Schutzmassnahmen.","c":true},{"l":"C","t":"Person, die für Schalthandlungen an elektrischen Anlagen instruiert oder sachverständig ist und diese immer im Auftrag ausführt.","c":false},{"l":"D","t":"Person mit unbeschränkter Berechtigung für sämtliche Tätigkeiten in Starkstromanlagen, ohne vorherige Instruktion.","c":false}],"fdv":"Instruierte Person für elektrische Anlagen (IPEA): Person mit Berechtigung, um begrenzte, genau umschriebene Tätigkeiten in Starkstromanlagen auszuführen, gemäss Instruktion durch eine sachverständige Person. Sie kennt die örtlichen Verhältnisse und die zu treffenden Schutzmassnahmen.","note":"","optTags":{"A":[],"B":[],"C":[],"D":[]},"optNotes":{"A":"","B":"","C":"","D":""}},{"nr":184,"p":1,"term":"Sachverständige Person für elektrische Anlagen (SPEA)","approved":false,"q":"Was ist eine «Sachverständige Person für elektrische Anlagen (SPEA)» gemäss FDV R 300.1, Ziff. 2.5.2?","opts":[{"l":"A","t":"Person mit Berechtigung, um begrenzte, genau umschriebene Tätigkeiten in Starkstromanlagen auszuführen, gemäss Instruktion durch eine andere Person.","c":false},{"l":"B","t":"Person, die für Schalthandlungen an elektrischen Anlagen instruiert oder sachverständig ist und diese immer im Auftrag ausführt, ausser in Notsituationen.","c":false},{"l":"C","t":"Person mit Erfahrung im Umgang mit Starkstromanlagen, kennt die örtlichen Verhältnisse und die zu treffenden Schutzmassnahmen. Sie kann z.B. als Betriebsinhaber, Anlageverantwortlicher, Arbeitsverantwortlicher oder Schaltberechtigte Person eingesetzt werden und darf Personen instruieren und ausbilden.","c":true},{"l":"D","t":"Person ohne praktische Erfahrung, die ausschliesslich theoretisch für Starkstromanlagen ausgebildet ist.","c":false}],"fdv":"Sachverständige Person für elektrische Anlagen (SPEA): Person mit Erfahrung im Umgang mit Starkstromanlagen, kennt die örtlichen Verhältnisse und die zu treffenden Schutzmassnahmen. Sie kann z.B. als Betriebsinhaber, Anlageverantwortlicher, Arbeitsverantwortlicher oder Schaltberechtigte Person eingesetzt werden und darf Personen instruieren und ausbilden.","note":"","optTags":{"A":[],"B":[],"C":[],"D":[]},"optNotes":{"A":"","B":"","C":"","D":""}},{"nr":185,"p":1,"term":"Schaltberechtigte Person","approved":false,"q":"Was gilt für die «Schaltberechtigte Person» gemäss FDV R 300.1, Ziff. 2.5.2?","opts":[{"l":"A","t":"Sie ist für Schalthandlungen an elektrischen Anlagen instruiert oder sachverständig. Sie führt Schalthandlungen immer im Auftrag aus, ausser in Notsituationen.","c":true},{"l":"B","t":"Sie darf Schalthandlungen ausschliesslich auf eigene Initiative ausführen, niemals im Auftrag.","c":false},{"l":"C","t":"Sie hat Erfahrung im Umgang mit Starkstromanlagen und darf Personen instruieren und ausbilden.","c":false},{"l":"D","t":"Sie darf begrenzte, genau umschriebene Tätigkeiten in Starkstromanlagen ausführen, gemäss Instruktion durch eine sachverständige Person.","c":false}],"fdv":"Schaltberechtigte Person: Person ist für Schalthandlungen an elektrischen Anlagen instruiert oder sachverständig. Sie führt Schalthandlungen immer im Auftrag aus, ausser in Notsituationen.","note":"","optTags":{"A":[],"B":[],"C":[],"D":[]},"optNotes":{"A":"","B":"","C":"","D":""}},{"nr":186,"p":1,"term":"Sicherheitsdispositiv (SIDI)","approved":false,"q":"Was ist das «Sicherheitsdispositiv (SIDI)» gemäss FDV R 300.1, Ziff. 2.5.2?","opts":[{"l":"A","t":"Festlegung der für eine Arbeitsstelle notwendigen Sicherheitsmassnahmen, sowie der durch die ISB in ihren Ausführungsbestimmungen vorgeschriebenen Angaben.","c":true},{"l":"B","t":"Die Stelle, die unter Verantwortung der ISB das SIDI mit den Sicherheitsmassnahmen vorschreibt und überwacht.","c":false},{"l":"C","t":"Verantwortliches Personal für die Durchführung der Sicherheitsmassnahmen auf der Arbeitsstelle.","c":false},{"l":"D","t":"Die einmalige, nicht anpassbare Festlegung der Sicherheitsmassnahmen zu Beginn einer Arbeitsstelle.","c":false}],"fdv":"Sicherheitsdispositiv (SIDI): Festlegung der für eine Arbeitsstelle notwendigen Sicherheitsmassnahmen, sowie der durch die ISB in ihren Ausführungsbestimmungen vorgeschriebenen Angaben.","note":"","optTags":{"A":[],"B":[],"C":[],"D":[]},"optNotes":{"A":"","B":"","C":"","D":""}},{"nr":187,"p":2,"term":"Begleitung der Züge (Ziff. 2.6.1)","approved":false,"q":"Was gilt gemäss FDV R 300.1, Ziff. 2.6.1 «Begleitung der Züge»?","opts":[{"l":"A","t":"Alle Züge müssen zwingend von einem Zugbegleiter/einer Zugbegleiterin (ZBE) begleitet werden.","c":false},{"l":"B","t":"Züge, welche die technischen Bedingungen erfüllen, verkehren in der Regel ohne ZBE. Die EVU bezeichnen in den Ausführungsbestimmungen die Züge, die begleitet werden.","c":true},{"l":"C","t":"Die Begleitung durch einen ZBE ist ausschliesslich dem Lokführer selbst überlassen, ohne Vorgaben des EVU.","c":false},{"l":"D","t":"Züge, welche die technischen Bedingungen erfüllen, verkehren immer mit ZBE.","c":false}],"fdv":"Begleitung der Züge: Züge, welche die technischen Bedingungen erfüllen, verkehren in der Regel ohne ZBE. Die EVU bezeichnen in den Ausführungsbestimmungen die Züge, die begleitet werden.","note":"","optTags":{"A":[],"B":[],"C":[],"D":["needs_review"]},"optNotes":{"A":"","B":"","C":"","D":""},"contentVersion":2},{"nr":188,"p":1,"term":"Verzeichnis kilometrische Lage Bahnübergangsanlagen (Ziff. 2.6.2)","approved":false,"q":"Was gilt gemäss FDV R 300.1, Ziff. 2.6.2 zum «Verzeichnis über die kilometrische Lage der Bahnübergangsanlagen»?","opts":[{"l":"A","t":"Die EVU haben ein aktuelles Verzeichnis zu erstellen, das ausschliesslich dem Sicherheitschef zugänglich sein muss.","c":false},{"l":"B","t":"Die ISB haben ein aktuelles Verzeichnis über die kilometrische Lage der Bahnübergangsanlagen und deren Bahnübergänge zu erstellen. Mindestens dem FDL ist dieses Verzeichnis in geeigneter Weise zugänglich zu machen.","c":true},{"l":"C","t":"Die ISB sind nicht verpflichtet, ein solches Verzeichnis zu erstellen; dies obliegt ausschliesslich den EVU.","c":false},{"l":"D","t":"Die ISB haben ein Verzeichnis zu erstellen, das jedoch nur bei Bedarf und ohne Zugänglichkeit für den FDL geführt wird.","c":false}],"fdv":"Verzeichnis über die kilometrische Lage der Bahnübergangsanlagen: die ISB haben ein aktuelles Verzeichnis über die kilometrische Lage der Bahnübergangsanlagen und deren Bahnübergänge zu erstellen. Mindestens dem FDL ist dieses Verzeichnis in geeigneter Weise zugänglich zu machen.","note":"","optTags":{"A":[],"B":[],"C":["needs_review"],"D":[]},"optNotes":{"A":"","B":"","C":"","D":""},"contentVersion":2},{"nr":189,"p":2,"term":"Checklisten Fahrdienst - Anwendungspflicht (Ziff. 2.6.3)","approved":false,"q":"In welchen Fällen ist gemäss FDV R 300.1, Ziff. 2.6.3 das Erstellen und Anwenden der Checkliste Fahrdienst (CL-F) im Bahnbetrieb verbindlich?","opts":[{"l":"A","t":"Ausschliesslich bei der Behebung von Störungen, in keinem anderen Fall.","c":false},{"l":"B","t":"Wenn Rangierbewegungen auf die Strecke verkehren, zur Behebung von Störungen, beim Einführen/Aufheben von betrieblichen Sicherheitsmassnahmen bei Arbeiten im Gleisbereich, sowie in zusätzlichen vom EBU vorgeschriebenen Fällen.","c":true},{"l":"C","t":"Nur wenn der Fahrdienstleiter dies im Einzelfall als sinnvoll erachtet.","c":false},{"l":"D","t":"Ausschliesslich beim Einführen von Sicherheitsmassnahmen bei Arbeiten im Gleisbereich, in keinem anderen Fall.","c":false}],"fdv":"Checklisten Fahrdienst (CL-F): das Erstellen und Anwenden der CL-F ist im Bahnbetrieb verbindlich, wenn Rangierbewegungen auf die Strecke verkehren, zur Behebung von Störungen, zum Einführen/Aufheben von betrieblichen Sicherheitsmassnahmen bei Arbeiten im Gleisbereich, sowie in den zusätzlichen vom EBU vorgeschriebenen Fällen. Die FDV bilden die Grundlage für die Erstellung der CL-F.","note":"","optTags":{"A":[],"B":[],"C":[],"D":[]},"optNotes":{"A":"","B":"","C":"","D":""}},{"nr":190,"p":1,"term":"Energieeffizienz (Ziff. 2.6.4)","approved":false,"q":"Was gilt gemäss FDV R 300.1, Ziff. 2.6.4 «Energieeffizienz»?","opts":[{"l":"A","t":"Die ISB und die EVU unterstützen den wirtschaftlichen Einsatz von Energie, soweit die Sicherheit nicht negativ beeinflusst wird. Sie erlassen die dazu notwendigen Betriebsvorschriften.","c":true},{"l":"B","t":"Energieeffizienz hat immer Vorrang vor Sicherheitsüberlegungen.","c":false},{"l":"C","t":"Ausschliesslich die ISB sind für Energieeffizienz-Massnahmen zuständig, die EVU haben keine diesbezügliche Verantwortung.","c":false},{"l":"D","t":"Die ISB und die EVU unterstützen den wirtschaftlichen Einsatz von Energie unabhängig davon, ob die Sicherheit dadurch beeinflusst wird.","c":false}],"fdv":"Energieeffizienz: die ISB und die EVU unterstützen den wirtschaftlichen Einsatz von Energie, soweit die Sicherheit nicht negativ beeinflusst wird. Sie erlassen die dazu notwendigen Betriebsvorschriften.","note":"","optTags":{"A":[],"B":[],"C":[],"D":[]},"optNotes":{"A":"","B":"","C":"","D":""}},{"nr":191,"p":2,"term":"Abstimmung bei geteilten Funktionen (Ziff. 2.7)","approved":false,"q":"Was gilt gemäss FDV R 300.1, Ziff. 2.7, wenn fahrdienstliche Aufgaben einer Funktion durch verschiedene Personen wahrgenommen werden?","opts":[{"l":"A","t":"Die Beteiligten sprechen sich über die Ausgangslage, den Stand der Arbeit und das konkrete Vorgehen ab, insbesondere bei geographischer oder funktionaler Trennung der Zuständigkeiten sowie bei zeitlicher Staffelung.","c":true},{"l":"B","t":"Jede Person arbeitet unabhängig, eine Absprache ist nur bei zeitlicher Staffelung nötig.","c":false},{"l":"C","t":"Es genügt, wenn jede Person ihre eigene Aufgabe erledigt; eine gegenseitige Abstimmung ist nicht erforderlich.","c":false},{"l":"D","t":"Eine gegenseitige Absprache ist gesetzlich nicht vorgeschrieben, aber empfohlen.","c":false}],"fdv":"Einsatz und Verhalten des Personals: werden fahrdienstliche Aufgaben einer Funktion durch verschiedene Personen wahrgenommen, sprechen sich die Beteiligten über die Ausgangslage, den Stand der Arbeit und das konkrete Vorgehen ab. Dies gilt insbesondere bei geographischer oder funktionaler Trennung der Zuständigkeiten sowie bei zeitlicher Staffelung.","note":"","optTags":{"A":[],"B":[],"C":["needs_review"],"D":[]},"optNotes":{"A":"","B":"","C":"","D":""},"contentVersion":2},{"nr":192,"p":2,"term":"Mehrere Funktionen durch eine Person (Ziff. 2.7)","approved":false,"q":"Was gilt gemäss FDV R 300.1, Ziff. 2.7, wenn mehrere Funktionen durch eine einzelne Person wahrgenommen werden?","opts":[{"l":"A","t":"Diese Person stellt die korrekte Ausführung aller betreffenden fahrdienstlichen Tätigkeiten sicher.","c":true},{"l":"B","t":"Diese Person darf nur eine der zugewiesenen Funktionen tatsächlich ausüben.","c":false},{"l":"C","t":"Es ist zwingend eine zweite Person beizuziehen, welche die korrekte Ausführung kontrolliert.","c":false},{"l":"D","t":"Die Verantwortung für die korrekte Ausführung verteilt sich automatisch auf alle beteiligten Stellen des EBU.","c":false}],"fdv":"Werden mehrere Funktionen durch eine einzelne Person wahrgenommen, stellt diese Person die korrekte Ausführung aller betreffenden fahrdienstlichen Tätigkeiten sicher.","note":"","optTags":{"A":[],"B":[],"C":[],"D":[]},"optNotes":{"A":"","B":"","C":"","D":""}},{"nr":193,"p":1,"term":"Dienstübergabe (Ziff. 2.7)","approved":false,"q":"Was gilt gemäss FDV R 300.1, Ziff. 2.7 bei der Dienstübergabe?","opts":[{"l":"A","t":"Die abtretende Person übergibt die erforderlichen Informationen an die nachfolgende. Erfolgt keine direkte Übergabe, sind Besonderheiten schriftlich zu vermitteln.","c":true},{"l":"B","t":"Eine Übergabe von Informationen ist nur bei direkter, mündlicher Übergabe vorgeschrieben; ohne direkten Kontakt entfällt sie.","c":false},{"l":"C","t":"Die nachfolgende Person ist verpflichtet, sich die notwendigen Informationen eigenständig zu beschaffen.","c":false},{"l":"D","t":"Besonderheiten müssen ausschliesslich mündlich, niemals schriftlich, vermittelt werden.","c":false}],"fdv":"Bei Dienstübergabe übergibt die abtretende Person die erforderlichen Informationen an die nachfolgende. Erfolgt keine direkte Übergabe, sind Besonderheiten schriftlich zu vermitteln.","note":"","optTags":{"A":[],"B":[],"C":[],"D":[]},"optNotes":{"A":"","B":"","C":"","D":""}},{"nr":194,"p":1,"term":"Arbeits- und Ruhezeit (Ziff. 2.7.1)","approved":false,"q":"Was gilt gemäss FDV R 300.1, Ziff. 2.7.1 zur Arbeits- und Ruhezeit?","opts":[{"l":"A","t":"Personen, die fahrdienstliche Tätigkeiten ausüben, sind für die Einhaltung der gesetzlichen Vorgaben über die Arbeits- und Ruhezeit mitverantwortlich.","c":true},{"l":"B","t":"Die Einhaltung der Arbeits- und Ruhezeit liegt ausschliesslich in der Verantwortung des Arbeitgebers, nicht des Personals.","c":false},{"l":"C","t":"Gesetzliche Vorgaben zur Arbeits- und Ruhezeit gelten für fahrdienstliches Personal nicht.","c":false},{"l":"D","t":"Die Verantwortung für die Arbeits- und Ruhezeit trägt ausschliesslich der Sicherheitschef.","c":false}],"fdv":"Personen, die fahrdienstliche Tätigkeiten ausüben, sind für die Einhaltung der gesetzlichen Vorgaben über die Arbeits- und Ruhezeit mitverantwortlich.","note":"","optTags":{"A":[],"B":[],"C":[],"D":[]},"optNotes":{"A":"","B":"","C":"","D":""}},{"nr":195,"p":1,"term":"Signalmittel Triebfahrzeuge/Steuerwagen (Ziff. 2.9.1)","approved":false,"q":"Wähle gemäss FDV R 300.1, Ziff. 2.9.1 alle Signalmittel aus, die auf jedem Triebfahrzeug und Steuerwagen im Bahnbetrieb mitzuführen sind (Mehrfachauswahl).","opts":[{"l":"A","t":"Laterne mit weissem und rotem Licht","c":true},{"l":"B","t":"Rote Signalflagge","c":true},{"l":"C","t":"Rote Haltsignal-Scheibe","c":false},{"l":"D","t":"Mundpfeife","c":false},{"l":"E","t":"Taschenlampe","c":false}],"fdv":"Signalmittel der Triebfahrzeuge und Steuerwagen im Bahnbetrieb: auf jedem Triebfahrzeug und Steuerwagen sind mitzuführen: eine Laterne mit weissem und rotem Licht, eine rote Signalflagge.","note":"","optTags":{"A":[],"B":[],"C":[],"D":[],"E":[]},"optNotes":{"A":"","B":"","C":"","D":"","E":""},"multiSelect":true,"contentVersion":2},{"nr":196,"p":1,"term":"Signalmittel in Bahnhöfen (Ziff. 2.9.2)","approved":false,"q":"Wähle gemäss FDV R 300.1, Ziff. 2.9.2 alle Signalmittel aus, die in Bahnhöfen im Bahnbetrieb während der örtlichen Besetzung bereitzuhalten sind (Mehrfachauswahl).","opts":[{"l":"A","t":"Laterne oder Taschenlampe mit weissem und rotem Licht","c":true},{"l":"B","t":"Rote Signalflagge","c":true},{"l":"C","t":"Rote Haltsignal-Scheibe","c":true},{"l":"D","t":"Mundpfeife","c":false},{"l":"E","t":"Handlaterne mit weissem und rotem Licht","c":false}],"fdv":"Signalmittel in Bahnhöfen im Bahnbetrieb: in Bahnhöfen ist während der örtlichen Besetzung bereitzuhalten: eine Laterne oder eine Taschenlampe mit weissem und rotem Licht, eine rote Signalflagge, eine rote Haltsignal-Scheibe.","note":"","optTags":{"A":[],"B":[],"C":[],"D":[],"E":[]},"optNotes":{"A":"","B":"","C":"","D":"","E":""},"multiSelect":true,"contentVersion":2},{"nr":199,"p":1,"term":"Grenze zwischen verschiedenen ISB (Ziff. 2.11.2)","approved":false,"q":"Was gilt gemäss FDV R 300.1, Ziff. 2.11.2 zur Grenze zwischen verschiedenen ISB?","opts":[{"l":"A","t":"Die Grenze zwischen verschiedenen ISB wird signalisiert. Auf die Signalisierung kann verzichtet werden, wenn die Grenze in den Betriebsvorschriften definiert und für das betroffene Personal eindeutig erkennbar ist.","c":true},{"l":"B","t":"Die Grenze zwischen verschiedenen ISB muss immer signalisiert werden, ohne jegliche Ausnahme.","c":false},{"l":"C","t":"Eine Signalisierung der Grenze zwischen verschiedenen ISB ist gesetzlich nicht vorgesehen.","c":false},{"l":"D","t":"Die Grenze zwischen verschiedenen ISB wird ausschliesslich in den Betriebsvorschriften des EVU geregelt.","c":false}],"fdv":"Grenze zwischen verschiedenen ISB: die Grenze zwischen verschiedenen ISB wird signalisiert. Auf die Signalisierung kann verzichtet werden, wenn die Grenze in den Betriebsvorschriften definiert und für das betroffene Personal eindeutig erkennbar ist.","note":"","optTags":{"A":[],"B":[],"C":[],"D":[]},"optNotes":{"A":"","B":"","C":"","D":""}},{"nr":197,"p":1,"term":"Signalmittel des Personals - Fahrdienstleiter/in mit Aufsichtsfunktion (Ziff. 2.9.3)","approved":false,"multiSelect":true,"q":"Wähle gemäss FDV R 300.1, Ziff. 2.9.3 alle Signalmittel aus, die der/die Fahrdienstleiter/in mit Aufsichtsfunktion im Bahnbetrieb benötigt (Mehrfachauswahl).","opts":[{"l":"A","t":"Mundpfeife","c":true},{"l":"B","t":"Taschenlampe","c":false},{"l":"C","t":"Handlaterne mit weissem und rotem Licht bei Nacht","c":false},{"l":"D","t":"Rote Haltsignal-Scheibe","c":false},{"l":"E","t":"Rote Signalflagge","c":false}],"fdv":"Signalmittel des Personals im Bahnbetrieb: der RL, der RA und der FDL mit Aufsichtsfunktion benötigen eine Mundp orgeheizt werden, sind mit Vorheiztafeln gekennzeichnet, ausgenommen Pendelzüge, auch mit Zusatzwagen, die über das Triebfahrzeug vorgeheizt werden.","note":"","optTags":{"A":[],"B":[],"C":[],"D":[]},"optNotes":{"A":"","B":"","C":"","D":""},"img":"images/image132.png","contentVersion":2},{"nr":209,"p":1,"term":"Hemmschuhwarntafel (Ziff. 3.2.6)","approved":false,"q":"Wie lautet der Begriff (Name) dieses Signals gemäss FDV R 300.2, Ziff. 3.2.6?","opts":[{"l":"A","t":"Vorsicht Profil","c":false},{"l":"B","t":"Hemmschuhwarntafel","c":true},{"l":"C","t":"Vorheiztafel","c":false},{"l":"D","t":"Halt","c":false}],"fdv":"Hemmschuhwarntafel - Bedeutung: Die Fahrzeuge sind mit Hemmschuhen gegen Entlaufen gesichert.","note":"","optTags":{"A":[],"B":[],"C":[],"D":[]},"optNotes":{"A":"","B":"","C":"","D":""},"img":"images/image133.png","contentVersion":2},{"nr":210,"p":2,"term":"Signal Vorwärts (Ziff. 3.3.2)","approved":false,"q":"Wie lautet der Begriff (Name) dieses Signals gemäss FDV R 300.2, Ziff. 3.3.2?","opts":[{"l":"A","t":"Rückwärts","c":false},{"l":"B","t":"Vorwärts","c":true},{"l":"C","t":"Anfahren vorwärts","c":false},{"l":"D","t":"Bewegen","c":false}],"fdv":"Vorwärts - Signal: ein langer Pfiff und einmaliges Bewegen des erhobenen Arms in senkrechtem Halbkreis in der Fahrrichtung. Begriff: Vorwärts. Bedeutung: Vorwärts fahren. Es kann das Signal Sichtverbindung folgen.","note":"","optTags":{"A":[],"B":[],"C":[],"D":[]},"optNotes":{"A":"","B":"","C":"","D":""},"img":"images/image134.png","contentVersion":2},{"nr":211,"p":2,"term":"Signal Anfahren vorwärts (Ziff. 3.3.4)","approved":false,"q":"Wie lautet der Begriff (Name) dieses Signals gemäss FDV R 300.2, Ziff. 3.3.4?","opts":[{"l":"A","t":"Anfahren rückwärts","c":false},{"l":"B","t":"Vorwärts","c":false},{"l":"C","t":"Anfahren vorwärts","c":true},{"l":"D","t":"Stoss","c":false}],"fdv":"Anfahren vorwärts - Signal: ein langer Pfiff und einmaliges kreisförmiges Einwärtsbewegen der beiden erhobenen Arme quer zum Gleis. Begriff: Anfahren vorwärts. Bedeutung: Vorwärts gegen ein Hindernis fahren. Es kann das Signal Sichtverbindung folgen. Die Signale Anfahren vorwärts und Anfahren rückwärts sind durch den Ruf «anfahren» zu ergänzen.","note":"","optTags":{"A":[],"B":[],"C":[],"D":[]},"optNotes":{"A":"","B":"","C":"","D":""},"img":"images/image136.png","contentVersion":2},{"nr":212,"p":2,"term":"Signal Sichtverbindung (Ziff. 3.3.5)","approved":false,"q":"Wie lautet der Begriff (Name) dieses Signals gemäss FDV R 300.2, Ziff. 3.3.5?","opts":[{"l":"A","t":"Sichtverbindung","c":true},{"l":"B","t":"Langsamer","c":false},{"l":"C","t":"Bewegen","c":false},{"l":"D","t":"Halt","c":false}],"fdv":"Sichtverbindung - Signal: langsames Schwingen des nach unten ausgestreckten Arms schräg zum Gleis. Begriff: Sichtverbindung. Bedeutung: Optische Verbindungsüberwachung zwischen dem den Fahrweg beobachtenden RL und dem LF. Es können Entfernungsangaben folgen. Das Signal ist nach Beginn der Entfernungsangaben nicht mehr zu geben.","note":"","optTags":{"A":[],"B":[],"C":[],"D":[]},"optNotes":{"A":"","B":"","C":"","D":""},"img":"images/image138.png","contentVersion":2},{"nr":213,"p":2,"term":"Signal Stoss (Ziff. 3.3.7)","approved":false,"q":"Wie lautet der Begriff (Name) dieses Signals gemäss FDV R 300.2, Ziff. 3.3.7?","opts":[{"l":"A","t":"Anfahren vorwärts","c":false},{"l":"B","t":"Stoss","c":true},{"l":"C","t":"Halt","c":false},{"l":"D","t":"Sichtverbindung","c":false}],"fdv":"Stoss - Signal: ein kurzer und ein langer Pfiff sowie einmaliges rasches Bewegen des erhobenen Arms in senkrechtem Halbkreis in der Richtung des Stosses. Das Signal ist durch den Ruf «Stoss» zu ergänzen. Begriff: Stoss. Bedeutung: Rasches Beschleunigen der Rangierbewegung. Befinden sich vor und hinter dem Triebfahrzeug Wagen, ist der LF über die Richtung des Stosses zu verständigen.","note":"","optTags":{"A":[],"B":[],"C":[],"D":[]},"optNotes":{"A":"","B":"","C":"","D":""},"img":"images/image140.png","contentVersion":2},{"nr":214,"p":2,"term":"Signal Halt bei Rangierbewegungen (Ziff. 3.3.9)","approved":false,"q":"Wie lautet der Begriff (Name) dieses Signals gemäss FDV R 300.2, Ziff. 3.3.9?","opts":[{"l":"A","t":"Bewegen","c":false},{"l":"B","t":"Langsamer","c":false},{"l":"C","t":"Halt","c":true},{"l":"D","t":"Rückwärts","c":false}],"fdv":"Halt (Personal bei Rangierbewegungen) - Signal bei Tag: drei kurze Pfiffe und rasches Auf- und Abwärtsbewegen des quer zum Gleis ausgestreckten Arms. Bei Nacht: drei kurze Pfiffe und rasches Auf- und Abwärtsbewegen mit rotem Licht; ist kein solches vorhanden, ist ausnahmsweise ein weisses Licht zugelassen. Begriff: Halt. Bedeutung: Anhalten.","note":"","optTags":{"A":[],"B":[],"C":[],"D":[]},"optNotes":{"A":"","B":"","C":"","D":""},"img":"images/image143.png","contentVersion":2},{"nr":215,"p":1,"term":"Vorsicht Profil (Ziff. 3.4.2)","approved":false,"q":"Wie lautet der Begriff (Name) dieses Signals gemäss FDV R 300.2, Ziff. 3.4.2?","opts":[{"l":"A","t":"Hemmschuhwarntafel","c":false},{"l":"B","t":"Vorsicht Profil","c":true},{"l":"C","t":"Vorheiztafel","c":false},{"l":"D","t":"Halt","c":false}],"fdv":"Warnzeichen - gelb-schwarze Streifen kennzeichnen Hindernisse, die nahe ans Profil grenzen oder eine nicht ohne weiteres erkennbare Gefahrenstelle sind. Begriff: Vorsicht Profil. Bedeutung: Besondere Vorsicht.","note":"","optTags":{"A":[],"B":[],"C":[],"D":[]},"optNotes":{"A":"","B":"","C":"","D":""},"img":"images/image149.png","contentVersion":2},{"nr":216,"p":2,"term":"Gültigkeit der Signale (Ziff. 1.1.1)","approved":false,"q":"Was gilt gemäss FDV R 300.2, Ziff. 1.1.1 für Signale, die entgegen den Vorschriften nicht beleuchtet sind oder sich in zweifelhafter Stellung befinden?","opts":[{"l":"A","t":"Sie sind als «Halt» zeigende Signale zu betrachten; Vorsignale sinngemäss als «Warnung» zeigend.","c":true},{"l":"B","t":"Sie dürfen ignoriert werden, bis der FDL eine Anweisung erteilt.","c":false},{"l":"C","t":"Sie sind als «Warnung» zeigende Signale zu betrachten; Vorsignale sinngemäss als «Halt» zeigend.","c":false},{"l":"D","t":"Sie sind als «Halt» zeigende Signale zu betrachten; Vorsignale gelten davon ausgenommen weiterhin als «Fahrt» zeigend.","c":false}],"fdv":"Gültigkeit der Signale: Signale, die entgegen den Vorschriften nicht beleuchtet sind oder sich in zweifelhafter Stellung befinden, sind als Halt zeigende Signale zu betrachten; sinngemäss sind Vorsignale als Warnung zeigend zu betrachten.","note":"","optTags":{"A":[],"B":["needs_review"],"C":["needs_review"],"D":["needs_review"]},"optNotes":{"A":"","B":"","C":"","D":""},"contentVersion":2},{"nr":217,"p":1,"term":"Fehlende Signaltafeln (Ziff. 1.1.2)","approved":false,"q":"Was ist gemäss FDV R 300.2, Ziff. 1.1.2 zu tun, wenn das Personal ein fehlendes oder nicht eindeutig erkennbares ortsfestes Signal feststellt?","opts":[{"l":"A","t":"Der zuständige FDL ist zu verständigen.","c":true},{"l":"B","t":"Das Signal darf als «Fahrt» zeigend angenommen werden.","c":false},{"l":"C","t":"Es ist ein Eintrag in der Checkliste Fahrdienst vorzunehmen, ohne den FDL zu informieren.","c":false},{"l":"D","t":"Die nächste Arbeitsstelle ist zu verständigen.","c":false}],"fdv":"Fehlende oder nicht eindeutig erkennbare ortsfeste Signaltafeln: wird durch das Personal ein fehlendes oder nicht eindeutig erkennbares ortsfestes Signal festgestellt, ist der zuständige FDL zu verständigen.","note":"","optTags":{"A":[],"B":[],"C":[],"D":[]},"optNotes":{"A":"","B":"","C":"","D":""}},{"nr":218,"p":1,"term":"Aufstellung der Signale (Ziff. 1.1.3)","approved":false,"q":"Wo befinden sich ortsfeste Signale gemäss FDV R 300.2, Ziff. 1.1.3 grundsätzlich?","opts":[{"l":"A","t":"Links vom Gleis, in Fahrrichtung gesehen. Auf einspurigen Strecken können sie zur besseren Sichtbarkeit auch rechts aufgestellt sein.","c":true},{"l":"B","t":"Rechts vom Gleis, in Fahrrichtung gesehen, ohne Ausnahmen.","c":false},{"l":"C","t":"Links vom Gleis, unabhängig von der Fahrrichtung.","c":false},{"l":"D","t":"Immer zwischen den beiden Gleisen, auch auf eingleisigen Strecken.","c":false}],"fdv":"Aufstellung der Signale: ortsfeste Signale befinden sich links vom Gleis. Auf einspurigen Strecken können sie zur besseren Sichtbarkeit auch rechts aufgestellt sein. Die Bezeichnungen links und rechts gelten im Sinne der Fahrrichtung.","note":"","optTags":{"A":[],"B":[],"C":[],"D":[]},"optNotes":{"A":"","B":"","C":"","D":""}},{"nr":219,"p":2,"term":"Abgabe von Signalen des Personals (Ziff. 1.1.4)","approved":false,"q":"Was gilt gemäss FDV R 300.2, Ziff. 1.1.4, wenn ein Signal des Personals nicht eindeutig ist oder nicht deutlich wahrgenommen wird?","opts":[{"l":"A","t":"Es ist anzuhalten, seine Wiederholung abzuwarten oder zu erwirken.","c":true},{"l":"B","t":"Es ist mit der bisherigen Geschwindigkeit weiterzufahren, bis das Signal erneut gegeben wird.","c":false},{"l":"C","t":"Die Geschwindigkeit ist sofort auf Fahrt auf Sicht, höchstens 40 km/h, zu reduzieren.","c":false},{"l":"D","t":"Es ist ausschliesslich der Sicherheitschef zu verständigen, ein Anhalten ist nicht vorgesehen.","c":false}],"fdv":"Abgabe von Signalen des Personals: bei der Abgabe von Signalen ist mit Ruhe und Überlegung zu handeln. Die Signale müssen deutlich sein und genau beachtet werden. Sind Missverständnisse zu befürchten, sind Mitarbeitende, welche das Signal zu beachten haben, zusätzlich zu verständigen. Ist ein Signal nicht eindeutig oder wird es nicht deutlich wahrgenommen, ist anzuhalten, seine Wiederholung abzuwarten oder zu erwirken.","note":"","optTags":{"A":[],"B":["needs_review"],"C":["needs_review"],"D":["needs_review"]},"optNotes":{"A":"","B":"","C":"","D":""},"contentVersion":3},{"nr":222,"p":1,"term":"Sperrsignal (Ziff. 2.1.1)","approved":false,"img":"images/image4.png","q":"Wie heisst dieses Signal (Begriff) gemäss FDV R 300.2, Ziff. 2.1.1?","opts":[{"l":"A","t":"Sperrsignal","c":true},{"l":"B","t":"Haltsignal für das Decken eines Hindernisses","c":false},{"l":"C","t":"Rangierhaltsignal","c":false},{"l":"D","t":"Vorsignal zum Kontrolllicht Bahnübergangsanlage","c":false}],"fdv":"Sperrsignal - Begriff: Halt. Bedeutung: Halt vor dem Signal.","note":"","optTags":{"A":[],"B":[],"C":[],"D":[]},"optNotes":{"A":"","B":"","C":"","D":""}},{"nr":223,"p":2,"term":"Kennzeichnung Entgleisungsvorrichtung/Sperrschuh (Ziff. 2.1.2)","approved":false,"img":"images/image5.png","q":"Was gilt gemäss FDV R 300.2, Ziff. 2.1.2 für das Signal einer Entgleisungsvorrichtung oder eines Sperrschuhs, wenn diese abgeklappt sind?","opts":[{"l":"A","t":"Das Signal zeigt kein Bild.","c":true},{"l":"B","t":"Das Signal zeigt immer «Halt», unabhängig vom Zustand.","c":false},{"l":"C","t":"Das Signal zeigt das der Weichenstellung entsprechende Bild.","c":false},{"l":"D","t":"Das Signal zeigt ein rotes Blinklicht.","c":false}],"fdv":"Kennzeichnung der Stellung von Entgleisungsvorrichtungen, Sperrschuhen: das Signal zeigt kein Bild, wenn die Entgleisungsvorrichtung oder der Sperrschuh abgeklappt sind. Das Signal zeigt das der Weichenstellung entsprechende Bild, wenn die Weiche nicht in den Schutzstumpen führt.","note":"","optTags":{"A":[],"B":[],"C":[],"D":[]},"optNotes":{"A":"","B":"","C":"","D":""}},{"nr":224,"p":2,"term":"Haltsignal für das Decken eines Hindernisses (Ziff. 2.2.1)","approved":false,"img":"images/image8.png","multiSelect":true,"q":"Wähle gemäss FDV R 300.2, Ziff. 2.2.1 alle Zwecke aus, für die das «Haltsignal für das Decken eines Hindernisses» verwendet wird (Mehrfachauswahl).","opts":[{"l":"A","t":"Zum Decken gesperrter Gleise, insbesondere solcher, die nicht am Stellwerk gesichert werden können.","c":true},{"l":"B","t":"Zur Kennzeichnung von Gleisabschlüssen.","c":true},{"l":"C","t":"Zum Decken von Drehscheiben und Schiebebühnen in nicht verriegelter Stellung.","c":true},{"l":"D","t":"Zum Decken von Brückenwaagen, beweglichen Ladeprofilen usw.","c":true},{"l":"E","t":"Zur Kennzeichnung von Bahnübergangsanlagen mit Kontrolllicht.","c":false},{"l":"F","t":"Zur Regelung von Rangierbewegungen im Normalbetrieb.","c":false}],"fdv":"Haltsignal für das Decken eines Hindernisses - Begriff: Halt. Bedeutung: Halt vor dem Signal bzw. vor dem entsprechenden Objekt. Haltsignale werden verwendet: zum Decken gesperrter Gleise; zur Kennzeichnung von Gleisabschlüssen; zum Decken von Drehscheiben und Schiebebühnen in nicht verriegelter Stellung; zum Decken von Brückenwaagen, beweglichen Ladeprofilen usw.","note":"","optTags":{"A":[],"B":[],"C":[],"D":[],"E":[],"F":[]},"optNotes":{"A":"","B":"","C":"","D":"","E":"","F":""}},{"nr":225,"p":1,"term":"Vorsignal zum Kontrolllicht Bahnübergangsanlage (Ziff. 2.2.2)","approved":false,"img":"images/image10.png","q":"Wie lautet der Begriff dieses Signals gemäss FDV R 300.2, Ziff. 2.2.2, und was bedeutet es?","opts":[{"l":"A","t":"Bahnübergangsanlage eingeschaltet - Blinkt das Kontrolllicht orange oder weiss, ist die Bahnübergangsanlage eingeschaltet bzw. sind die Schranken geschlossen.","c":false},{"l":"B","t":"Vorsignal zum Kontrolllicht Bahnübergangsanlage - Es folgt eine Bahnübergangsanlage mit Kontrolllicht.","c":true},{"l":"C","t":"Achtung - Vorsicht, es nähert sich ein Zug oder eine Rangierbewegung.","c":false},{"l":"D","t":"Pfeifen - Abgabe des Achtungssignals.","c":false}],"fdv":"Kontrolllicht zur Bahnübergangsanlage - Begriff: Vorsignal zum Kontrolllicht Bahnübergangsanlage. Bedeutung: Es folgt eine Bahnübergangsanlage mit Kontrolllicht.","note":"","optTags":{"A":[],"B":[],"C":[],"D":[]},"optNotes":{"A":"","B":"","C":"","D":""},"contentVersion":2},{"nr":226,"p":1,"term":"Bahnübergangsanlage eingeschaltet (Ziff. 2.2.2)","approved":false,"img":"images/image11.png","q":"Wie lautet der Begriff dieses Signals gemäss FDV R 300.2, Ziff. 2.2.2, und was bedeutet ein orange oder weiss blinkendes Kontrolllicht?","opts":[{"l":"A","t":"Vorsignal zum Kontrolllicht Bahnübergangsanlage - es folgt eine Bahnübergangsanlage mit Kontrolllicht.","c":false},{"l":"B","t":"Bahnübergangsanlage eingeschaltet - die Bahnübergangsanlage ist e t Vorsicht, unabhängig vom Haupt- oder Sperrsignal.","c":false},{"l":"D","t":"Signalisiert ein Haupt- oder Sperrsignal Halt, zeigt das vorausgehende Zwergsignal ebenfalls Halt.","c":false}],"fdv":"Zwergsignale in Zugfahrstrassen: Zwergsignale zeigen bei eingestellter Zugfahrstrasse Fahrt. Signalisiert ein Haupt- oder Sperrsignal Halt, zeigt das vorausgehende Zwergsignal Fahrt mit Vorsicht.","note":"","optTags":{"A":[],"B":[],"C":[],"D":[]},"optNotes":{"A":"","B":"","C":"","D":""}},{"nr":251,"p":2,"term":"Letztes Zwergsignal gegen die Strecke (Ziff. 2.4.4)","approved":false,"q":"Was zeigt gemäss FDV R 300.2, Ziff. 2.4.4 das letzte Zwergsignal gegen die Strecke bei einer Zugfahrt bzw. bei einer Rangierbewegung?","opts":[{"l":"A","t":"Bei einer Zugfahrt Fahrt, bei einer Rangierbewegung Fahrt mit Vorsicht.","c":true},{"l":"B","t":"Bei einer Zugfahrt Fahrt mit Vorsicht, bei einer Rangierbewegung Fahrt.","c":false},{"l":"C","t":"Sowohl bei einer Zugfahrt als auch bei einer Rangierbewegung immer Fahrt mit Vorsicht.","c":false},{"l":"D","t":"Sowohl bei einer Zugfahrt als auch bei einer Rangierbewegung immer Fahrt.","c":false}],"fdv":"Letztes Zwergsignal gegen die Strecke: bei einer Zugfahrt zeigt das letzte Zwergsignal Fahrt, bei einer Rangierbewegung Fahrt mit Vorsicht.","note":"","optTags":{"A":[],"B":[],"C":[],"D":[]},"optNotes":{"A":"","B":"","C":"","D":""}},{"nr":252,"p":1,"term":"Zwergsignal Halt (Ziff. 2.4.5)","approved":false,"img":"images/image41.png","q":"Wie lautet der Begriff dieses Signals gemäss FDV R 300.2, Ziff. 2.4.5, und was bedeutet es?","opts":[{"l":"A","t":"Fahrt - Beginn oder Fortsetzung der Fahrt.","c":false},{"l":"B","t":"Halt - Halt vor dem Signal. Ein vorausgehendes Zwergsignal zeigt Fahrt mit Vorsicht.","c":true},{"l":"C","t":"Fahrt mit Vorsicht - Beginn oder Fortsetzung der Fahrt. Unmittelbar nach dem Zwergsignal muss mit einem Hindernis gerechnet werden.","c":false},{"l":"D","t":"Halt - Halt vor dem Signal. Ein vorausgehendes Zwergsignal zeigt ebenfalls Halt.","c":false}],"fdv":"Signalisierung an Zwergsignalen - Begriff: Halt. Bedeutung: Halt vor dem Signal. Beziehung zu anderen Signalen: ein vorausgehendes Zwergsignal zeigt Fahrt mit Vorsicht.","note":"","optTags":{"A":[],"B":[],"C":[],"D":[]},"optNotes":{"A":"","B":"","C":"","D":""}},{"nr":253,"p":1,"term":"Zwergsignal Fahrt mit Vorsicht (Ziff. 2.4.5)","approved":false,"img":"images/image42.png","q":"Wie lautet der Begriff dieses Signals gemäss FDV R 300.2, Ziff. 2.4.5, und was bedeutet es?","opts":[{"l":"A","t":"Halt - Halt vor dem Signal.","c":false},{"l":"B","t":"Fahrt - Beginn oder Fortsetzung der Fahrt. Das nächste Zwergsignal zeigt Fahrt oder Fahrt mit Vorsicht.","c":false},{"l":"C","t":"Fahrt mit Vorsicht - Beginn oder Fortsetzung der Fahrt. Unmittelbar nach dem Zwergsignal muss mit einem Hindernis gerechnet werden. Das nächste Zwergsignal zeigt Halt, Fahrt mit Vorsicht, oder es folgt kein weiteres Zwergsignal.","c":true},{"l":"D","t":"Fahrt mit Vorsicht - Beginn oder Fortsetzung der Fahrt. Es ist kein Hindernis zu erwarten.","c":false}],"fdv":"Signalisierung an Zwergsignalen - Begriff: Fahrt mit Vorsicht. Bedeutung: Beginn oder Fortsetzung der Fahrt. Unmittelbar nach dem Zwergsignal muss mit einem Hindernis gerechnet werden. Beziehung zu anderen Signalen: das nächste Zwergsignal zeigt Halt, Fahrt mit Vorsicht oder es folgt kein weiteres Zwergsignal.","note":"","optTags":{"A":[],"B":[],"C":[],"D":[]},"optNotes":{"A":"","B":"","C":"","D":""}},{"nr":254,"p":1,"term":"Zwergsignal Fahrt (Ziff. 2.4.5)","approved":false,"img":"images/image43.png","q":"Wie lautet der Begriff dieses Signals gemäss FDV R 300.2, Ziff. 2.4.5, und was bedeutet es?","opts":[{"l":"A","t":"Fahrt mit Vorsicht - Beginn oder Fortsetzung der Fahrt. Unmittelbar nach dem Zwergsignal muss mit einem Hindernis gerechnet werden.","c":false},{"l":"B","t":"Halt - Halt vor dem Signal.","c":false},{"l":"C","t":"Fahrt - Beginn oder Fortsetzung der Fahrt. Das nächste Zwergsignal zeigt Fahrt ode n der Fahrtrichtung.","c":false},{"l":"C","t":"Es gilt für beide Zweige, der Halteort ist in jedem Fall hinter den Weichenzungen.","c":false},{"l":"D","t":"Es gilt für beide Zweige. Bei Fahrt von der Wurzel aus ist der Halteort vor den Weichenzungen, bei Fahrt gegen die Spitze vor dem Zwergsignal.","c":false}],"fdv":"Zwergsignale im Bereich von Weichen: steht das Zwergsignal im Bereich der Weichenzungen einer einfachen Weiche, gilt es für beide Zweige. Bei Fahrt gegen die Weichenspitze ist der Halteort bei Halt zeigendem Zwergsignal vor den Weichenzungen. Bei der Fahrt von der Wurzel aus ist der Halteort vor dem Halt zeigenden Zwergsignal.","note":"","optTags":{"A":[],"B":[],"C":[],"D":[]},"optNotes":{"A":"","B":"","C":"","D":""}},{"nr":257,"p":2,"term":"Zwergsignal zwischen Herzstück und Sicherheitszeichen (Ziff. 2.4.6)","approved":false,"img":"images/image46.png","q":"Was gilt gemäss FDV R 300.2, Ziff. 2.4.6, wenn das Zwergsignal zwischen dem Herzstück und dem Sicherheitszeichen einer einfachen Weiche steht?","opts":[{"l":"A","t":"Es gilt für beide Zweige. Bei Halt zeigendem Zwergsignal ist der Halteort vor den Weichenzungen.","c":false},{"l":"B","t":"Es gilt nur für einen Zweig. Bei Halt zeigendem Zwergsignal ist der Halteort vor diesem Zwergsignal.","c":true},{"l":"C","t":"Es gilt für beide Zweige. Bei Halt zeigendem Zwergsignal ist der Halteort vor diesem Zwergsignal.","c":false},{"l":"D","t":"Es gilt nur für einen Zweig. Bei Halt zeigendem Zwergsignal ist der Halteort vor den Weichenzungen.","c":false}],"fdv":"Zwergsignale im Bereich von Weichen: steht das Zwergsignal zwischen dem Herzstück und dem Sicherheitszeichen einer einfachen Weiche, gilt es nur für einen Zweig. Bei Halt zeigendem Zwergsignal ist der Halteort vor diesem Zwergsignal.","note":"","optTags":{"A":[],"B":[],"C":[],"D":[]},"optNotes":{"A":"","B":"","C":"","D":""}},{"nr":258,"p":1,"term":"Weichensignale - Allgemeines (Ziff. 2.5.1)","approved":false,"q":"Wann zeigt ein Weichensignal gemäss FDV R 300.2, Ziff. 2.5.1 die «gerade Stellung»?","opts":[{"l":"A","t":"Wenn die Weiche nach dem geraden Zweig oder bei Krümmung beider Zweige (Bogenweiche) nach dem äusseren Strang gestellt ist.","c":true},{"l":"B","t":"Wenn die Weiche nach dem gekrümmten Zweig oder bei Krümmung beider Zweige (Bogenweiche) nach dem inneren Strang gestellt ist.","c":false},{"l":"C","t":"Wenn die Weiche nach dem geraden Zweig, jedoch bei einer Bogenweiche nach dem inneren Strang gestellt ist.","c":false},{"l":"D","t":"Ausschliesslich bei symmetrischen Weichen, nie bei einfachen Weichen.","c":false}],"fdv":"Weichensignale - Allgemeines: das Weichensignal zeigt die gerade Stellung, wenn die Weiche nach dem geraden Zweig oder bei Krümmung beider Zweige (Bogenweiche) nach dem äusseren Strang gestellt ist; die ablenkende Stellung, wenn die Weiche nach dem gekrümmten Zweig oder bei Krümmung beider Zweige (Bogenweiche) nach dem inneren Strang gestellt ist.","note":"","optTags":{"A":[],"B":[],"C":[],"D":[]},"optNotes":{"A":"","B":"","C":"","D":""}},{"nr":259,"p":2,"term":"Als Weichensignale verwendete Vorrichtungen (Ziff. 2.5.1)","approved":false,"multiSelect":true,"q":"Wähle gemäss FDV R 300.2, Ziff. 2.5.1 alle Vorrichtungen aus, die als Weichensignale verwendet werden (Mehrfachauswahl).","opts":[{"l":"A","t":"Drehbare Laternen für einfache Weichen und einfache Kreuzungsweichen.","c":true},{"l":"B","t":"Weichen-Lichtsignale für einfache Weichen und Kreuzungsweichen.","c":true},{"l":"C","t":"Feste Laternen mit beweglichen Blenden für Kreuzungsweichen.","c":true},{"l":"D","t":"Weichensignaltafeln.","c":true},{"l":"E","t":"Zwergsignale mit zusätzlicher Pfeilkennzeichnung.","c":false},{"l":"F","t":"Rote Haltsignal-Scheiben.","c":false}],"fdv":"Als Weichensignale werden verwendet: drehbare Laternen für einfache Weichen und einfache Kreuzungsweichen; Weichen-Lichtsignale für einfache Weichen und Kreuzungsweichen; feste Laternen mit beweglichen Blenden für Kreuzungsweichen; Weichensignaltafeln. Weichens enen Arms in senkrechtem Halbkreis in der Fahrrichtung. Es kann das Signal Sichtverbindung folgen.","note":"","optTags":{"A":[],"B":[],"C":[],"D":[]},"optNotes":{"A":"","B":"","C":"","D":""},"img":"images/image135.png","contentVersion":1},{"nr":291,"p":1,"term":"Anfahren rückwärts (Ziff. 3.3.4)","approved":false,"q":"Wie lautet der Begriff dieses Signals gemäss FDV R 300.2, Ziff. 3.3.4, und was bedeutet es?","opts":[{"l":"A","t":"Anfahren vorwärts - Vorwärts gegen ein Hindernis fahren.","c":false},{"l":"B","t":"Rückwärts - Rückwärts fahren.","c":false},{"l":"C","t":"Anfahren rückwärts - Rückwärts gegen ein Hindernis fahren.","c":true},{"l":"D","t":"Bewegen - Vorsichtiges Bewegen in Richtung des RL.","c":false}],"fdv":"Anfahren rückwärts - Begriff: Anfahren rückwärts. Bedeutung: Rückwärts gegen ein Hindernis fahren. Zwei lange Pfiffe und zweimaliges kreisförmiges Einwärtsbewegen der beiden erhobenen Arme quer zum Gleis. Die Signale Anfahren vorwärts und Anfahren rückwärts sind durch den Ruf anfahren zu ergänzen.","note":"","optTags":{"A":[],"B":[],"C":[],"D":[]},"optNotes":{"A":"","B":"","C":"","D":""},"img":"images/image137.png","contentVersion":1},{"nr":292,"p":1,"term":"Entfernungsangabe (Ziff. 3.3.6)","approved":false,"q":"Wie lautet der Begriff dieses Signals gemäss FDV R 300.2, Ziff. 3.3.6, und was bedeutet es?","opts":[{"l":"A","t":"Sichtverbindung - Optische Verbindungsüberwachung zwischen dem den Fahrweg beobachtenden RL und dem LF.","c":false},{"l":"B","t":"Entfernungsangabe - Angabe der Entfernung zwischen den anfahrenden Fahrzeugen und dem Hindernis.","c":true},{"l":"C","t":"Langsamer - Verlangsamen der Fahrt.","c":false},{"l":"D","t":"Halt - Anhalten.","c":false}],"fdv":"Entfernungsangaben - Bedeutung: Entfernungsangabe. Die Entfernung zwischen den anfahrenden Fahrzeugen und dem Hindernis ist mit «wagenlang – halbe – vier – zwo – einen» anzugeben. Einmaliges, bei der Angabe zwo zweimaliges Heben des ausgestreckten Arms auf Schulterhöhe quer zum Gleis. Es kann Halt folgen.","note":"","optTags":{"A":[],"B":[],"C":[],"D":[]},"optNotes":{"A":"","B":"","C":"","D":""},"img":"images/image139.png","contentVersion":1},{"nr":293,"p":1,"term":"Langsamer (Ziff. 3.3.8)","approved":false,"q":"Wie lautet der Begriff dieses Signals gemäss FDV R 300.2, Ziff. 3.3.8, und was bedeutet es?","opts":[{"l":"A","t":"Halt - Anhalten.","c":false},{"l":"B","t":"Entfernungsangabe - Angabe der Entfernung zwischen den anfahrenden Fahrzeugen und dem Hindernis.","c":false},{"l":"C","t":"Langsamer - Verlangsamen der Fahrt.","c":true},{"l":"D","t":"Vorwärts- oder Rückwärtsfahren über kurze Entfernung - Vorwärts bzw. rückwärts fahren.","c":false}],"fdv":"Langsamer fahren - Begriff: Langsamer. Bedeutung: Verlangsamen der Fahrt. Leichtes Auf- und Abwärtsbewegen des quer zum Gleis ausgestreckten Arms.","note":"","optTags":{"A":[],"B":[],"C":[],"D":[]},"optNotes":{"A":"","B":"","C":"","D":""},"img":"images/image142.png","contentVersion":1},{"nr":294,"p":1,"term":"Bewegen (Ziff. 3.3.10)","approved":false,"q":"Wie lautet der Begriff dieses Signals gemäss FDV R 300.2, Ziff. 3.3.10, und was bedeutet es?","opts":[{"l":"A","t":"Anfahren vorwärts - Vorwärts gegen ein Hindernis fahren.","c":false},{"l":"B","t":"Sichtverbindung - Optische Verbindungsüberwachung zwischen dem den Fahrweg beobachtenden RL und dem LF.","c":false},{"l":"C","t":"Entfernungsangabe - Angabe der Entfernung zwischen den anfahrenden Fahrzeugen und dem Hindernis.","c":false},{"l":"D","t":"Bewegen - Vorsichtiges Bewegen in Richtung des RL.","c":true}],"fdv":"Bewegen - Begriff: Bewegen. Bedeutung: Vorsichtiges Bewegen in Richtung des RL. Mündliche Verständigung und beide Arme in Schulterhöhe nach vorne heben, die flach ausgestreckten Hände wiederholt einander nähern. Ist die mündliche Verständigung wegen zu grosser Entfernung oder während dem Kuppeln/Entkuppeln nicht möglich, darf der Befehl zum Bewegen zusätzlich mit zwei kurzen Pfiffen erteilt werden.","note":"","optTags":{"A":[],"B":[],"C":[],"D":[]},"optNotes":{"A":"","B":"","C":"","D":""},"img":"images/image144.png","contentVersion":1},{"nr":295,"p":1,"term":"Vorwärts- oder Rückwärtsfahren über kurze Entfernung (Ziff. 3.3.11)","approved":false,"q":"Wie lautet der Begriff dieses Signals gemäss FDV R 300.2, Ziff. 3.3.11, und was bedeutet es?","opts":[{"l":"A","t":"Langsamer - Verlangsamen der Fahrt.","c":false},{"l":"B","t":"Sichtverbindung - Optische Verbindungsüberwachung zwischen dem den Fahrweg beobachtenden RL und dem LF.","c":false},{"l":"C","t":"Bewegen - Vorsichtiges Bewegen in Richtung des RL.","c":false},{"l":"D","t":"Vorwärts- oder Rückwärtsfahren über kurze Entfernung - Vorwärts bzw. rückwärts fahren.","c":true}],"fdv":"Vorwärts- oder Rückwärtsfahren über kurze Entfernung - Bedeutung: Vorwärts bzw. rückwärts fahren. Ein bzw. zwei lange Pfiffe und langsames Schwingen des schräg nach unten ausgestreckten Arms in der Fahrrichtung. Kurze Zeit nach dem Erteilen dieses Befehls folgt Halt.","note":"","optTags":{"A":[],"B":[],"C":[],"D":[]},"optNotes":{"A":"","B":"","C":"","D":""},"img":"images/image145.png","contentVersion":1},{"nr":296,"p":1,"term":"Rangierklingel und Rangierhupe (Ziff. 3.3.12)","approved":false,"q":"Was gilt gemäss FDV R 300.2, Ziff. 3.3.12, für die Zustimmung zu einer Rangierbewegung mittels Rangierklingel oder -hupe?","opts":[{"l":"A","t":"Bei einfachen Verhältnissen darf die Zustimmung mit dem Zeichen lang – kurz – lang erteilt werden.","c":true},{"l":"B","t":"Die Zustimmung darf damit nur bei Dunkelheit erteilt werden.","c":false},{"l":"C","t":"Die Zustimmung ist damit generell nicht zulässig, nur mit Handsignal.","c":false},{"l":"D","t":"Das Zeichen lautet kurz – lang – kurz.","c":false}],"fdv":"Rangierklingel und Rangierhupe - Bedeutung: Bei einfachen Verhältnissen darf die Zustimmung an eine Rangierbewegung mit der Rangierklingel oder -hupe mit dem Zeichen (lang – kurz – lang) erteilt werden.","note":"","optTags":{"A":[],"B":[],"C":[],"D":[]},"optNotes":{"A":"","B":"","C ,"img":"images/image154.png","contentVersion":1},{"nr":304,"p":1,"term":"Bremsen - Personalsignal bei Nacht (Ziff. 4.1.2)","approved":false,"q":"Wie lautet der Begriff dieses Signals gemäss FDV R 300.2, Ziff. 4.1.2, und was bedeutet es?","opts":[{"l":"A","t":"Lösen - Auftrag zum Lösen.","c":false},{"l":"B","t":"Bremsen - Auftrag zum Bremsen.","c":true},{"l":"C","t":"Bereit - Die Bereitschaft ist vorhanden.","c":false},{"l":"D","t":"Bremse gut - Die Bremsen sind gut.","c":false}],"fdv":"Signale des Personals für die Bremsprobe - Begriff: Bremsen. Bedeutung: Auftrag zum Bremsen. Bei Nacht: drei kurze Pfiffe und das weisse Licht in einer Halbkreisbewegung langsam heben und anschliessend schnell senkrecht absenken.","note":"","optTags":{"A":[],"B":[],"C":[],"D":[]},"optNotes":{"A":"","B":"","C":"","D":""},"img":"images/image155.png","contentVersion":1},{"nr":305,"p":1,"term":"Lösen - Personalsignal (Ziff. 4.1.2)","approved":false,"q":"Wie lautet der Begriff dieses Signals gemäss FDV R 300.2, Ziff. 4.1.2, und was bedeutet es?","opts":[{"l":"A","t":"Bremsen - Auftrag zum Bremsen.","c":false},{"l":"B","t":"Bremse gut - Die Bremsen sind gut.","c":false},{"l":"C","t":"Lösen - Auftrag zum Lösen.","c":true},{"l":"D","t":"Bereit - Die Bereitschaft ist vorhanden.","c":false}],"fdv":"Signale des Personals für die Bremsprobe - Begriff: Lösen (Bremse lösen). Bedeutung: Auftrag zum Lösen. Zwei kurze Pfiffe und Schwingen des hocherhobenen Arms quer zum Zug.","note":"","optTags":{"A":[],"B":[],"C":[],"D":[]},"optNotes":{"A":"","B":"","C":"","D":""},"img":"images/image156.png","contentVersion":1},{"nr":306,"p":1,"term":"Bremse gut - Personalsignal (Ziff. 4.1.2)","approved":false,"q":"Wie lautet der Begriff dieses Signals gemäss FDV R 300.2, Ziff. 4.1.2, und was bedeutet es?","opts":[{"l":"A","t":"Bereit - Die Bereitschaft ist vorhanden.","c":false},{"l":"B","t":"Lösen - Auftrag zum Lösen.","c":false},{"l":"C","t":"Bremsen - Auftrag zum Bremsen.","c":false},{"l":"D","t":"Bremse gut - Die Bremsen sind gut.","c":true}],"fdv":"Signale des Personals für die Bremsprobe - Begriff: Bremse gut. Bedeutung: Die Bremsen sind gut. Hochhalten der offenen Handfläche gegen den LF. Das Signal des Personals Bremse gut ist durch den LF mit demselben Signal zu quittieren.","note":"","optTags":{"A":[],"B":[],"C":[],"D":[]},"optNotes":{"A":"","B":"","C":"","D":""},"img":"images/image157.png","contentVersion":1},{"nr":307,"p":1,"term":"Bereit (Ziff. 4.2)","approved":false,"q":"Wie lautet der Begriff dieses Signals gemäss FDV R 300.2, Ziff. 4.2, und was bedeutet es?","opts":[{"l":"A","t":"Bremse gut - Die Bremsen sind gut.","c":false},{"l":"B","t":"Bremsen - Auftrag zum Bremsen.","c":false},{"l":"C","t":"Lösen - Auftrag zum Lösen.","c":false},{"l":"D","t":"Bereit - Die Bereitschaft ist vorhanden.","c":true}],"fdv":"Bereitschaft - Begriff: Bereit. Bedeutung: Die Bereitschaft ist vorhanden. Hochhalten des Arms bzw. nachts eines weissen Lichts gegen die Person, welche die Abfahrerlaubnis gibt.","note":"","optTags":{"A":[],"B":[],"C":[],"D":[]},"optNotes":{"A":"","B":"","C":"","D":""},"img":"images/image158.png","contentVersion":1},{"nr":308,"p":1,"term":"Signale des Personals für die Bremsprobe - Allgemeines (Ziff. 4.1.2)","approved":false,"q":"Wann sind die Signale des Personals für die Bremsprobe gemäss FDV R 300.2, Ziff. 4.1.2, mit der Mundpfeife zu geben und durch Armbewegungen bzw. nachts mit einem weissen Licht zu ergänzen?","opts":[{"l":"A","t":"Immer, unabhängig von anderen Übermittlungsarten.","c":false},{"l":"B","t":"Sofern die Befehle und Meldungen für die Bremsprobe dem LF nicht mündlich, fernmündlich oder mit ortsfesten Signalen übermittelt werden können.","c":true},{"l":"C","t":"Nur bei Dunkelheit.","c":false},{"l":"D","t":"Nur wenn keine ortsfesten Signale vorhanden sind, unabhängig von mündlicher oder fernmündlicher Übermittlung.","c":false}],"fdv":"Signale des Personals für die Bremsprobe - Sofern die Befehle und Meldungen für die Bremsprobe dem LF nicht mündlich, fernmündlich oder mit ortsfesten Signalen übermittelt werden können, sind sie mit der Mundpfeife zu geben und durch Armbewegungen bzw. nachts, wo nichts anders erwähnt ist, mit einem weissen Licht zu ergänzen.","note":"","optTags":{"A":[],"B":[],"C":[],"D":[]},"optNotes":{"A":"","B":"","C":"","D":""},"contentVersion":1},{"nr":309,"p":1,"term":"Hauptsignal und Vorsignal - Grundsatz (Ziff. 5.1.1)","approved":false,"q":"Was zeigt ein Hauptsignal bzw. ein Vorsignal gemäss FDV R 300.2, Ziff. 5.1.1, in der Grundstellung?","opts":[{"l":"A","t":"Hauptsignal: Halt. Vorsignal: Warnung.","c":true},{"l":"B","t":"Hauptsignal: Warnung. Vorsignal: Halt.","c":false},{"l":"C","t":"Beide zeigen in der Grundstellung Halt.","c":false},{"l":"D","t":"Beide zeigen in der Grundstellung Warnung.","c":false}],"fdv":"Grundsatz - Ein Hauptsignal kann grundsätzlich alle Signalbilder signalisieren und zeigt in der Grundstellung Halt. Ein Vorsignal hingegen kann Halt nicht signalisieren und zeigt in der Grundstellung Warnung.","note":"","optTags":{"A":[],"B":[],"C":[],"D":[]},"optNotes":{"A":"","B":"","C":"","D":""},"contentVersion":1},{"nr":310,"p":1,"term":"Signalsystem L und N (Ziff. 5.1.2/5.1.3)","approved":false,"q":"Wie wird die Ankündigung bzw. Ausführung einer Geschwindigkeit bei den Signalsystemen L und N gemäss FDV R 300.2 signalisiert?","opts":[{"l":"A","t":"System L: mit farbigen Lichtpunktkombinationen. System N: mit einem Lichtpunkt und einer Zahl.","c":true},{"l":"B","t":"System L: mit einem Lichtpunkt und einer Zahl. System N: mit farbigen Lichtpunktkombinationen.","c":false},{"l":"C","t":"Beide Systeme signalisieren ausschliesslich mit Zahlen.","c":false},{"l":"D","t":"Beide Systeme signalisieren ausschliesslich mit farbigen Lichtpunktkombinationen.","c":false}],"fdv":"Signalsystem L - Ankündigung und Ausführung einer Geschwindigkeit werden mit farbigen Lichtpunktkombinationen signalisiert. Signalsystem N - Ankündigung und Ausführung einer Geschwindigkeit werden mit einem Lichtpunkt und mit einer Zahl signalisiert.","note":"","optTags":{"A":[],"B":[],"C":[],"D":[]},"optNotes":{"A":"","B":"","C":"","D":""},"contentVersion":1},{"nr":311,"p":1,"term":"Mini-Hauptsignale (Ziff. 5.1.5)","approved":false,"q":"Wo werden Mini-Hauptsignale gemäss FDV R 300.2, Ziff. 5.1.5, verwendet und was können sie zeigen?","opts":[{"l":"A","t":"In Güter-, Rangier- und Unterhaltsanlagen bis höchstens 40 km/h; sie können Halt oder Warnung zeigen.","c":true},{"l":"B","t":"Nur auf freier Strecke bei Höchstgeschwindigkeiten über 160 km/h; sie können alle Fahrbegriffe zeigen.","c":false},{"l":"C","t":"In Güter-, Rangier- und Unterhaltsanlagen; sie können nur Freie Fahrt zeigen.","c":false},{"l":"D","t":"Ausschliesslich im Trambetrieb; sie können Halt oder Freie Fahrt zeigen.","c":false}],"fdv":"Mini-Hauptsignale - Mini-Hauptsignale werden in Güter-, Rangier- und Unterhaltsanlagen, welche höchstens mit einer Geschwindigkeit von 40 km/h befahren werden, verwendet. Das Mini-Hauptsignal befindet sich in Bodennähe und gilt nur für ein Gleis. Das Mini-Hauptsignal ist mit zwei senkrecht übereinander angeordneten Signallinsen ausgerüstet und kann Halt oder Warnung zeigen.","note":"","optTags":{"A":[],"B":[],"C":[],"D":[]},"optNotes":{"A":"","B":"","C":"","D":""},"contentVersion":1},{"nr":312,"p":1,"term":"Vor- und Hauptsignal System L am gleichen Standort (Ziff. 5.1.6)","approved":false,"q":"Was gilt gemäss FDV R 300.2, Ziff. 5.1.6, für das Vorsignal am Standort eines Hauptsignals, solange dieses Halt zeigt?","opts":[{"l":"A","t":"Das Vorsignal zeigt Warnung oder dessen Lichter sind gelöscht.","c":true},{"l":"B","t":"Das Vorsignal zeigt zwingend Freie Fahrt.","c":false},{"l":"C","t":"Das Vorsignal zeigt immer dasselbe Bild wie das Hauptsignal.","c":false},{"l":"D","t":"Das Vorsignal ist in diesem Fall ausser Betrieb zu setzen.","c":false}],"fdv":"Vor- und Hauptsignal System L am gleichen Standort - Das Vorsignal am Standort eines Hauptsignals bezieht sich immer auf das nächste Signal. Das Vorsignal zeigt Warnung oder dessen Lichter sind gelöscht, solange das am gleichen Standort befindliche Hauptsignal Halt zeigt. Die Lichter des Vorsignals sind gelöscht, wenn das am gleichen Träger befindliche Hauptsignal Kurze Fahrt zeigt.","note":"","optTags":{"A":[],"B":[],"C":[],"D":[]},"optNotes":{"A":"","B":"","C":"","D":""},"contentVersion":1},{"nr":313,"p":1,"term":"Kennzeichnung der Signale (Ziff. 5.1.7)","approved":false,"q":"Wie werden Haupt- und Vorsignale gemäss FDV R 300.2, Ziff. 5.1.7, bezeichnet?","opts":[{"l":"A","t":"Hauptsignal: mit einem Buchstaben, allenfalls ergänzt mit einer Zahl. Vorsignal: Bezeichnung des nachfolgenden Hauptsignals mit hochgestelltem Stern, Wiederholungssignale mit zwei bzw. drei Sternen.","c":true},{"l":"B","t":"Hauptsignal und Vorsignal tragen beide dieselbe fortlaufende Nummer ohne Buchstaben.","c":false},{"l":"C","t":"Hauptsignal: mit einer Zahl. Vorsignal: mit einem Buchstaben.","c":false},{"l":"D","t":"Nur Hauptsignale werden bezeichnet, Vorsignale bleiben unbezeichnet.","c":false}],"fdv":"Kennzeichnung der Signale - Das Hauptsignal ist mit einem Buchstaben bezeichnet. Diesem ist allenfalls eine der Gleiszugehörigkeit entsprechende Zahl nachgestellt. Das Vorsignal trägt die Bezeichnung des nachfolgenden Hauptsignals, ergänzt mit einem hochgestellten Stern, Wiederholungssignale mit zwei bzw. drei Sternen.","note":"","optTags":{"A":[],"B":[],"C":[],"D":[]},"optNotes":{"A":"","B":"","C":"","D":""},"contentVersion":1},{"nr":314,"p":1,"term":"Grundsätzliche Beziehung der Zugsignale zueinander (Ziff. 5.2.1)","approved":false,"q":"Wann darf das nächste Zugsignal gemäss FDV R 300.2, Ziff. 5.2.1, einen tieferen auszuführenden Begriff zeigen?","opts":[{"l":"A","t":"Nur wenn vorgängig eine entsprechende, tiefere Ankündigung signalisiert wurde.","c":true},{"l":"B","t":"Jederzeit, unabhängig von einer vorgängigen Ankündigung.","c":false},{"l":"C","t":"Nur nachts, bei Tag ist dies nicht zulässig.","c":false},{"l":"D","t":"Nur bei Signalsystem N, bei System L ist dies nicht zulässig.","c":false}],"fdv":"Grundsätzliche Beziehung der Zugsignale zueinander - Das nächste Signal zeigt nur einen tieferen auszuführenden Begriff, wenn vorgängig eine entsprechende, tiefere Ankündigung signalisiert wurde. Das nächste Signal kann einen höheren Begriff zeigen, ohne dass dies vorgängig signalisiert wird.","note":"","optTags":{"A":[],"B":[],"C":[],"D":[]},"optNotes":{"A":"","B":"","C":"","D":""},"contentVersion":1},{"nr":315,"p":1,"term":"Warnung - Signalsystem L (Ziff. 5.2.2)","approved":false,"q":"Wie lautet der Begriff dieses Signals gemäss FDV R 300.2, Ziff. 5.2.2, und was bedeutet es?","opts":[{"l":"A","t":"Warnung - Verminderung der Geschwindigkeit, dass vor dem nächsten Halt zeigenden Signal angehalten werden kann.","c":true},{"l":"B","t":"Vorwarnung - Verminderung der Geschwindigkeit, dass vor dem übernächsten Signal angehalten werden kann.","c":false},{"l":"C","t":"Halt - Halt vor dem Signal.","c":false},{"l":"D","t":"Kurze Fahrt - Ab diesem Signal gilt die Höchstgeschwindigkeit 40 km/h.","c":false}],"fdv":"Warnung und Vorwarnung - Begriff: Warnung (Signalsystem L). Bedeutung: Verminderung der Geschwindigkeit, dass vor dem nächsten Halt zeigenden Signal angehalten werden kann.","note":"","optTags":{"A":[],"B":[],"C":[],"D":[]},"optNotes":{"A":"","B":"","C":"","D":""},"img":"images/image168.png","contentVersion":1},{"nr":316,"p":1,"term":"Warnung - Signalsystem N (Ziff. 5.2.2)","approved":false,"q":"Wie lautet der Begriff dieses Signals gemäss FDV R 300.2, Ziff. 5.2.2, und was bedeutet es?","opts":[{"l":"A","t":"Halt - Halt vor dem Signal.","c":false},{"l":"B","t":"Vorwarnung - Verminderung der Geschwindigkeit, dass vor dem übernächsten Signal angehalten werden kann.","c":false},{"l":"C","t":"Warnung - Verminderung der Geschwindigkeit, dass vor dem nächsten Halt zeigenden Signal angehalten werden kann.","c":true},{"l":"D","t":"Freie Fahrt - Fahrt mit der in der Streckentabelle an te Lichter (Dauerlicht) nach Bild 587; bei Güterzügen zwei rot-weisse reflektierende Scheiben nach Bild 588 oder zwei rote Lichter (Dauerlicht) nach Bild 587.","note":"","optTags":{"A":[],"B":[],"C":[],"D":[]},"optNotes":{"A":"","B":"","C":"","D":""},"img":"images/image220.png","contentVersion":1},{"nr":365,"p":1,"term":"Abfahrsignale - Grundsatz (Ziff. 5.6)","approved":false,"q":"Wann darf das Signal für Abfahrerlaubnis gemäss FDV R 300.2, Ziff. 5.6, erteilt werden?","opts":[{"l":"A","t":"Nur wenn die Zustimmung zur Ausfahrt vorliegt.","c":true},{"l":"B","t":"Sobald die Reisenden eingestiegen sind, unabhängig von der Zustimmung zur Ausfahrt.","c":false},{"l":"C","t":"Erst nachdem das Zugschlusssignal kontrolliert wurde, unabhängig von der Zustimmung zur Ausfahrt.","c":false},{"l":"D","t":"Nur bei Tag; bei Nacht ist kein Signal für Abfahrerlaubnis zulässig.","c":false}],"fdv":"Abfahrsignale - Das Signal für Abfahrerlaubnis darf nur erteilt werden, wenn die Zustimmung zur Ausfahrt vorliegt.","note":"","optTags":{"A":[],"B":[],"C":[],"D":[]},"optNotes":{"A":"","B":"","C":"","D":""},"contentVersion":1},{"nr":366,"p":1,"term":"Kennzeichnung indirekt geführter Züge (Ziff. 5.7.3)","approved":false,"q":"Was gilt gemäss FDV R 300.2, Ziff. 5.7.3, für die Kennzeichnung indirekt geführter Züge?","opts":[{"l":"A","t":"Fahrzeuge an der Zugspitze zeigen in der Fahrrichtung vorn ein weisses Licht. Ausserhalb von Tunnels darf bei Tag auf die Signalisierung der Zugspitze verzichtet werden.","c":true},{"l":"B","t":"Fahrzeuge an der Zugspitze zeigen immer drei weisse Lichter, auch ausserhalb von Tunnels bei Tag.","c":false},{"l":"C","t":"Indirekt geführte Züge müssen zwingend das Zugschlusssignal an der Spitze zeigen.","c":false},{"l":"D","t":"Bei indirekt geführten Zügen ist jegliche Spitzensignalisierung untersagt.","c":false}],"fdv":"Kennzeichnung indirekt geführter Züge - Fahrzeuge an der Zugspitze zeigen in der Fahrrichtung vorn ein weisses Licht. Ausserhalb von Tunnels darf bei Tag auf die Signalisierung der Zugspitze verzichtet werden.","note":"","optTags":{"A":[],"B":[],"C":[],"D":[]},"optNotes":{"A":"","B":"","C":"","D":""},"contentVersion":1},{"nr":367,"p":1,"term":"Kennzeichnung nicht gekuppelter Schiebelok (Ziff. 5.7.4)","approved":false,"q":"Was zeigt eine nicht gekuppelte Schiebelok gemäss FDV R 300.2, Ziff. 5.7.4, beim Schieben auf die Strecke sowie bei der Rückfahrt in den rückliegenden Bahnhof?","opts":[{"l":"A","t":"Vorne drei weisse Lichter, hinten ein weisses Licht. Das letzte gekuppelte Fahrzeug zeigt das Zugschlusssignal.","c":true},{"l":"B","t":"Vorne das Zugschlusssignal, hinten drei weisse Lichter.","c":false},{"l":"C","t":"Nur hinten zwei rote Lichter, vorne dunkel.","c":false},{"l":"D","t":"Vorne und hinten je ein grünes Licht.","c":false}],"fdv":"Kennzeichnung nicht gekuppelter Schiebelok - Die nicht gekuppelte Schiebelok zeigt beim Schieben auf die Strecke sowie bei der Rückfahrt in den rückliegenden Bahnhof vorne drei weisse Lichter, hinten ein weisses Licht. Das letzte gekuppelte Fahrzeug zeigt das Zugschlusssignal.","note":"","optTags":{"A":[],"B":[],"C":[],"D":[]},"optNotes":{"A":"","B":"","C":"","D":""},"contentVersion":1},{"nr":368,"p":1,"term":"Fahrleitungsabschnitt ausgeschaltet und geerdet - Bei Tag (Ziff. 7.1.1)","approved":false,"q":"Wie lautet der Begriff dieses Signals gemäss FDV R 300.2, Ziff. 7.1.1, und was bedeutet es?","opts":[{"l":"A","t":"Senksignal - Halt für Fahrzeuge mit gehobenem Stromabnehmer.","c":false},{"l":"B","t":"Fahrleitungsabschnitt ausgeschaltet und geerdet - Halt für Fahrzeuge mit gehobenem Stromabnehmer vor dem betreffenden Fahrleitungsabschnitt.","c":true},{"l":"C","t":"Streckentrennung - Halt für Fahrzeuge mit gehobenem Stromabnehmer bei ausgeschalteter Streckenfahrleitung.","c":false},{"l":"D","t":"Ausschaltsignal - Vorbeifahrt mit ausgeschaltetem Hauptschalter.","c":false}],"fdv":"7.1.1 Kennzeichnung der Erdungsvorrichtungen - Bei Tag - Begriff: Fahrleitungsabschnitt ausgeschaltet und geerdet. Bedeutung: Halt für Fahrzeuge mit gehobenem Stromabnehmer vor dem betreffenden Fahrleitungsabschnitt. Sofern die Erdungsvorrichtung innerhalb des Lichtraumprofils aufgehängt ist, gilt die rote Flagge bzw. das rote Licht für alle Fahrten als Haltsignal.","note":"","optTags":{"A":[],"B":[],"C":[],"D":[]},"optNotes":{"A":"","B":"","C":"","D":""},"img":"images/image222.png","contentVersion":1},{"nr":369,"p":1,"term":"Fahrleitungsabschnitt ausgeschaltet und geerdet - Bei Nacht (Ziff. 7.1.1)","approved":false,"q":"Wie lautet der Begriff dieses Signals gemäss FDV R 300.2, Ziff. 7.1.1, und was bedeutet es?","opts":[{"l":"A","t":"Senksignal - Halt für Fahrzeuge mit gehobenem Stromabnehmer.","c":false},{"l":"B","t":"Fahrleitungsabschnitt ausgeschaltet und geerdet - Halt für Fahrzeuge mit gehobenem Stromabnehmer vor dem betreffenden Fahrleitungsabschnitt.","c":true},{"l":"C","t":"Zugschlusssignal - Zwei rote Lichter.","c":false},{"l":"D","t":"Ausschaltsignal - Vorbeifahrt mit ausgeschaltetem Hauptschalter.","c":false}],"fdv":"7.1.1 Kennzeichnung der Erdungsvorrichtungen - Bei Nacht - Begriff: Fahrleitungsabschnitt ausgeschaltet und geerdet. Bedeutung: Halt für Fahrzeuge mit gehobenem Stromabnehmer vor dem betreffenden Fahrleitungsabschnitt. Sofern die Erdungsvorrichtung innerhalb des Lichtraumprofils aufgehängt ist, gilt die rote Flagge bzw. das rote Licht für alle Fahrten als Haltsignal.","note":"","optTags":{"A":[],"B":[],"C":[],"D":[]},"optNotes":{"A":"","B":"","C":"","D":""},"img":"images/image223.png","contentVersion":1},{"nr":370,"p":1,"term":"Vorsignal zum Senksignal (Ziff. 7.1.2)","approved":false,"q":"Wie lautet der Begriff dieses Signals gemäss FDV R 300.2, Ziff. 7.1.2, und was bedeutet es?","opts":[{"l":"A","t":"Vorsignal zum Senksignal - Die Stromabnehmer müssen ab dem Senksignal gesenkt sein.","c":true},{"l":"B","t":"Senksignal - Halt für Fahrzeuge mit gehobenem Stromabnehmer.","c":false},{"l":"C","t":"Vorsignal zum Ausschaltsignal - Vorbereitung zum Ausschalten.","c":false},{"l":"D","t":"Vorsignal zum Umschaltsignal - Es folgt eine Schutzstrecke mit Spannungswechsel.","c":false}],"fdv":"7.1.2 Stromabnehmersignale - Begriff: Vorsignal zum Senksignal. Bedeutung: Die Stromabnehmer müssen ab dem Senksignal gesenkt sein. Beziehung zu anderen Signalen: Es folgt ein Senksignal. Es kann ein Aufhebungssignal folgen.","note":"","optTags":{"A":[],"B":[],"C":[],"D":[]},"optNotes":{"A":"","B":"","C":"","D":""},"img":"images/image224.png","contentVersion":1},{"nr":371,"p":1,"term":"Senksignal (Ziff. 7.1.2)","approved":false,"q":"Wie lautet der Begriff dieses Signals gemäss FDV R 300.2, Ziff. 7.1.2, und was bedeutet es?","opts":[{"l":"A","t":"Endsignal zum Senksignal - Erlaubnis zum Heben der Stromabnehmer.","c":false},{"l":"B","t":"Vorsignal zum Senksignal - Die Stromabnehmer müssen ab dem Senksignal gesenkt sein.","c":false},{"l":"C","t":"Senksignal - Halt für Fahrzeuge mit gehobenem Stromabnehmer.","c":true},{"l":"D","t":"Aufhebungssignal zum Senksignal - Ab dieser Stelle wird der mit gesenktem Stromabnehmer zu befahrende Abschnitt nicht befahren.","c":false}],"fdv":"7.1.2 Stromabnehmersignale - Begriff: Senksignal. Bedeutung: Halt für Fahrzeuge mit gehobenem Stromabnehmer. Beziehung zu anderen Signalen: Dem Senksignal kann ein Vorsignal vorausgehen und es kann ein Endsignal folgen. Das Senksignal kann in Bahnhof- und Anschlussgleisanlagen auch allein verwendet werden: ortsfest, ortsveränderlich, drehbar an Mast oder auf Weichenlaterne. Das Senksignal kann auch als Lichtsignal mit aufgesetztem weissen Dreieck verwendet werden.","note":"","optTags":{"A":[],"B":[],"C":[],"D":[]},"optNotes":{"A":"","B":"","C":"","D":""},"img":"images/image225.png","contentVersion":1},{"nr":372,"p":1,"term":"Endsignal zum Senksignal (Ziff. 7.1.2)","approved":false,"q":"Wie lautet der Begriff dieses Signals gemäss FDV R 300.2, Ziff. 7.1.2, und was bedeutet es?","opts":[{"l":"A","t":"Endsignal zum Senksignal - Erlaubnis zum Heben der Stromabnehmer.","c":true},{"l":"B","t":"Senksignal - Halt für Fahrzeuge mit gehobenem Stromabnehmer.","c":false},{"l":"C","t":"Endsignal zur Systemschutzstrecke - Weiterfahrt mit dem betreffenden Stromsystem.","c":false},{"l":"D","t":"Einschaltsignal - Weiterfahrt mit eingeschaltetem Hauptschalter.","c":false}],"fdv":"7.1.2 Stromabnehmersignale - Begriff: Endsignal zum Senksignal. Bedeutung: Erlaubnis zum Heben der Stromabnehmer. Beziehung zu anderen Signalen: Es geht ein Senksignal voraus.","note":"","optTags":{"A":[],"B":[],"C":[],"D":[]},"optNotes":{"A":"","B":"","C":"","D":""},"img":"images/image226.png","contentVersion":1},{"nr":373,"p":1,"term":"Aufhebungssignal zum Senksignal (Ziff. 7.1.2)","approved":false,"q":"Wie lautet der Begriff dieses Signals gemäss FDV R 300.2, Ziff. 7.1.2, und was bedeutet es?","opts":[{"l":"A","t":"Endsignal zum Senksignal - Erlaubnis zum Heben der Stromabnehmer.","c":false},{"l":"B","t":"Senksignal - Halt für Fahrzeuge mit gehobenem Stromabnehmer.","c":false},{"l":"C","t":"Vorsignal zum Senksignal - Die Stromabnehmer müssen ab dem Senksignal gesenkt sein.","c":false},{"l":"D","t":"Aufhebungssignal zum Senksignal - Ab dieser Stelle wird der mit gesenktem Stromabnehmer zu befahrende Abschnitt nicht befahren.","c":true}],"fdv":"7.1.2 Stromabnehmersignale - Begriff: Aufhebungssignal zum Senksignal. Bedeutung: Ab dieser Stelle wird der mit gesenktem Stromabnehmer zu befahrende Abschnitt nicht befahren. Beziehung zu anderen Signalen: Es geht ein Vorsignal voraus.","note":"","optTags":{"A":[],"B":[],"C":[],"D":[]},"optNotes":{"A":"","B":"","C":"","D":""},"img":"images/image227.png","contentVersion":1},{"nr":374,"p":1,"term":"Vorsignal zum Ausschaltsignal (Ziff. 7.1.3)","approved":false,"q":"Wie lautet der Begriff dieses Signals gemäss FDV R 300.2, Ziff. 7.1.3, und was bedeutet es?","opts":[{"l":"A","t":"Vorsignal zum Ausschaltsignal - Vorbereitung zum Ausschalten.","c":true},{"l":"B","t":"Ausschaltsignal - Vorbeifahrt mit ausgeschaltetem Hauptsch
