const STORAGE_KEY = "fdv_r300_korrekturen_v1";

// Supabase-Anbindung: gemeinsamer Speicher statt lokalem window.storage,
// damit Korrekturen geraeteuebergreifend und ohne Export/Import synchron bleiben.
const SUPABASE_URL = "https://vvahjifduqicgiobiyxq.supabase.co";
const SUPABASE_KEY = "sb_publishable_WOoNJ3rc-kKemZp2cYSz4g_hMgkZgWh";
const SUPABASE_HEADERS = {
  "apikey": SUPABASE_KEY,
  "Authorization": "Bearer " + SUPABASE_KEY,
  "Content-Type": "application/json",
};

// Laedt alle gespeicherten Zeilen aus Supabase und baut daraus dasselbe
// "corrections"-Objekt (keyed by nr), das buildCorrections/mergeCorrections erwarten.
async function loadCorrectionsFromSupabase() {
  let res = await fetch(
    SUPABASE_URL + "/rest/v1/question_review?select=nr,approved,p,note,opt_tags,opt_notes,content_version",
    { headers: SUPABASE_HEADERS }
  );
  if (!res.ok) {
    // Fallback falls die Spalte content_version in der DB noch nicht existiert (Migration nicht ausgefuehrt)
    res = await fetch(
      SUPABASE_URL + "/rest/v1/question_review?select=nr,approved,p,note,opt_tags,opt_notes",
      { headers: SUPABASE_HEADERS }
    );
    if (!res.ok) throw new Error("Supabase Ladefehler: " + res.status);
  }
  const rows = await res.json();
  const out = {};
  rows.forEach(r => {
    out[r.nr] = {
      approved: r.approved,
      p: r.p,
      note: r.note,
      optTags: r.opt_tags,
      optNotes: r.opt_notes,
      contentVersion: r.content_version || 1,
    };
  });
  return out;
}

// Speichert die uebergebenen Korrekturen als Upsert (ein Request pro Frage-Batch).
// Gibt bei Fehlern die genaue Serverantwort zurueck, damit sie in der App sichtbar gemacht werden kann.
async function saveCorrectionsToSupabase(corrections) {
  const rows = Object.keys(corrections).map(nr => ({
    nr: parseInt(nr, 10),
    approved: corrections[nr].approved,
    p: corrections[nr].p,
    note: corrections[nr].note,
    opt_tags: corrections[nr].optTags,
    opt_notes: corrections[nr].optNotes,
    content_version: corrections[nr].contentVersion || 1,
  }));
  if (rows.length === 0) return { ok: true };
  let res = await fetch(SUPABASE_URL + "/rest/v1/question_review", {
    method: "POST",
    headers: { "apikey": SUPABASE_KEY, "Content-Type": "application/json", "Prefer": "resolution=merge-duplicates" },
    body: JSON.stringify(rows),
  });
  if (!res.ok) {
    // Fallback ohne content_version, falls die Spalte in der DB noch nicht existiert
    const rowsWithoutVersion = rows.map(r => { const { content_version, ...rest } = r; return rest; });
    res = await fetch(SUPABASE_URL + "/rest/v1/question_review", {
      method: "POST",
      headers: { "apikey": SUPABASE_KEY, "Content-Type": "application/json", "Prefer": "resolution=merge-duplicates" },
      body: JSON.stringify(rowsWithoutVersion),
    });
  }
  if (res.ok) return { ok: true };
  let detail = "";
  try { detail = await res.text(); } catch (e) {}
  return { ok: false, status: res.status, detail };
}

// Nur die tatsaechlichen Aenderungen pro Frage sichern (nicht den ganzen Fragenkatalog).
// So bleiben die eigenen Korrekturen auch erhalten, wenn sich INITIAL_QS spaeter aendert
// (z.B. weil eine neue Version der Datei mit anderen/weiteren Fragen erstellt wird).
function buildCorrections(qs, minNr, maxNr) {
  const out = {};
  qs.forEach(q => {
    if (minNr != null && (q.nr < minNr || q.nr > maxNr)) return;
    const touched =
      q.approved ||
      q.p !== 1 ||
      q.note.trim() !== "" ||
      Object.values(q.optTags).some(a => a.length > 0) ||
      Object.values(q.optNotes || {}).some(n => n.trim() !== "");
    if (touched) {
      out[q.nr] = {
        approved: q.approved,
        p: q.p,
        note: q.note,
        optTags: q.optTags,
        optNotes: q.optNotes,
        contentVersion: q.contentVersion || 1,
      };
    }
  });
  return out;
}

// Wenn eine Frage im Code eine hoehere contentVersion hat als der in der DB gespeicherte
// Stand, wurde ihr Text seither inhaltlich korrigiert - die alten Tags/Freigaben aus der
// DB sind dann ungueltig geworden und werden NICHT uebernommen (Frage bleibt "frisch").
// Gibt zusaetzlich zurueck, welche Fragen deswegen neu in die DB geschrieben werden muessen.
function mergeCorrections(baseQs, corrections) {
  const toResync = [];
  if (!corrections) return { merged: baseQs, toResync };
  const merged = baseQs.map(q => {
    const c = corrections[q.nr];
    const codeVersion = q.contentVersion || 1;
    if (!c) return q;
    const dbVersion = c.contentVersion || 1;
    if (dbVersion < codeVersion) {
      toResync.push(q.nr);
      return q; // Code-Stand behalten, DB-Korrektur verwerfen
    }
    return { ...q, ...c };
  });
  return { merged, toResync };
}

ar ist.","note":"","optTags":{"A":[],"B":[],"C":[],"D":[]},"optNotes":{"A":"","B":"","C":"","D":""}},{"nr":176,"p":1,"term":"Fahrdienstliche Tätigkeiten","approved":false,"q":"Was umfassen die «fahrdienstlichen Tätigkeiten» gemäss FDV R 300.1, Ziff. 2.5.2?","opts":[{"l":"A","t":"Ausschliesslich die Tätigkeiten des Lokführers während der Zugfahrt.","c":false},{"l":"B","t":"Die in den Schweizerischen Fahrdienstvorschriften geregelten Aufgaben und Funktionen.","c":true},{"l":"C","t":"Ausschliesslich die Tätigkeiten des Fahrdienstleiters im Stellwerk.","c":false},{"l":"D","t":"Alle Tätigkeiten im Gleisbereich, einschliesslich baulicher Arbeiten.","c":false}],"fdv":"Fahrdienstliche Tätigkeiten: die fahrdienstlichen Tätigkeiten umfassen die in den Schweizerischen Fahrdienstvorschriften geregelten Aufgaben und Funktionen.","note":"","optTags":{"A":[],"B":[],"C":[],"D":[]},"optNotes":{"A":"","B":"","C":"","D":""}},{"nr":177,"p":1,"term":"Gefahrgutwagen","approved":false,"q":"Was ist ein «Gefahrgutwagen» gemäss FDV R 300.1, Ziff. 2.5.2?","opts":[{"l":"A","t":"Ein Wagen mit Grosszettel (Placards) nach Muster 1 bis 9 gemäss RID.","c":true},{"l":"B","t":"Jeder Wagen, der ausschliesslich für den Gütertransport bestimmt ist.","c":false},{"l":"C","t":"Ein Wagen mit Grosszettel (Placards) nach Muster 1 bis 9, jedoch ausschliesslich für flüssige Stoffe.","c":false},{"l":"D","t":"Ein Wagen ohne normale Zug- und Stossvorrichtung, der Gefahrgüter transportiert.","c":false}],"fdv":"Gefahrgutwagen: ein Wagen mit Grosszettel (Placards) nach Muster 1 bis 9 gemäss RID.","note":"","optTags":{"A":[],"B":[],"C":[],"D":[]},"optNotes":{"A":"","B":"","C":"","D":""}},{"nr":178,"p":1,"term":"Gehweg","approved":false,"q":"Was ist ein «Gehweg» gemäss FDV R 300.1, Ziff. 2.5.2?","opts":[{"l":"A","t":"Ein Weg im Gleisbereich ausserhalb von Tunnel, der durch Personal zum Aufenthalt oder Arbeiten genutzt werden darf. Er ist auf Grund seiner Beschaffenheit (feiner Kies bzw. Sand oder asphaltiert, d.h. ohne Schotter) eindeutig erkennbar.","c":true},{"l":"B","t":"Ein Weg ausschliesslich innerhalb von Tunneln, der durch Personal zum Aufenthalt genutzt werden darf.","c":false},{"l":"C","t":"Jeder unbefestigte Streifen entlang des Gleises, unabhängig von seiner Beschaffenheit.","c":false},{"l":"D","t":"Ein Weg im Gleisbereich, der ausschliesslich mit Schotter befestigt ist.","c":false}],"fdv":"Gehweg: ein Weg im Gleisbereich ausserhalb von Tunnel, der durch Personal zum Aufenthalt oder Arbeiten genutzt werden darf. Er ist auf Grund seiner Beschaffenheit (feiner Kies bzw. Sand oder asphaltiert, d.h. ohne Schotter) eindeutig erkennbar.","note":"","optTags":{"A":[],"B":[],"C":[],"D":[]},"optNotes":{"A":"","B":"","C":"","D":""}},{"nr":179,"p":1,"term":"Anschlussgleisbetreiberin","approved":false,"q":"Was ist die «Anschlussgleisbetreiberin» gemäss FDV R 300.1, Ziff. 2.5.2?","opts":[{"l":"A","t":"EBU, das eine Eisenbahninfrastruktur betreibt.","c":false},{"l":"B","t":"Der Anschliesser, der für den infrastrukturseitigen Betrieb des Anschlussgleises verantwortlich ist.","c":true},{"l":"C","t":"EVU, welches den Netzzugang auf einer Infrastruktur beansprucht.","c":false},{"l":"D","t":"Der Anschliesser, der ausschliesslich für den Gütertransport auf dem Anschlussgleis verantwortlich ist.","c":false}],"fdv":"Anschlussgleisbetreiberin: der Anschliesser, der für den infrastrukturseitigen Betrieb des Anschlussgleises verantwortlich ist.","note":"","optTags":{"A":[],"B":[],"C":[],"D":[]},"optNotes":{"A":"","B":"","C":"","D":""}},{"nr":180,"p":1,"term":"Arbeitsstellen-Koordinator (AKO)","approved":false,"q":"Was gilt für den «Arbeitsstellen-Koordinator/in (AKO)» gemäss FDV R 300.1, Ziff. 2.5.2?","opts":[{"l":"A","t":"Befinden sich in gesperrten Gleisen mehrere Arbeitsstellen, kann ein SC als AKO eingesetzt werden.","c":true},{"l":"B","t":"Der AKO ist ausschliesslich für die Koordination zwischen zwei benachbarten Bahnhöfen zuständig.","c":false},{"l":"C","t":"Befinden sich in einem gesperrten Gleis mehrere Arbeitsstellen, muss zwingend für jede ein eigener SC eingesetzt werden.","c":false},{"l":"D","t":"Der AKO ersetzt den Fahrdienstleiter bei Arbeiten im Gleisbereich.","c":false}],"fdv":"Arbeitsstellen-Koordinator/in (AKO): befinden sich in gesperrten Gleisen mehrere Arbeitsstellen, kann ein SC als AKO eingesetzt werden.","note":"","optTags":{"A":[],"B":[],"C":[],"D":[]},"optNotes":{"A":"","B":"","C":"","D":""}},{"nr":181,"p":1,"term":"Driver Machine Interface (DMI)","approved":false,"q":"Was ist das «Driver Machine Interface (DMI)» gemäss FDV R 300.1, Ziff. 2.5.2?","opts":[{"l":"A","t":"Bedien- und Anzeigeelement, unabhängig vom Standort im Fahrzeug.","c":false},{"l":"B","t":"Bedien- und Anzeigeelement im Führerstand.","c":true},{"l":"C","t":"Die Einrichtung auf dem Triebfahrzeug zur Abgabe von akustischen Signalen.","c":false},{"l":"D","t":"Bedien- und Anzeigeelement ausserhalb des Führerstands, z.B. im Passagierraum.","c":false}],"fdv":"Driver Machine Interface (DMI): Bedien- und Anzeigeelement im Führerstand.","note":"","optTags":{"A":["needs_review"],"B":[],"C":[],"D":[]},"optNotes":{"A":"","B":"","C":"","D":""},"contentVersion":2},{"nr":182,"p":1,"term":"Gestörter Abschnitt","approved":false,"q":"Was ist ein «Gestörter Abschnitt» gemäss FDV R 300.1, Ziff. 2.5.2?","opts":[{"l":"A","t":"Ein Fahrweg, welcher durch ein gestörtes Element der Sicherungsanlage beeinflusst wird oder in welchem sich ein mittels Notbedienung in Grundstellung verbrachtes Element der Sicherungsanlage befindet. Dieser entspricht der Fahrstrasse, welche im Regelbetrieb ohne Notbedienung eingestellt werden kann. Er ist durch den FDL für jede Fahrt erneut zu bestimmen.","c":true},{"l":"B","t":"Jeder Fahrweg, der nach einer Störung dauerhaft für den Betrieb gesperrt bleibt.","c":false},{"l":"C","t":"Ein Fahrweg, welcher durch ein gestörtes Element der Sicherungsanlage beeinflusst wird und einmalig durch den FDL bestimmt und danach nicht mehr verändert wird.","c":false},{"l":"D","t":"Ein Fahrweg, welcher ausschliesslich durch Notbedienung eingestellt werden kann, unabhängig vom Regelbetrieb.","c":false}],"fdv":"Gestörter Abschnitt: ein Fahrweg, welcher durch ein gestörtes Element der Sicherungsanlage beeinflusst wird oder in welchem sich ein mittels Notbedienung in Grundstellung verbrachtes Element der Sicherungsanlage befindet. Dieser entspricht der Fahrstrasse, welche im Regelbetrieb ohne Notbedienung eingestellt werden kann. Er ist durch den FDL für jede Fahrt erneut zu bestimmen.","note":"","optTags":{"A":[],"B":[],"C":[],"D":[]},"optNotes":{"A":"","B":"","C":"","D":""}},{"nr":183,"p":1,"term":"Instruierte Person für elektrische Anlagen (IPEA)","approved":false,"q":"Was ist eine «Instruierte Person für elektrische Anlagen (IPEA)» gemäss FDV R 300.1, Ziff. 2.5.2?","opts":[{"l":"A","t":"Person mit Erfahrung im Umgang mit Starkstromanlagen, die Personen instruieren und ausbilden darf.","c":false},{"l":"B","t":"Person mit Berechtigung, um begrenzte, genau umschriebene Tätigkeiten in Starkstromanlagen auszuführen, gemäss Instruktion durch eine sachverständige Person. Sie kennt die örtlichen Verhältnisse und die zu treffenden Schutzmassnahmen.","c":true},{"l":"C","t":"Person, die für Schalthandlungen an elektrischen Anlagen instruiert oder sachverständig ist und diese immer im Auftrag ausführt.","c":false},{"l":"D","t":"Person mit unbeschränkter Berechtigung für sämtliche Tätigkeiten in Starkstromanlagen, ohne vorherige Instruktion.","c":false}],"fdv":"Instruierte Person für elektrische Anlagen (IPEA): Person mit Berechtigung, um begrenzte, genau umschriebene Tätigkeiten in Starkstromanlagen auszuführen, gemäss Instruktion durch eine sachverständige Person. Sie kennt die örtlichen Verhältnisse und die zu treffenden Schutzmassnahmen.","note":"","optTags":{"A":[],"B":[],"C":[],"D":[]},"optNotes":{"A":"","B":"","C":"","D":""}},{"nr":184,"p":1,"term":"Sachverständige Person für elektrische Anlagen (SPEA)","approved":false,"q":"Was ist eine «Sachverständige Person für elektrische Anlagen (SPEA)» gemäss FDV R 300.1, Ziff. 2.5.2?","opts":[{"l":"A","t":"Person mit Berechtigung, um begrenzte, genau umschriebene Tätigkeiten in Starkstromanlagen auszuführen, gemäss Instruktion durch eine andere Person.","c":false},{"l":"B","t":"Person, die für Schalthandlungen an elektrischen Anlagen instruiert oder sachverständig ist und diese immer im Auftrag ausführt, ausser in Notsituationen.","c":false},{"l":"C","t":"Person mit Erfahrung im Umgang mit Starkstromanlagen, kennt die örtlichen Verhältnisse und die zu treffenden Schutzmassnahmen. Sie kann z.B. als Betriebsinhaber, Anlageverantwortlicher, Arbeitsverantwortlicher oder Schaltberechtigte Person eingesetzt werden und darf Personen instruieren und ausbilden.","c":true},{"l":"D","t":"Person ohne praktische Erfahrung, die ausschliesslich theoretisch für Starkstromanlagen ausgebildet ist.","c":false}],"fdv":"Sachverständige Person für elektrische Anlagen (SPEA): Person mit Erfahrung im Umgang mit Starkstromanlagen, kennt die örtlichen Verhältnisse und die zu treffenden Schutzmassnahmen. Sie kann z.B. als Betriebsinhaber, Anlageverantwortlicher, Arbeitsverantwortlicher oder Schaltberechtigte Person eingesetzt werden und darf Personen instruieren und ausbilden.","note":"","optTags":{"A":[],"B":[],"C":[],"D":[]},"optNotes":{"A":"","B":"","C":"","D":""}},{"nr":185,"p":1,"term":"Schaltberechtigte Person","approved":false,"q":"Was gilt für die «Schaltberechtigte Person» gemäss FDV R 300.1, Ziff. 2.5.2?","opts":[{"l":"A","t":"Sie ist für Schalthandlungen an elektrischen Anlagen instruiert oder sachverständig. Sie führt Schalthandlungen immer im Auftrag aus, ausser in Notsituationen.","c":true},{"l":"B","t":"Sie darf Schalthandlungen ausschliesslich auf eigene Initiative ausführen, niemals im Auftrag.","c":false},{"l":"C","t":"Sie hat Erfahrung im Umgang mit Starkstromanlagen und darf Personen instruieren und ausbilden.","c":false},{"l":"D","t":"Sie darf begrenzte, genau umschriebene Tätigkeiten in Starkstromanlagen ausführen, gemäss Instruktion durch eine sachverständige Person.","c":false}],"fdv":"Schaltberechtigte Person: Person ist für Schalthandlungen an elektrischen Anlagen instruiert oder sachverständig. Sie führt Schalthandlungen immer im Auftrag aus, ausser in Notsituationen.","note":"","optTags":{"A":[],"B":[],"C":[],"D":[]},"optNotes":{"A":"","B":"","C":"","D":""}},{"nr":186,"p":1,"term":"Sicherheitsdispositiv (SIDI)","approved":false,"q":"Was ist das «Sicherheitsdispositiv (SIDI)» gemäss FDV R 300.1, Ziff. 2.5.2?","opts":[{"l":"A","t":"Festlegung der für eine Arbeitsstelle notwendigen Sicherheitsmassnahmen, sowie der durch die ISB in ihren Ausführungsbestimmungen vorgeschriebenen Angaben.","c":true},{"l":"B","t":"Die Stelle, die unter Verantwortung der ISB das SIDI mit den Sicherheitsmassnahmen vorschreibt und überwacht.","c":false},{"l":"C","t":"Verantwortliches Personal für die Durchführung der Sicherheitsmassnahmen auf der Arbeitsstelle.","c":false},{"l":"D","t":"Die einmalige, nicht anpassbare Festlegung der Sicherheitsmassnahmen zu Beginn einer Arbeitsstelle.","c":false}],"fdv":"Sicherheitsdispositiv (SIDI): Festlegung der für eine Arbeitsstelle notwendigen Sicherheitsmassnahmen, sowie der durch die ISB in ihren Ausführungsbestimmungen vorgeschriebenen Angaben.","note":"","optTags":{"A":[],"B":[],"C":[],"D":[]},"optNotes":{"A":"","B":"","C":"","D":""}},{"nr":187,"p":2,"term":"Begleitung der Züge (Ziff. 2.6.1)","approved":false,"q":"Was gilt gemäss FDV R 300.1, Ziff. 2.6.1 «Begleitung der Züge»?","opts":[{"l":"A","t":"Alle Züge müssen zwingend von einem Zugbegleiter/einer Zugbegleiterin (ZBE) begleitet werden.","c":false},{"l":"B","t":"Züge, welche die technischen Bedingungen erfüllen, verkehren in der Regel ohne ZBE. Die EVU bezeichnen in den Ausführungsbestimmungen die Züge, die begleitet werden.","c":true},{"l":"C","t":"Die Begleitung durch einen ZBE ist ausschliesslich dem Lokführer selbst überlassen, ohne Vorgaben des EVU.","c":false},{"l":"D","t":"Züge, welche die technischen Bedingungen erfüllen, verkehren immer mit ZBE.","c":false}],"fdv":"Begleitung der Züge: Züge, welche die technischen Bedingungen erfüllen, verkehren in der Regel ohne ZBE. Die EVU bezeichnen in den Ausführungsbestimmungen die Züge, die begleitet werden.","note":"","optTags":{"A":[],"B":[],"C":[],"D":["needs_review"]},"optNotes":{"A":"","B":"","C":"","D":""},"contentVersion":2},{"nr":188,"p":1,"term":"Verzeichnis kilometrische Lage Bahnübergangsanlagen (Ziff. 2.6.2)","approved":false,"q":"Was gilt gemäss FDV R 300.1, Ziff. 2.6.2 zum «Verzeichnis über die kilometrische Lage der Bahnübergangsanlagen»?","opts":[{"l":"A","t":"Die EVU haben ein aktuelles Verzeichnis zu erstellen, das ausschliesslich dem Sicherheitschef zugänglich sein muss.","c":false},{"l":"B","t":"Die ISB haben ein aktuelles Verzeichnis über die kilometrische Lage der Bahnübergangsanlagen und deren Bahnübergänge zu erstellen. Mindestens dem FDL ist dieses Verzeichnis in geeigneter Weise zugänglich zu machen.","c":true},{"l":"C","t":"Die ISB haben ein Verzeichnis zu erstellen, jedoch nur für Bahnübergänge ausserhalb des eigenen Netzes.","c":false},{"l":"D","t":"Die ISB haben ein Verzeichnis zu erstellen, das jedoch nur bei Bedarf und ohne Zugänglichkeit für den FDL geführt wird.","c":false}],"fdv":"Verzeichnis über die kilometrische Lage der Bahnübergangsanlagen: die ISB haben ein aktuelles Verzeichnis über die kilometrische Lage der Bahnübergangsanlagen und deren Bahnübergänge zu erstellen. Mindestens dem FDL ist dieses Verzeichnis in geeigneter Weise zugänglich zu machen.","note":"","optTags":{"A":[],"B":[],"C":["needs_review"],"D":[]},"optNotes":{"A":"","B":"","C":"","D":""},"contentVersion":2},{"nr":189,"p":2,"term":"Checklisten Fahrdienst - Anwendungspflicht (Ziff. 2.6.3)","approved":false,"q":"In welchen Fällen ist gemäss FDV R 300.1, Ziff. 2.6.3 das Erstellen und Anwenden der Checkliste Fahrdienst (CL-F) im Bahnbetrieb verbindlich?","opts":[{"l":"A","t":"Ausschliesslich bei der Behebung von Störungen, in keinem anderen Fall.","c":false},{"l":"B","t":"Wenn Rangierbewegungen auf die Strecke verkehren, zur Behebung von Störungen, beim Einführen/Aufheben von betrieblichen Sicherheitsmassnahmen bei Arbeiten im Gleisbereich, sowie in zusätzlichen vom EBU vorgeschriebenen Fällen.","c":true},{"l":"C","t":"Nur wenn der Fahrdienstleiter dies im Einzelfall als sinnvoll erachtet.","c":false},{"l":"D","t":"Ausschliesslich beim Einführen von Sicherheitsmassnahmen bei Arbeiten im Gleisbereich, in keinem anderen Fall.","c":false}],"fdv":"Checklisten Fahrdienst (CL-F): das Erstellen und Anwenden der CL-F ist im Bahnbetrieb verbindlich, wenn Rangierbewegungen auf die Strecke verkehren, zur Behebung von Störungen, zum Einführen/Aufheben von betrieblichen Sicherheitsmassnahmen bei Arbeiten im Gleisbereich, sowie in den zusätzlichen vom EBU vorgeschriebenen Fällen. Die FDV bilden die Grundlage für die Erstellung der CL-F.","note":"","optTags":{"A":[],"B":[],"C":[],"D":[]},"optNotes":{"A":"","B":"","C":"","D":""}},{"nr":190,"p":1,"term":"Energieeffizienz (Ziff. 2.6.4)","approved":false,"q":"Was gilt gemäss FDV R 300.1, Ziff. 2.6.4 «Energieeffizienz»?","opts":[{"l":"A","t":"Die ISB und die EVU unterstützen den wirtschaftlichen Einsatz von Energie, soweit die Sicherheit nicht negativ beeinflusst wird. Sie erlassen die dazu notwendigen Betriebsvorschriften.","c":true},{"l":"B","t":"Energieeffizienz hat immer Vorrang vor Sicherheitsüberlegungen.","c":false},{"l":"C","t":"Ausschliesslich die ISB sind für Energieeffizienz-Massnahmen zuständig, die EVU haben keine diesbezügliche Verantwortung.","c":false},{"l":"D","t":"Die ISB und die EVU unterstützen den wirtschaftlichen Einsatz von Energie unabhängig davon, ob die Sicherheit dadurch beeinflusst wird.","c":false}],"fdv":"Energieeffizienz: die ISB und die EVU unterstützen den wirtschaftlichen Einsatz von Energie, soweit die Sicherheit nicht negativ beeinflusst wird. Sie erlassen die dazu notwendigen Betriebsvorschriften.","note":"","optTags":{"A":[],"B":[],"C":[],"D":[]},"optNotes":{"A":"","B":"","C":"","D":""}},{"nr":191,"p":2,"term":"Abstimmung bei geteilten Funktionen (Ziff. 2.7)","approved":false,"q":"Was gilt gemäss FDV R 300.1, Ziff. 2.7, wenn fahrdienstliche Aufgaben einer Funktion durch verschiedene Personen wahrgenommen werden?","opts":[{"l":"A","t":"Die Beteiligten sprechen sich über die Ausgangslage, den Stand der Arbeit und das konkrete Vorgehen ab, insbesondere bei geographischer oder funktionaler Trennung der Zuständigkeiten sowie bei zeitlicher Staffelung.","c":true},{"l":"B","t":"Jede Person arbeitet unabhängig, eine Absprache ist nur bei zeitlicher Staffelung nötig.","c":false},{"l":"C","t":"Die Beteiligten verhalten sich nach bestem Wissen und Gewissen und nach gesundem Menschenverstand.","c":false},{"l":"D","t":"Eine gegenseitige Absprache ist gesetzlich nicht vorgeschrieben, aber empfohlen.","c":false}],"fdv":"Einsatz und Verhalten des Personals: werden fahrdienstliche Aufgaben einer Funktion durch verschiedene Personen wahrgenommen, sprechen sich die Beteiligten über die Ausgangslage, den Stand der Arbeit und das konkrete Vorgehen ab. Dies gilt insbesondere bei geographischer oder funktionaler Trennung der Zuständigkeiten sowie bei zeitlicher Staffelung.","note":"","optTags":{"A":[],"B":[],"C":["needs_review"],"D":[]},"optNotes":{"A":"","B":"","C":"","D":""},"contentVersion":2},{"nr":192,"p":2,"term":"Mehrere Funktionen durch eine Person (Ziff. 2.7)","approved":false,"q":"Was gilt gemäss FDV R 300.1, Ziff. 2.7, wenn mehrere Funktionen durch eine einzelne Person wahrgenommen werden?","opts":[{"l":"A","t":"Diese Person stellt die korrekte Ausführung aller betreffenden fahrdienstlichen Tätigkeiten sicher.","c":true},{"l":"B","t":"Diese Person darf nur eine der zugewiesenen Funktionen tatsächlich ausüben.","c":false},{"l":"C","t":"Es ist zwingend eine zweite Person beizuziehen, welche die korrekte Ausführung kontrolliert.","c":false},{"l":"D","t":"Die Verantwortung für die korrekte Ausführung verteilt sich automatisch auf alle beteiligten Stellen des EBU.","c":false}],"fdv":"Werden mehrere Funktionen durch eine einzelne Person wahrgenommen, stellt diese Person die korrekte Ausführung aller betreffenden fahrdienstlichen Tätigkeiten sicher.","note":"","optTags":{"A":[],"B":[],"C":[],"D":[]},"optNotes":{"A":"","B":"","C":"","D":""}},{"nr":193,"p":1,"term":"Dienstübergabe (Ziff. 2.7)","approved":false,"q":"Was gilt gemäss FDV R 300.1, Ziff. 2.7 bei der Dienstübergabe?","opts":[{"l":"A","t":"Die abtretende Person übergibt die erforderlichen Informationen an die nachfolgende. Erfolgt keine direkte Übergabe, sind Besonderheiten schriftlich zu vermitteln.","c":true},{"l":"B","t":"Eine Übergabe von Informationen ist nur bei direkter, mündlicher Übergabe vorgeschrieben; ohne direkten Kontakt entfällt sie.","c":false},{"l":"C","t":"Die nachfolgende Person ist verpflichtet, sich die notwendigen Informationen eigenständig zu beschaffen.","c":false},{"l":"D","t":"Besonderheiten müssen ausschliesslich mündlich, niemals schriftlich, vermittelt werden.","c":false}],"fdv":"Bei Dienstübergabe übergibt die abtretende Person die erforderlichen Informationen an die nachfolgende. Erfolgt keine direkte Übergabe, sind Besonderheiten schriftlich zu vermitteln.","note":"","optTags":{"A":[],"B":[],"C":[],"D":[]},"optNotes":{"A":"","B":"","C":"","D":""}},{"nr":194,"p":1,"term":"Arbeits- und Ruhezeit (Ziff. 2.7.1)","approved":false,"q":"Was gilt gemäss FDV R 300.1, Ziff. 2.7.1 zur Arbeits- und Ruhezeit?","opts":[{"l":"A","t":"Personen, die fahrdienstliche Tätigkeiten ausüben, sind für die Einhaltung der gesetzlichen Vorgaben über die Arbeits- und Ruhezeit mitverantwortlich.","c":true},{"l":"B","t":"Die Einhaltung der Arbeits- und Ruhezeit liegt ausschliesslich in der Verantwortung des Arbeitgebers, nicht des Personals.","c":false},{"l":"C","t":"Gesetzliche Vorgaben zur Arbeits- und Ruhezeit gelten für fahrdienstliches Personal nicht.","c":false},{"l":"D","t":"Die Verantwortung für die Arbeits- und Ruhezeit trägt ausschliesslich der Sicherheitschef.","c":false}],"fdv":"Personen, die fahrdienstliche Tätigkeiten ausüben, sind für die Einhaltung der gesetzlichen Vorgaben über die Arbeits- und Ruhezeit mitverantwortlich.","note":"","optTags":{"A":[],"B":[],"C":[],"D":[]},"optNotes":{"A":"","B":"","C":"","D":""}},{"nr":195,"p":1,"term":"Signalmittel Triebfahrzeuge/Steuerwagen (Ziff. 2.9.1)","approved":false,"q":"Wähle gemäss FDV R 300.1, Ziff. 2.9.1 alle Signalmittel aus, die auf jedem Triebfahrzeug und Steuerwagen im Bahnbetrieb mitzuführen sind (Mehrfachauswahl).","opts":[{"l":"A","t":"Laterne mit weissem und rotem Licht","c":true},{"l":"B","t":"Rote Signalflagge","c":true},{"l":"C","t":"Rote Haltsignal-Scheibe","c":false},{"l":"D","t":"Mundpfeife","c":false},{"l":"E","t":"Taschenlampe","c":false}],"fdv":"Signalmittel der Triebfahrzeuge und Steuerwagen im Bahnbetrieb: auf jedem Triebfahrzeug und Steuerwagen sind mitzuführen: eine Laterne mit weissem und rotem Licht, eine rote Signalflagge.","note":"","optTags":{"A":[],"B":[],"C":[],"D":[],"E":[]},"optNotes":{"A":"","B":"","C":"","D":"","E":""},"multiSelect":true,"contentVersion":2},{"nr":196,"p":1,"term":"Signalmittel in Bahnhöfen (Ziff. 2.9.2)","approved":false,"q":"Wähle gemäss FDV R 300.1, Ziff. 2.9.2 alle Signalmittel aus, die in Bahnhöfen im Bahnbetrieb während der örtlichen Besetzung bereitzuhalten sind (Mehrfachauswahl).","opts":[{"l":"A","t":"Laterne oder Taschenlampe mit weissem und rotem Licht","c":true},{"l":"B","t":"Rote Signalflagge","c":true},{"l":"C","t":"Rote Haltsignal-Scheibe","c":true},{"l":"D","t":"Mundpfeife","c":false},{"l":"E","t":"Handlaterne mit weissem und rotem Licht","c":false}],"fdv":"Signalmittel in Bahnhöfen im Bahnbetrieb: in Bahnhöfen ist während der örtlichen Besetzung bereitzuhalten: eine Laterne oder eine Taschenlampe mit weissem und rotem Licht, eine rote Signalflagge, eine rote Haltsignal-Scheibe.","note":"","optTags":{"A":[],"B":[],"C":[],"D":[],"E":[]},"optNotes":{"A":"","B":"","C":"","D":"","E":""},"multiSelect":true,"contentVersion":2},{"nr":199,"p":1,"term":"Grenze zwischen verschiedenen ISB (Ziff. 2.11.2)","approved":false,"q":"Was gilt gemäss FDV R 300.1, Ziff. 2.11.2 zur Grenze zwischen verschiedenen ISB?","opts":[{"l":"A","t":"Die Grenze zwischen verschiedenen ISB wird signalisiert. Auf die Signalisierung kann verzichtet werden, wenn die Grenze in den Betriebsvorschriften definiert und für das betroffene Personal eindeutig erkennbar ist.","c":true},{"l":"B","t":"Die Grenze zwischen verschiedenen ISB muss immer signalisiert werden, ohne jegliche Ausnahme.","c":false},{"l":"C","t":"Eine Signalisierung der Grenze zwischen verschiedenen ISB ist gesetzlich nicht vorgesehen.","c":false},{"l":"D","t":"Die Grenze zwischen verschiedenen ISB wird ausschliesslich in den Betriebsvorschriften des EVU geregelt.","c":false}],"fdv":"Grenze zwischen verschiedenen ISB: die Grenze zwischen verschiedenen ISB wird signalisiert. Auf die Signalisierung kann verzichtet werden, wenn die Grenze in den Betriebsvorschriften definiert und für das betroffene Personal eindeutig erkennbar ist.","note":"","optTags":{"A":[],"B":[],"C":[],"D":[]},"optNotes":{"A":"","B":"","C":"","D":""}},{"nr":197,"p":1,"term":"Signalmittel des Personals - Fahrdienstleiter/in mit Aufsichtsfunktion (Ziff. 2.9.3)","approved":false,"multiSelect":true,"q":"Wähle gemäss FDV R 300.1, Ziff. 2.9.3 alle Signalmittel aus, die der/die Fahrdienstleiter/in mit Aufsichtsfunktion im Bahnbetrieb benötigt (Mehrfachauswahl).","opts":[{"l":"A","t":"Mundpfeife","c":true},{"l":"B","t":"Taschenlampe","c":false},{"l":"C","t":"Handlaterne mit weissem und rotem Licht bei Nacht","c":false},{"l":"D","t":"Rote Haltsignal-Scheibe","c":false},{"l":"E","t":"Rote Signalflagge","c":false}],"fdv":"Signalmittel des Personals im Bahnbetrieb: der RL, der RA und der FDL mit Aufsichtsfunktion benötigen eine Mundpfeife. Der ZBE be  sind mit Vorheiztafeln gekennzeichnet, ausgenommen Pendelzüge, auch mit Zusatzwagen, die über das Triebfahrzeug vorgeheizt werden.","note":"","optTags":{"A":[],"B":[],"C":[],"D":[]},"optNotes":{"A":"","B":"","C":"","D":""},"img":"images/image132.png","contentVersion":2},{"nr":209,"p":1,"term":"Hemmschuhwarntafel (Ziff. 3.2.6)","approved":false,"q":"Wie lautet der Begriff (Name) dieses Signals gemäss FDV R 300.2, Ziff. 3.2.6?","opts":[{"l":"A","t":"Vorsicht Profil","c":false},{"l":"B","t":"Hemmschuhwarntafel","c":true},{"l":"C","t":"Vorheiztafel","c":false},{"l":"D","t":"Halt","c":false}],"fdv":"Hemmschuhwarntafel - Bedeutung: Die Fahrzeuge sind mit Hemmschuhen gegen Entlaufen gesichert.","note":"","optTags":{"A":[],"B":[],"C":[],"D":[]},"optNotes":{"A":"","B":"","C":"","D":""},"img":"images/image133.png","contentVersion":2},{"nr":210,"p":2,"term":"Signal Vorwärts (Ziff. 3.3.2)","approved":false,"q":"Wie lautet der Begriff (Name) dieses Signals gemäss FDV R 300.2, Ziff. 3.3.2?","opts":[{"l":"A","t":"Rückwärts","c":false},{"l":"B","t":"Vorwärts","c":true},{"l":"C","t":"Anfahren vorwärts","c":false},{"l":"D","t":"Bewegen","c":false}],"fdv":"Vorwärts - Signal: ein langer Pfiff und einmaliges Bewegen des erhobenen Arms in senkrechtem Halbkreis in der Fahrrichtung. Begriff: Vorwärts. Bedeutung: Vorwärts fahren. Es kann das Signal Sichtverbindung folgen.","note":"","optTags":{"A":[],"B":[],"C":[],"D":[]},"optNotes":{"A":"","B":"","C":"","D":""},"img":"images/image134.png","contentVersion":2},{"nr":211,"p":2,"term":"Signal Anfahren vorwärts (Ziff. 3.3.4)","approved":false,"q":"Wie lautet der Begriff (Name) dieses Signals gemäss FDV R 300.2, Ziff. 3.3.4?","opts":[{"l":"A","t":"Anfahren rückwärts","c":false},{"l":"B","t":"Vorwärts","c":false},{"l":"C","t":"Anfahren vorwärts","c":true},{"l":"D","t":"Stoss","c":false}],"fdv":"Anfahren vorwärts - Signal: ein langer Pfiff und einmaliges kreisförmiges Einwärtsbewegen der beiden erhobenen Arme quer zum Gleis. Begriff: Anfahren vorwärts. Bedeutung: Vorwärts gegen ein Hindernis fahren. Es kann das Signal Sichtverbindung folgen. Die Signale Anfahren vorwärts und Anfahren rückwärts sind durch den Ruf «anfahren» zu ergänzen.","note":"","optTags":{"A":[],"B":[],"C":[],"D":[]},"optNotes":{"A":"","B":"","C":"","D":""},"img":"images/image136.png","contentVersion":2},{"nr":212,"p":2,"term":"Signal Sichtverbindung (Ziff. 3.3.5)","approved":false,"q":"Wie lautet der Begriff (Name) dieses Signals gemäss FDV R 300.2, Ziff. 3.3.5?","opts":[{"l":"A","t":"Sichtverbindung","c":true},{"l":"B","t":"Langsamer","c":false},{"l":"C","t":"Bewegen","c":false},{"l":"D","t":"Halt","c":false}],"fdv":"Sichtverbindung - Signal: langsames Schwingen des nach unten ausgestreckten Arms schräg zum Gleis. Begriff: Sichtverbindung. Bedeutung: Optische Verbindungsüberwachung zwischen dem den Fahrweg beobachtenden RL und dem LF. Es können Entfernungsangaben folgen. Das Signal ist nach Beginn der Entfernungsangaben nicht mehr zu geben.","note":"","optTags":{"A":[],"B":[],"C":[],"D":[]},"optNotes":{"A":"","B":"","C":"","D":""},"img":"images/image138.png","contentVersion":2},{"nr":213,"p":2,"term":"Signal Stoss (Ziff. 3.3.7)","approved":false,"q":"Wie lautet der Begriff (Name) dieses Signals gemäss FDV R 300.2, Ziff. 3.3.7?","opts":[{"l":"A","t":"Anfahren vorwärts","c":false},{"l":"B","t":"Stoss","c":true},{"l":"C","t":"Halt","c":false},{"l":"D","t":"Sichtverbindung","c":false}],"fdv":"Stoss - Signal: ein kurzer und ein langer Pfiff sowie einmaliges rasches Bewegen des erhobenen Arms in senkrechtem Halbkreis in der Richtung des Stosses. Das Signal ist durch den Ruf «Stoss» zu ergänzen. Begriff: Stoss. Bedeutung: Rasches Beschleunigen der Rangierbewegung. Befinden sich vor und hinter dem Triebfahrzeug Wagen, ist der LF über die Richtung des Stosses zu verständigen.","note":"","optTags":{"A":[],"B":[],"C":[],"D":[]},"optNotes":{"A":"","B":"","C":"","D":""},"img":"images/image140.png","contentVersion":2},{"nr":214,"p":2,"term":"Signal Halt bei Rangierbewegungen (Ziff. 3.3.9)","approved":false,"q":"Wie lautet der Begriff (Name) dieses Signals gemäss FDV R 300.2, Ziff. 3.3.9?","opts":[{"l":"A","t":"Bewegen","c":false},{"l":"B","t":"Langsamer","c":false},{"l":"C","t":"Halt","c":true},{"l":"D","t":"Rückwärts","c":false}],"fdv":"Halt (Personal bei Rangierbewegungen) - Signal bei Tag: drei kurze Pfiffe und rasches Auf- und Abwärtsbewegen des quer zum Gleis ausgestreckten Arms. Bei Nacht: drei kurze Pfiffe und rasches Auf- und Abwärtsbewegen mit rotem Licht; ist kein solches vorhanden, ist ausnahmsweise ein weisses Licht zugelassen. Begriff: Halt. Bedeutung: Anhalten.","note":"","optTags":{"A":[],"B":[],"C":[],"D":[]},"optNotes":{"A":"","B":"","C":"","D":""},"img":"images/image143.png","contentVersion":2},{"nr":215,"p":1,"term":"Vorsicht Profil (Ziff. 3.4.2)","approved":false,"q":"Wie lautet der Begriff (Name) dieses Signals gemäss FDV R 300.2, Ziff. 3.4.2?","opts":[{"l":"A","t":"Hemmschuhwarntafel","c":false},{"l":"B","t":"Vorsicht Profil","c":true},{"l":"C","t":"Vorheiztafel","c":false},{"l":"D","t":"Halt","c":false}],"fdv":"Warnzeichen - gelb-schwarze Streifen kennzeichnen Hindernisse, die nahe ans Profil grenzen oder eine nicht ohne weiteres erkennbare Gefahrenstelle sind. Begriff: Vorsicht Profil. Bedeutung: Besondere Vorsicht.","note":"","optTags":{"A":[],"B":[],"C":[],"D":[]},"optNotes":{"A":"","B":"","C":"","D":""},"img":"images/image149.png","contentVersion":2},{"nr":216,"p":2,"term":"Gültigkeit der Signale (Ziff. 1.1.1)","approved":false,"q":"Was gilt gemäss FDV R 300.2, Ziff. 1.1.1 für Signale, die entgegen den Vorschriften nicht beleuchtet sind oder sich in zweifelhafter Stellung befinden?","opts":[{"l":"A","t":"Sie sind als «Halt» zeigende Signale zu betrachten; Vorsignale sinngemäss als «Warnung» zeigend.","c":true},{"l":"B","t":"Sie dürfen ignoriert werden, bis der FDL eine Anweisung erteilt.","c":false},{"l":"C","t":"Sie sind als «Warnung» zeigende Signale zu betrachten; Vorsignale sinngemäss als «Halt» zeigend.","c":false},{"l":"D","t":"Sie sind als «Halt» zeigende Signale zu betrachten; Vorsignale gelten davon ausgenommen weiterhin als «Fahrt» zeigend.","c":false}],"fdv":"Gültigkeit der Signale: Signale, die entgegen den Vorschriften nicht beleuchtet sind oder sich in zweifelhafter Stellung befinden, sind als Halt zeigende Signale zu betrachten; sinngemäss sind Vorsignale als Warnung zeigend zu betrachten.","note":"","optTags":{"A":[],"B":["needs_review"],"C":["needs_review"],"D":["needs_review"]},"optNotes":{"A":"","B":"","C":"","D":""},"contentVersion":2},{"nr":217,"p":1,"term":"Fehlende Signaltafeln (Ziff. 1.1.2)","approved":false,"q":"Was ist gemäss FDV R 300.2, Ziff. 1.1.2 zu tun, wenn das Personal ein fehlendes oder nicht eindeutig erkennbares ortsfestes Signal feststellt?","opts":[{"l":"A","t":"Der zuständige FDL ist zu verständigen.","c":true},{"l":"B","t":"Das Signal darf als «Fahrt» zeigend angenommen werden.","c":false},{"l":"C","t":"Es ist ein Eintrag in der Checkliste Fahrdienst vorzunehmen, ohne den FDL zu informieren.","c":false},{"l":"D","t":"Die nächste Arbeitsstelle ist zu verständigen.","c":false}],"fdv":"Fehlende oder nicht eindeutig erkennbare ortsfeste Signaltafeln: wird durch das Personal ein fehlendes oder nicht eindeutig erkennbares ortsfestes Signal festgestellt, ist der zuständige FDL zu verständigen.","note":"","optTags":{"A":[],"B":[],"C":[],"D":[]},"optNotes":{"A":"","B":"","C":"","D":""}},{"nr":218,"p":1,"term":"Aufstellung der Signale (Ziff. 1.1.3)","approved":false,"q":"Wo befinden sich ortsfeste Signale gemäss FDV R 300.2, Ziff. 1.1.3 grundsätzlich?","opts":[{"l":"A","t":"Links vom Gleis, in Fahrrichtung gesehen. Auf einspurigen Strecken können sie zur besseren Sichtbarkeit auch rechts aufgestellt sein.","c":true},{"l":"B","t":"Rechts vom Gleis, in Fahrrichtung gesehen, ohne Ausnahmen.","c":false},{"l":"C","t":"Links vom Gleis, unabhängig von der Fahrrichtung.","c":false},{"l":"D","t":"Immer zwischen den beiden Gleisen, auch auf eingleisigen Strecken.","c":false}],"fdv":"Aufstellung der Signale: ortsfeste Signale befinden sich links vom Gleis. Auf einspurigen Strecken können sie zur besseren Sichtbarkeit auch rechts aufgestellt sein. Die Bezeichnungen links und rechts gelten im Sinne der Fahrrichtung.","note":"","optTags":{"A":[],"B":[],"C":[],"D":[]},"optNotes":{"A":"","B":"","C":"","D":""}},{"nr":219,"p":2,"term":"Abgabe von Signalen des Personals (Ziff. 1.1.4)","approved":false,"q":"Was gilt gemäss FDV R 300.2, Ziff. 1.1.4, wenn ein Signal des Personals nicht eindeutig ist oder nicht deutlich wahrgenommen wird?","opts":[{"l":"A","t":"Es ist anzuhalten, seine Wiederholung abzuwarten oder zu erwirken.","c":true},{"l":"B","t":"Es ist mit der bisherigen Geschwindigkeit weiterzufahren, bis das Signal erneut gegeben wird.","c":false},{"l":"C","t":"Die Geschwindigkeit ist sofort auf Fahrt auf Sicht, höchstens 40 km/h, zu reduzieren.","c":false},{"l":"D","t":"Es ist ausschliesslich der Sicherheitschef zu verständigen, ein Anhalten ist nicht vorgesehen.","c":false}],"fdv":"Abgabe von Signalen des Personals: bei der Abgabe von Signalen ist mit Ruhe und Überlegung zu handeln. Die Signale müssen deutlich sein und genau beachtet werden. Sind Missverständnisse zu befürchten, sind Mitarbeitende, welche das Signal zu beachten haben, zusätzlich zu verständigen. Ist ein Signal nicht eindeutig oder wird es nicht deutlich wahrgenommen, ist anzuhalten, seine Wiederholung abzuwarten oder zu erwirken.","note":"","optTags":{"A":[],"B":["needs_review"],"C":["needs_review"],"D":["needs_review"]},"optNotes":{"A":"","B":"","C":"","D":""},"contentVersion":3},{"nr":222,"p":1,"term":"Sperrsignal (Ziff. 2.1.1)","approved":false,"img":"images/image4.png","q":"Wie heisst dieses Signal (Begriff) gemäss FDV R 300.2, Ziff. 2.1.1?","opts":[{"l":"A","t":"Sperrsignal","c":true},{"l":"B","t":"Haltsignal für das Decken eines Hindernisses","c":false},{"l":"C","t":"Rangierhaltsignal","c":false},{"l":"D","t":"Vorsignal zum Kontrolllicht Bahnübergangsanlage","c":false}],"fdv":"Sperrsignal - Begriff: Halt. Bedeutung: Halt vor dem Signal.","note":"","optTags":{"A":[],"B":[],"C":[],"D":[]},"optNotes":{"A":"","B":"","C":"","D":""}},{"nr":223,"p":2,"term":"Kennzeichnung Entgleisungsvorrichtung/Sperrschuh (Ziff. 2.1.2)","approved":false,"img":"images/image5.png","q":"Was gilt gemäss FDV R 300.2, Ziff. 2.1.2 für das Signal einer Entgleisungsvorrichtung oder eines Sperrschuhs, wenn diese abgeklappt sind?","opts":[{"l":"A","t":"Das Signal zeigt kein Bild.","c":true},{"l":"B","t":"Das Signal zeigt immer «Halt», unabhängig vom Zustand.","c":false},{"l":"C","t":"Das Signal zeigt das der Weichenstellung entsprechende Bild.","c":false},{"l":"D","t":"Das Signal zeigt ein rotes Blinklicht.","c":false}],"fdv":"Kennzeichnung der Stellung von Entgleisungsvorrichtungen, Sperrschuhen: das Signal zeigt kein Bild, wenn die Entgleisungsvorrichtung oder der Sperrschuh abgeklappt sind. Das Signal zeigt das der Weichenstellung entsprechende Bild, wenn die Weiche nicht in den Schutzstumpen führt.","note":"","optTags":{"A":[],"B":[],"C":[],"D":[]},"optNotes":{"A":"","B":"","C":"","D":""}},{"nr":224,"p":2,"term":"Haltsignal für das Decken eines Hindernisses (Ziff. 2.2.1)","approved":false,"img":"images/image8.png","multiSelect":true,"q":"Wähle gemäss FDV R 300.2, Ziff. 2.2.1 alle Zwecke aus, für die das «Haltsignal für das Decken eines Hindernisses» verwendet wird (Mehrfachauswahl).","opts":[{"l":"A","t":"Zum Decken gesperrter Gleise, insbesondere solcher, die nicht am Stellwerk gesichert werden können.","c":true},{"l":"B","t":"Zur Kennzeichnung von Gleisabschlüssen.","c":true},{"l":"C","t":"Zum Decken von Drehscheiben und Schiebebühnen in nicht verriegelter Stellung.","c":true},{"l":"D","t":"Zum Decken von Brückenwaagen, beweglichen Ladeprofilen usw.","c":true},{"l":"E","t":"Zur Kennzeichnung von Bahnübergangsanlagen mit Kontrolllicht.","c":false},{"l":"F","t":"Zur Regelung von Rangierbewegungen im Normalbetrieb.","c":false}],"fdv":"Haltsignal für das Decken eines Hindernisses - Begriff: Halt. Bedeutung: Halt vor dem Signal bzw. vor dem entsprechenden Objekt. Haltsignale werden verwendet: zum Decken gesperrter Gleise; zur Kennzeichnung von Gleisabschlüssen; zum Decken von Drehscheiben und Schiebebühnen in nicht verriegelter Stellung; zum Decken von Brückenwaagen, beweglichen Ladeprofilen usw.","note":"","optTags":{"A":[],"B":[],"C":[],"D":[],"E":[],"F":[]},"optNotes":{"A":"","B":"","C":"","D":"","E":"","F":""}},{"nr":225,"p":1,"term":"Vorsignal zum Kontrolllicht Bahnübergangsanlage (Ziff. 2.2.2)","approved":false,"img":"images/image10.png","q":"Wie lautet der Begriff dieses Signals gemäss FDV R 300.2, Ziff. 2.2.2, und was bedeutet es?","opts":[{"l":"A","t":"Bahnübergangsanlage eingeschaltet - Blinkt das Kontrolllicht orange oder weiss, ist die Bahnübergangsanlage eingeschaltet bzw. sind die Schranken geschlossen.","c":false},{"l":"B","t":"Vorsignal zum Kontrolllicht Bahnübergangsanlage - Es folgt eine Bahnübergangsanlage mit Kontrolllicht.","c":true},{"l":"C","t":"Achtung - Vorsicht, es nähert sich ein Zug oder eine Rangierbewegung.","c":false},{"l":"D","t":"Pfeifen - Abgabe des Achtungssignals.","c":false}],"fdv":"Kontrolllicht zur Bahnübergangsanlage - Begriff: Vorsignal zum Kontrolllicht Bahnübergangsanlage. Bedeutung: Es folgt eine Bahnübergangsanlage mit Kontrolllicht.","note":"","optTags":{"A":[],"B":[],"C":[],"D":[]},"optNotes":{"A":"","B":"","C":"","D":""},"contentVersion":2},{"nr":226,"p":1,"term":"Bahnübergangsanlage eingeschaltet (Ziff. 2.2.2)","approved":false,"img":"images/image11.png","q":"Wie lautet der Begriff dieses Signals gemäss FDV R 300.2, Ziff. 2.2.2, und was bedeutet ein orange oder weiss blinkendes Kontrolllicht?","opts":[{"l":"A","t":"Vorsignal zum Kontrolllicht Bahnübergangsanlage - es folgt eine Bahnübergangsanlage mit Kontrolllicht.","c":false},{"l":"B","t":"Bahnübergangsanlage eingeschaltet - die Bahnübergangsanlage ist eingeschaltet bzw. angssignal für Zahnstangenabschnitt. Bedeutung: bei diesem Signal befindet sich die Einfahrt in die Zahnstange. Bei der Einfahrt in die Zahnstange gilt die signalisierte Höchstgeschwindigkeit. Beziehung zu anderen Signalen: es kann ein Vorsignal vorausgehen und es folgt ein Endsignal.","note":"","optTags":{"A":[],"B":[],"C":[],"D":[]},"optNotes":{"A":"","B":"","C":"","D":""}},{"nr":247,"p":1,"term":"Endsignal für Zahnstangenabschnitt (Ziff. 2.3.6)","approved":false,"img":"images/image33.png","q":"Wie lautet der Begriff dieses Signals gemäss FDV R 300.2, Ziff. 2.3.6, und was bedeutet es?","opts":[{"l":"A","t":"Anfangssignal für Zahnstangenabschnitt - bei diesem Signal befindet sich die Einfahrt in die Zahnstange.","c":false},{"l":"B","t":"Endsignal für Zahnstangenabschnitt - bei diesem Signal befindet sich das Ende der Zahnstange.","c":true},{"l":"C","t":"Vorsignal für Zahnstangenabschnitt - ab dem Anfangssignal gilt die signalisierte Höchstgeschwindigkeit.","c":false},{"l":"D","t":"Endsignal Langsamfahrstelle - die verminderte Geschwindigkeit gilt, bis das letzte Fahrzeug an diesem Signal vorbeigefahren ist.","c":false}],"fdv":"Signale für Zahnstange - Begriff: Endsignal für Zahnstangenabschnitt. Bedeutung: bei diesem Signal befindet sich das Ende der Zahnstange. Beziehung zu anderen Signalen: es geht ein Anfangssignal voraus. Im französischen sowie im italienischen Sprachgebiet steht an Stelle eines «A» ein «C» bzw. an Stelle eines «E» ein «F».","note":"","optTags":{"A":[],"B":[],"C":[],"D":[]},"optNotes":{"A":"","B":"","C":"","D":""}},{"nr":248,"p":1,"term":"Zwergsignale - Allgemeines (Ziff. 2.4.1)","approved":false,"q":"Wozu dienen Zwergsignale gemäss FDV R 300.2, Ziff. 2.4.1?","opts":[{"l":"A","t":"Der Regelung von Rangierbewegungen sowie dem gegenseitigen Schutz von Rangierbewegungen unter sich oder gegen Zugfahrten.","c":true},{"l":"B","t":"Ausschliesslich der Regelung von Zugfahrten, nicht von Rangierbewegungen.","c":false},{"l":"C","t":"Ausschliesslich der K ängig vom Haupt- oder Sperrsignal.","c":false},{"l":"D","t":"Signalisiert ein Haupt- oder Sperrsignal Halt, zeigt das vorausgehende Zwergsignal ebenfalls Halt.","c":false}],"fdv":"Zwergsignale in Zugfahrstrassen: Zwergsignale zeigen bei eingestellter Zugfahrstrasse Fahrt. Signalisiert ein Haupt- oder Sperrsignal Halt, zeigt das vorausgehende Zwergsignal Fahrt mit Vorsicht.","note":"","optTags":{"A":[],"B":[],"C":[],"D":[]},"optNotes":{"A":"","B":"","C":"","D":""}},{"nr":251,"p":2,"term":"Letztes Zwergsignal gegen die Strecke (Ziff. 2.4.4)","approved":false,"q":"Was zeigt gemäss FDV R 300.2, Ziff. 2.4.4 das letzte Zwergsignal gegen die Strecke bei einer Zugfahrt bzw. bei einer Rangierbewegung?","opts":[{"l":"A","t":"Bei einer Zugfahrt Fahrt, bei einer Rangierbewegung Fahrt mit Vorsicht.","c":true},{"l":"B","t":"Bei einer Zugfahrt Fahrt mit Vorsicht, bei einer Rangierbewegung Fahrt.","c":false},{"l":"C","t":"Sowohl bei einer Zugfahrt als auch bei einer Rangierbewegung immer Fahrt mit Vorsicht.","c":false},{"l":"D","t":"Sowohl bei einer Zugfahrt als auch bei einer Rangierbewegung immer Fahrt.","c":false}],"fdv":"Letztes Zwergsignal gegen die Strecke: bei einer Zugfahrt zeigt das letzte Zwergsignal Fahrt, bei einer Rangierbewegung Fahrt mit Vorsicht.","note":"","optTags":{"A":[],"B":[],"C":[],"D":[]},"optNotes":{"A":"","B":"","C":"","D":""}},{"nr":252,"p":1,"term":"Zwergsignal Halt (Ziff. 2.4.5)","approved":false,"img":"images/image41.png","q":"Wie lautet der Begriff dieses Signals gemäss FDV R 300.2, Ziff. 2.4.5, und was bedeutet es?","opts":[{"l":"A","t":"Fahrt - Beginn oder Fortsetzung der Fahrt.","c":false},{"l":"B","t":"Halt - Halt vor dem Signal. Ein vorausgehendes Zwergsignal zeigt Fahrt mit Vorsicht.","c":true},{"l":"C","t":"Fahrt mit Vorsicht - Beginn oder Fortsetzung der Fahrt. Unmittelbar nach dem Zwergsignal muss mit einem Hindernis gerechnet werden.","c":false},{"l":"D","t":"Halt - Halt vor dem Signal. Ein vorausgehendes Zwergsignal zeigt ebenfalls Halt.","c":false}],"fdv":"Signalisierung an Zwergsignalen - Begriff: Halt. Bedeutung: Halt vor dem Signal. Beziehung zu anderen Signalen: ein vorausgehendes Zwergsignal zeigt Fahrt mit Vorsicht.","note":"","optTags":{"A":[],"B":[],"C":[],"D":[]},"optNotes":{"A":"","B":"","C":"","D":""}},{"nr":253,"p":1,"term":"Zwergsignal Fahrt mit Vorsicht (Ziff. 2.4.5)","approved":false,"img":"images/image42.png","q":"Wie lautet der Begriff dieses Signals gemäss FDV R 300.2, Ziff. 2.4.5, und was bedeutet es?","opts":[{"l":"A","t":"Halt - Halt vor dem Signal.","c":false},{"l":"B","t":"Fahrt - Beginn oder Fortsetzung der Fahrt. Das nächste Zwergsignal zeigt Fahrt oder Fahrt mit Vorsicht.","c":false},{"l":"C","t":"Fahrt mit Vorsicht - Beginn oder Fortsetzung der Fahrt. Unmittelbar nach dem Zwergsignal muss mit einem Hindernis gerechnet werden. Das nächste Zwergsignal zeigt Halt, Fahrt mit Vorsicht, oder es folgt kein weiteres Zwergsignal.","c":true},{"l":"D","t":"Fahrt mit Vorsicht - Beginn oder Fortsetzung der Fahrt. Es ist kein Hindernis zu erwarten.","c":false}],"fdv":"Signalisierung an Zwergsignalen - Begriff: Fahrt mit Vorsicht. Bedeutung: Beginn oder Fortsetzung der Fahrt. Unmittelbar nach dem Zwergsignal muss mit einem Hindernis gerechnet werden. Beziehung zu anderen Signalen: das nächste Zwergsignal zeigt Halt, Fahrt mit Vorsicht oder es folgt kein weiteres Zwergsignal.","note":"","optTags":{"A":[],"B":[],"C":[],"D":[]},"optNotes":{"A":"","B":"","C":"","D":""}},{"nr":254,"p":1,"term":"Zwergsignal Fahrt (Ziff. 2.4.5)","approved":false,"img":"images/image43.png","q":"Wie lautet der Begriff dieses Signals gemäss FDV R 300.2, Ziff. 2.4.5, und was bedeutet es?","opts":[{"l":"A","t":"Fahrt mit Vorsicht - Beginn oder Fortsetzung der Fahrt. Unmittelbar nach dem Zwergsignal muss mit einem Hindernis gerechnet werden.","c":false},{"l":"B","t":"Halt - Halt vor dem Signal.","c":false},{"l":"C","t":"Fahrt - Beginn oder Fortsetzung der Fahrt. Das nächste Zwergsignal zeigt Fahrt oder Fahrt mit Vorsi const tagById   = (id) => TAGS.find(t => t.id === id);
const prioByVal = (v)  => PRIO.find(p => p.value === v);
const hasIssues = (q)  =>
  q.note.trim() !== "" ||
  Object.values(q.optTags).some(a => a.length > 0) ||
  Object.values(q.optNotes || {}).some(n => n.trim() !== "");

function TagPill({ tag, onRemove }) {
  const t = tagById(tag);
  if (!t) return null;
  return (
    <span style={{ display:"inline-flex", alignItems:"center", gap:4,
      padding:"2px 8px", borderRadius:10, background:t.bg, color:t.color,
      fontSize:11, fontWeight:600 }}>
      {t.label}
      {onRemove && (
        <button onClick={onRemove} style={{ background:"none", border:"none",
          cursor:"pointer", color:t.color, padding:0, fontSize:13, lineHeight:1 }}>x</button>
      )}
    </span>
  );
}

function TagSelector({ selected, onChange }) {
  return (
    <div style={{ display:"flex", flexWrap:"wrap", gap:5, marginTop:4 }}>
      {TAGS.map(t => {
        const on = selected.includes(t.id);
        return (
          <button key={t.id} onClick={() =>
            onChange(on ? selected.filter(x => x !== t.id) : [...selected, t.id])
          } style={{
            padding:"3px 10px", borderRadius:10, fontSize:11, fontWeight:600,
            cursor:"pointer",
            background: on ? t.bg : "#f0f0f0",
            color:       on ? t.color : "#888",
            border:      on ? "1.5px solid " + t.color : "1.5px solid #ddd",
          }}>{t.label}</button>
        );
      })}
    </div>
  );
}

function App() {
  const [qs, setQs]           = useState(INITIAL_QS);
  const [openSet, setOpenSet] = useState(() =>
    new Set(INITIAL_QS.filter(q => !q.approved).map(q => q.nr))
  );
  const [search, setSearch]           = useState("");
  const [filterOpen, setFilterOpen]   = useState(false);
  const [filterIssues, setFilterIssues] = useState(false);
  const [filterPrio, setFilterPrio]   = useState(0);

  // "idle" | "loading" | "saving" | "saved" | "error"
  const [saveState, setSaveState] = useState("loading");
  const [loadFailed, setLoadFailed] = useState(false);
  const [lastSavedAt, setLastSavedAt] = useState(null);
  const [isDirty, setIsDirty] = useState(false);
  const saveTimer = useRef(null);

  const loadFromSupabase = useCallback(async () => {
    setSaveState("loading");
    setLoadFailed(false);
    try {
      const corrections = await loadCorrectionsFromSupabase();
      if (corrections && Object.keys(corrections).length > 0) {
        const { merged, toResync } = mergeCorrections(INITIAL_QS, corrections);
        setQs(merged);
        setOpenSet(new Set(merged.filter(q => !q.approved).map(q => q.nr)));
        if (toResync.length > 0) {
          // Fragen, deren Code-Inhalt seit der letzten Speicherung korrigiert wurde:
          // frischen Stand in die DB zurueckschreiben, damit alte Tags nicht wieder auftauchen.
          const freshQs = merged.filter(q => toResync.includes(q.nr));
          const resyncCorrections = buildCorrections(freshQs);
          await saveCorrectionsToSupabase(resyncCorrections);
        }
      } else {
        // Datenbank WIRKLICH leer (Anfrage war erfolgreich, ergab aber 0 Zeilen) ->
        // aktuellen Stand aus dem Code als Erstbefuellung hochladen. Dies passiert nur,
        // wenn das Laden selbst erfolgreich war - nie bei einem Netzwerk-/Serverfehler.
        const seed = buildCorrections(INITIAL_QS);
        await saveCorrectionsToSupabase(seed);
      }
      setSaveState("idle");
      setIsDirty(false);
    } catch (e) {
      // Laden ist fehlgeschlagen: NIE mit dem Code-Basis-Stand weiterarbeiten und niemals
      // automatisch speichern, sonst wuerden echte Daten in der DB ueberschrieben.
      setLoadFailed(true);
      setSaveState("load_error");
    }
  }, []);

  useEffect(() => { loadFromSupabase(); }, [loadFromSupabase]);

  const [saveErrorDetail, setSaveErrorDetail] = useState("");

  const persist = useCallback(async (currentQs) => {
    if (loadFailed) {
      // Sicherheitssperre: solange der letzte Ladevorgang fehlgeschlagen ist, NIE speichern -
      // das wuerde sonst den (moeglicherweise veralteten) lokalen Stand in die DB schreiben
      // und echte Daten ueberschreiben.
      setSaveState("load_error");
      return;
    }
    setSaveState("saving");
    try {
      const corrections = buildCorrections(currentQs);
      const result = await saveCorrectionsToSupabase(corrections);
      if (!result.ok) {
        setSaveErrorDetail("HTTP " + result.status + ": " + (result.detail || "").slice(0, 300));
        throw new Error("Speichern fehlgeschlagen");
      }
      setSaveErrorDetail("");
      setSaveState("saved");
      setLastSavedAt(new Date());
      setIsDirty(false);
    } catch (e) {
      if (!saveErrorDetail) setSaveErrorDetail(String(e && e.message ? e.message : e));
      setSaveState("error");
    }
  }, [loadFailed]);

  const updateQ = useCallback((nr, patch) => {
    setIsDirty(true);
    setQs(prev => {
      const next = prev.map(q => q.nr === nr ? { ...q, ...patch } : q);
      if (saveTimer.current) clearTimeout(saveTimer.current);
      saveTimer.current = setTimeout(() => persist(next), 700);
      return next;
    });
    if (patch.approved === true)
      setOpenSet(prev => { const s = new Set(prev); s.delete(nr); return s; });
    else if (patch.approved === false)
      setOpenSet(prev => new Set([...prev, nr]));
  }, [persist]);

  const saveNow = useCallback(() => {
    if (saveTimer.current) clearTimeout(saveTimer.current);
    persist(qs);
  }, [qs, persist]);

  const download = useCallback(() => {
    const blob = new Blob([JSON.stringify(qs, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "fdv_korrekturen.json";
    a.click();
    URL.revokeObjectURL(url);
  }, [qs]);

  // Export ueber Dialog: auf dem Handy funktioniert der Blob-Download in vielen
  // Browsern/WebViews nicht. Kopieren in die Zwischenablage bzw. das native
  // Teilen-Menue funktionieren dagegen zuverlaessig.
  const [exportOpen, setExportOpen] = useState(false);
  const [exportText, setExportText] = useState("");
  const [exportRange, setExportRange] = useState(null); // z.B. [1,50]
  const [copyState, setCopyState]   = useState("idle"); // idle | copied | error
  const exportRef = useRef(null);

  // Link-Generator fuer Claude: baut die Datenbank-Abfrage-URL mit einem
  // Zeitstempel als Anti-Cache-Parameter, damit jede erzeugte Adresse garantiert
  // neu ist und nicht an einer alten, zwischengespeicherten Antwort haengenbleibt.
  const [claudeLinkOpen, setClaudeLinkOpen] = useState(false);
  const [claudeLink, setClaudeLink] = useState("");
  const [claudeLinkCopyState, setClaudeLinkCopyState] = useState("idle");
  const claudeLinkRef = useRef(null);

  const openClaudeLink = useCallback(() => {
    const url = SUPABASE_URL + "/rest/v1/rpc/get_all_reviews?apikey=" + SUPABASE_KEY + "&bust=" + Date.now();
    setClaudeLink(url);
    setClaudeLinkCopyState("idle");
    setClaudeLinkOpen(true);
  }, []);

  const copyClaudeLink = useCallback(() => {
    if (claudeLinkRef.current) {
      claudeLinkRef.current.select();
      try {
        navigator.clipboard.writeText(claudeLink);
        setClaudeLinkCopyState("copied");
      } catch (e) {
        setClaudeLinkCopyState("error");
      }
    }
  }, [claudeLink]);

  const EXPORT_RANGES = [[1,50],[51,100],[101,150],[151,200]];

  const openExport = useCallback(() => {
    setExportRange(null);
    setExportText("");
    setCopyState("idle");
    setExportOpen(true);
  }, []);

  const chooseExportRange = useCallback((minNr, maxNr) => {
    setExportRange([minNr, maxNr]);
    setExportText(JSON.stringify(buildCorrections(qs, minNr, maxNr), null, 2));
    setCopyState("idle");
  }, [qs]);

  useEffect(() => {
    if (exportOpen && exportRange && exportRef.current) {
      exportRef.current.focus();
      exportRef.current.select();
    }
  }, [exportOpen, exportRange]);

  const copyExport = useCallback(async () => {
    try {
      await navigator.clipboard.writeText(exportText);
      setCopyState("copied");
      return;
    } catch (e) { /* Clipboard-API evtl. nicht erlaubt - Fallback unten */ }
    try {
      exportRef.current && exportRef.current.select();
      const ok = document.execCommand("copy");
      setCopyState(ok ? "copied" : "error");
    } catch (e) {
      setCopyState("error");
    }
  }, [exportText]);

  const canShare = typeof navigator !== "undefined" && !!navigator.share;
  const shareExport = useCallback(async () => {
    try {
      await navigator.share({ title: "FDV Korrekturen", text: exportText });
    } catch (e) { /* abgebrochen oder nicht unterstuetzt - ignorieren */ }
  }, [exportText]);

  // Import: verlaesslichster Weg, Korrekturen ueber Sitzungen/neu geoeffnete
  // Dateien hinweg zu uebernehmen, unabhaengig davon ob der automatische
  // Speicher (window.storage) fuer diese Artefakt-Instanz greift.
  const [importOpen, setImportOpen] = useState(false);
  const [importText, setImportText] = useState("");
  const [importState, setImportState] = useState("idle"); // idle | applied | error

  const openImport = useCallback(() => {
    setImportText("");
    setImportState("idle");
    setImportOpen(true);
  }, []);

  const applyImport = useCallback(() => {
    try {
      const corrections = JSON.parse(importText);
      setQs(prev => {
        const { merged } = mergeCorrections(prev, corrections);
        setOpenSet(new Set(merged.filter(q => !q.approved).map(q => q.nr)));
        persist(merged);
        return merged;
      });
      setImportState("applied");
    } catch (e) {
      setImportState("error");
    }
  }, [importText, persist]);

  const visible = qs.filter(q => {
    if (search && !q.term.toLowerCase().includes(search.toLowerCase())
        && !String(q.nr).includes(search)) return false;
    if (filterOpen   && q.approved)    return false;
    if (filterIssues && !hasIssues(q)) return false;
    if (filterPrio   && q.p !== filterPrio) return false;
    return true;
  });

  const grpA = visible.filter(q => q.nr <= 81);
  const grpB = visible.filter(q => q.nr >= 82);

  const totalOpen     = qs.filter(q => !q.approved).length;
  const totalApproved = qs.filter(q =>  q.approved).length;
  const totalIssues   = qs.filter(hasIssues).length;

  const toggle = (nr) => setOpenSet(prev => {
    const s = new Set(prev); s.has(nr) ? s.delete(nr) : s.add(nr); return s;
  });

  const FBtn = ({ active, bg, col, bdr, onClick, children }) => (
    <button onClick={onClick} style={{
      padding:"7px 14px", borderRadius:8, fontSize:12, fontWeight:600, cursor:"pointer",
      background: active ? bg   : "#f4f5f7",
      color:      active ? col  : "#666",
      border:     active ? "1.5px solid " + bdr : "1px solid rgba(0,0,0,0.10)",
    }}>{children}</button>
  );

  return (
    <div style={{ fontFamily:"-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif",
      background:"#f4f5f7", minHeight:"100vh" }}>

      <div style={{ background:"#1a3a6b", color:"#fff", padding:"14px 20px",
        display:"flex", alignItems:"center", gap:14, flexWrap:"wrap" }}>
        <div>
          <div style={{ fontWeight:700, fontSize:16 }}>FDV R 300.1 - Frageneinstellungen</div>
          <div style={{ fontSize:12, opacity:0.75, marginTop:2 }}>
            {qs.length} Fragen - {totalApproved} geprueft OK - {totalOpen} offen - {totalIssues} mit Korrekturen
          </div>
        </div>
        <div style={{ flex:1 }} />

        <div style={{ display:"flex", alignItems:"center", gap:8, fontSize:12, opacity:0.9, minWidth:170, textAlign:"right", justifyContent:"flex-end" }}>
          <span style={{
            display:"inline-block", width:10, height:10, borderRadius:"50%", flexShrink:0,
            background:
              saveState === "load_error" ? "#b83030" :
              saveState === "error" ? "#b83030" :
              saveState === "loading" ? "#999" :
              saveState === "saving" ? "#e8860a" :
              isDirty ? "#e8860a" : "#2fa84f",
          }} />
          <span>
            {saveState === "loading" && "Lade gespeicherten Stand..."}
            {saveState === "load_error" && "⚠ Laden fehlgeschlagen - nicht speicherbar"}
            {saveState === "saving" && "Speichert..."}
            {saveState === "error" && "⚠ Fehler beim Speichern"}
            {(saveState === "saved" || saveState === "idle") && !isDirty && lastSavedAt &&
              ("✓ Gespeichert um " + lastSavedAt.toLocaleTimeString("de-CH", {hour:"2-digit", minute:"2-digit", second:"2-digit"}))}
            {(saveState === "saved" || saveState === "idle") && !isDirty && !lastSavedAt && "✓ Aktuell"}
            {(saveState === "saved" || saveState === "idle") && isDirty && "Ungespeicherte Änderungen..."}
          </span>
        </div>

        {saveState === "load_error" ? (
          <button onClick={loadFromSupabase} style={{
            padding:"8px 20px", borderRadius:8, border:"none", fontWeight:700,
            fontSize:13, cursor:"pointer", background:"#b83030", color:"#fff",
          }}>
            Erneut laden
          </button>
        ) : (
          <button onClick={saveNow} disabled={saveState === "saving"} style={{
            padding:"8px 20px", borderRadius:8, border:"none", fontWeight:700,
            fontSize:13, cursor: saveState === "saving" ? "default" : "pointer",
            background: saveState === "error" ? "#b83030" : "#e8860a", color:"#fff",
            opacity: saveState === "saving" ? 0.7 : 1,
          }}>
            {saveState === "error" ? "Erneut speichern" : "Jetzt speichern"}
          </button>
        )}

        <button onClick={openClaudeLink} title="Adresse für Claude generieren (immer neu, kein Cache)" style={{
          padding:"8px 16px", borderRadius:8, fontWeight:600,
          fontSize:13, cursor:"pointer", background:"transparent", color:"#fff",
          border:"1.5px solid rgba(255,255,255,0.5)",
        }}>🔗 Link für Claude</button>

        <button onClick={openImport} title="Zuvor exportierte Korrekturen einspielen" style={{
          padding:"8px 16px", borderRadius:8, fontWeight:600,
          fontSize:13, cursor:"pointer", background:"transparent", color:"#fff",
          border:"1.5px solid rgba(255,255,255,0.5)",
        }}>Import</button>

        <button onClick={openExport} title="Korrekturen zum Kopieren/Teilen anzeigen" style={{
          padding:"8px 16px", borderRadius:8, fontWeight:600,
          fontSize:13, cursor:"pointer", background:"transparent", color:"#fff",
          border:"1.5px solid rgba(255,255,255,0.5)",
        }}>Export</button>
      </div>

      {saveState === "error" && saveErrorDetail && (
        <div style={{ background:"#fbeaea", color:"#7a1f1f", padding:"8px 20px",
          fontSize:12, fontFamily:"monospace", wordBreak:"break-word",
          borderBottom:"1px solid rgba(0,0,0,0.08)" }}>
          Speicherfehler-Detail: {saveErrorDetail}
        </div>
      )}

      <div style={{ background:"#fff", borderBottom:"1px solid rgba(0,0,0,0.10)",
        padding:"10px 20px", display:"flex", gap:8, alignItems:"center", flexWrap:"wrap" }}>
        <input value={search} onChange={e => setSearch(e.target.value)}
          placeholder="Suche nach Begriff oder Nr."
          style={{ padding:"7px 12px", borderRadius:8,
            border:"1px solid rgba(0,0,0,0.10)", fontSize:13,
            outline:"none", minWidth:210 }} />
        <FBtn active={filterOpen} bg="#fbeaea" col="#b83030" bdr="#b83030"
          onClick={() => setFilterOpen(v => !v)}>
          Noch offen ({totalOpen})
        </FBtn>
        <FBtn active={filterIssues} bg="#fff3e0" col="#a05000" bdr="#e8860a"
          onClick={() => setFilterIssues(v => !v)}>
          Mit Korrekturen ({totalIssues})
        </FBtn>
        {PRIO.map(opt => (
          <FBtn key={opt.value}
            active={filterPrio === opt.value}
            bg={opt.bg} col={opt.color} bdr={opt.color}
            onClick={() => setFilterPrio(filterPrio === opt.value ? 0 : opt.value)}>
            {opt.label}
          </FBtn>
        ))}
        {(search || filterOpen || filterIssues || filterPrio > 0) && (
          <button onClick={() => { setSearch(""); setFilterOpen(false);
            setFilterIssues(false); setFilterPrio(0); }} style={{
            padding:"7px 12px", borderRadius:8, fontSize:12, cursor:"pointer",
            background:"#f4f5f7", color:"#666", border:"1px solid rgba(0,0,0,0.10)" }}>
            Zuruecksetzen
          </button>
        )}
        <div style={{ marginLeft:"auto", fontSize:12, color:"#666" }}>
          {visible.length} von {qs.length}
        </div>
      </div>

      <div style={{ maxWidth:840, margin:"0 auto", padding:"16px 16px 40px" }}>

        {grpA.length > 0 && (
          <div>
            <div style={{ fontSize:11, fontWeight:700, color:"#fff",
              background:"#1a3a6b", padding:"6px 14px", borderRadius:8,
              marginBottom:10, display:"inline-block" }}>
              GRUPPE A - BEGRIFFE (Ziff. 2.5.2) - Fragen 1-81
            </div>
            {grpA.map(q => (
              <QuestionRow key={q.nr} q={q}
                open={openSet.has(q.nr)}
                onToggle={() => toggle(q.nr)}
                onChange={patch => updateQ(q.nr, patch)} />
            ))}
          </div>
        )}

        {grpB.length > 0 && (
          <div style={{ marginTop:16 }}>
            <div style={{ fontSize:11, fontWeight:700, color:"#fff",
              background:"#1a3a6b", padding:"6px 14px", borderRadius:8,
              marginBottom:10, display:"inline-block" }}>
              GRUPPE B - ZIFFERN 2.1-2.11 - Fragen 82-96
            </div>
            {grpB.map(q => (
              <QuestionRow key={q.nr} q={q}
                open={openSet.has(q.nr)}
                onToggle={() => toggle(q.nr)}
                onChange={patch => updateQ(q.nr, patch)} />
            ))}
          </div>
        )}

        {visible.length === 0 && (
          <div style={{ textAlign:"center", color:"#666", padding:60, fontSize:15 }}>
            Keine Fragen gefunden.
          </div>
        )}

        <div style={{ marginTop:24, padding:"14px 16px", borderRadius:10,
          background:"#e8eef7", color:"#1a3a6b", fontSize:13, lineHeight:1.6 }}>
          Deine Aenderungen werden jetzt direkt in einer gemeinsamen Online-Datenbank
          gespeichert (kurz nach jeder Anpassung) - geraeteuebergreifend und dauerhaft,
          kein Export/Import mehr noetig. "Export" bleibt als Kopiermoeglichkeit erhalten,
          falls du den aktuellen Stand mal manuell weitergeben willst.
        </div>
      </div>

      {exportOpen && (
        <div onClick={() => setExportOpen(false)} style={{
          position:"fixed", inset:0, background:"rgba(0,0,0,0.55)",
          display:"flex", alignItems:"center", justifyContent:"center",
          zIndex:1000, padding:16 }}>
          <div onClick={e => e.stopPropagation()} style={{
            background:"#fff", borderRadius:12, padding:20, width:"100%",
            maxWidth:560, maxHeight:"82vh", display:"flex", flexDirection:"column" }}>

            <div style={{ fontWeight:700, fontSize:15, color:"#1a3a6b", marginBottom:6 }}>
              Korrekturen exportieren
            </div>
            <div style={{ fontSize:12, color:"#666", marginBottom:10, lineHeight:1.5 }}>
              Der direkte Datei-Download funktioniert auf dem Handy oft nicht, und ein
              Export mit allen Fragen auf einmal kann beim Kopieren abgeschnitten werden.
              Wähle einen Bereich, kopiere ihn, schick ihn ab - dann den nächsten Bereich.
            </div>

            <div style={{ display:"flex", gap:8, marginBottom:12, flexWrap:"wrap" }}>
              {EXPORT_RANGES.map(([lo, hi]) => {
                const active = exportRange && exportRange[0] === lo && exportRange[1] === hi;
                const count = qs.filter(q => q.nr >= lo && q.nr <= hi).length;
                if (count === 0) return null;
                return (
                  <button key={lo} onClick={() => chooseExportRange(lo, hi)} style={{
                    padding:"9px 16px", borderRadius:8, fontWeight:700, fontSize:13,
                    cursor:"pointer", border: active ? "none" : "1px solid rgba(0,0,0,0.15)",
                    background: active ? "#1a3a6b" : "#f4f5f7",
                    color: active ? "#fff" : "#1a3a6b" }}>
                    Export {lo}-{hi}
                  </button>
                );
              })}
            </div>

            {exportRange ? (
              <>
                <textarea ref={exportRef} readOnly value={exportText}
                  onFocus={e => e.target.select()}
                  style={{ flex:1, minHeight:220, fontFamily:"monospace", fontSize:11,
                    padding:10, borderRadius:8, border:"1px solid rgba(0,0,0,0.15)",
                    resize:"none", background:"#fafafa", color:"#1a1a1a" }} />

                <div style={{ display:"flex", gap:8, marginTop:14, flexWrap:"wrap" }}>
                  <button onClick={copyExport} style={{
                    padding:"9px 16px", borderRadius:8, border:"none", fontWeight:700,
                    fontSize:13, cursor:"pointer", color:"#fff",
                    background: copyState === "error" ? "#b83030" : "#1a7a3c" }}>
                    {copyState === "copied" ? "✓ Kopiert"
                      : copyState === "error" ? "Fehler - Text oben manuell markieren"
                      : "In Zwischenablage kopieren"}
                  </button>
                  {canShare && (
                    <button onClick={shareExport} style={{
                      padding:"9px 16px", borderRadius:8, fontWeight:600, fontSize:13,
                      cursor:"pointer", background:"#e8eef7", color:"#1a3a6b",
                      border:"1px solid rgba(0,0,0,0.10)" }}>
                      Teilen
                    </button>
                  )}
                  <button onClick={download} style={{
                    padding:"9px 16px", borderRadius:8, fontWeight:600, fontSize:13,
                    cursor:"pointer", background:"#f4f5f7", color:"#666",
                    border:"1px solid rgba(0,0,0,0.10)" }}>
                    Als Datei (Desktop)
                  </button>
                </div>
              </>
            ) : (
              <div style={{ flex:1, display:"flex", alignItems:"center", justifyContent:"center",
                color:"#999", fontSize:13, minHeight:120 }}>
                Bitte zuerst einen Bereich wählen.
              </div>
            )}

            <div style={{ display:"flex", marginTop:14 }}>
              <div style={{ flex:1 }} />
              <button onClick={() => setExportOpen(false)} style={{
                padding:"9px 16px", borderRadius:8, fontWeight:600, fontSize:13,
                cursor:"pointer", background:"transparent", color:"#666",
                border:"1px solid rgba(0,0,0,0.10)" }}>
                Schliessen
              </button>
            </div>
          </div>
        </div>
      )}

      {importOpen && (
        <div onClick={() => setImportOpen(false)} style={{
          position:"fixed", inset:0, background:"rgba(0,0,0,0.55)",
          display:"flex", alignItems:"center", justifyContent:"center",
          zIndex:1000, padding:16 }}>
          <div onClick={e => e.stopPropagation()} style={{
            background:"#fff", borderRadius:12, padding:20, width:"100%",
            maxWidth:560, maxHeight:"82vh", display:"flex", flexDirection:"column" }}>

            <div style={{ fontWeight:700, fontSize:15, color:"#1a3a6b", marginBottom:6 }}>
              Korrekturen importieren
            </div>
            <div style={{ fontSize:12, color:"#666", marginBottom:10, lineHeight:1.5 }}>
              Fuege hier den zuvor exportierten Korrekturen-Text ein. Er wird ueber die
              aktuelle Fragenliste gelegt - bereits vorhandene Bewertungen zu denselben
              Fragen werden dabei ueberschrieben.
            </div>

            <textarea value={importText}
              onChange={e => { setImportText(e.target.value); setImportState("idle"); }}
              placeholder="Hier den kopierten JSON-Text einfuegen ..."
              style={{ flex:1, minHeight:220, fontFamily:"monospace", fontSize:11,
                padding:10, borderRadius:8, border:"1px solid rgba(0,0,0,0.15)",
                resize:"none", background:"#fafafa", color:"#1a1a1a" }} />

            {importState === "error" && (
              <div style={{ marginTop:8, fontSize:12, color:"#b83030" }}>
                Das sieht nicht nach gueltigem JSON aus. Bitte den kompletten Text aus dem
                Export-Dialog einfuegen.
              </div>
            )}
            {importState === "applied" && (
              <div style={{ marginTop:8, fontSize:12, color:"#1a7a3c" }}>
                ✓ Korrekturen uebernommen.
              </div>
            )}

            <div style={{ display:"flex", gap:8, marginTop:14, flexWrap:"wrap" }}>
              <button onClick={applyImport} disabled={!importText.trim()} style={{
                padding:"9px 16px", borderRadius:8, border:"none", fontWeight:700,
                fontSize:13, cursor: importText.trim() ? "pointer" : "default",
                color:"#fff", background:"#1a7a3c",
                opacity: importText.trim() ? 1 : 0.5 }}>
                Anwenden
              </button>
              <div style={{ flex:1 }} />
              <button onClick={() => setImportOpen(false)} style={{
                padding:"9px 16px", borderRadius:8, fontWeight:600, fontSize:13,
                cursor:"pointer", background:"transparent", color:"#666",
                border:"1px solid rgba(0,0,0,0.10)" }}>
                Schliessen
              </button>
            </div>
          </div>
        </div>
      )}

      {claudeLinkOpen && (
        <div onClick={() => setClaudeLinkOpen(false)} style={{
          position:"fixed", inset:0, background:"rgba(0,0,0,0.55)",
          display:"flex", alignItems:"center", justifyContent:"center",
          zIndex:1000, padding:16 }}>
          <div onClick={e => e.stopPropagation()} style={{
            background:"#fff", borderRadius:12, padding:20, width:"100%",
            maxWidth:560, display:"flex", flexDirection:"column" }}>

            <div style={{ fontWeight:700, fontSize:15, color:"#1a3a6b", marginBottom:6 }}>
              Adresse für Claude
            </div>
            <div style={{ fontSize:12, color:"#666", marginBottom:10, lineHeight:1.5 }}>
              Diese Adresse enthaelt immer eine neue, einmalige Zahl am Ende, damit Claude
              nicht an einer alten zwischengespeicherten Antwort haengen bleibt. Kopieren
              und Claude schicken.
            </div>

            <textarea ref={claudeLinkRef} readOnly value={claudeLink}
              onClick={e => e.target.select()}
              style={{ minHeight:80, fontFamily:"monospace", fontSize:11,
                padding:10, borderRadius:8, border:"1px solid rgba(0,0,0,0.15)",
                resize:"none", background:"#fafafa", color:"#1a1a1a" }} />

            {claudeLinkCopyState === "copied" && (
              <div style={{ marginTop:8, fontSize:12, color:"#1a7a3c" }}>
                ✓ In die Zwischenablage kopiert.
              </div>
            )}
            {claudeLinkCopyState === "error" && (
              <div style={{ marginTop:8, fontSize:12, color:"#b83030" }}>
                Kopieren hat nicht geklappt - bitte den Text oben manuell markieren und kopieren.
              </div>
            )}

            <div style={{ display:"flex", gap:8, marginTop:14, flexWrap:"wrap" }}>
              <button onClick={copyClaudeLink} style={{
                padding:"9px 16px", borderRadius:8, border:"none", fontWeight:700,
                fontSize:13, cursor:"pointer", color:"#fff", background:"#1a7a3c" }}>
                Kopieren
              </button>
              <button onClick={openClaudeLink} title="Neue Zahl generieren" style={{
                padding:"9px 16px", borderRadius:8, fontWeight:600, fontSize:13,
                cursor:"pointer", background:"transparent", color:"#1a3a6b",
                border:"1px solid rgba(0,0,0,0.15)" }}>
                🔄 Neu generieren
              </button>
              <div style={{ flex:1 }} />
              <button onClick={() => setClaudeLinkOpen(false)} style={{
                padding:"9px 16px", borderRadius:8, fontWeight:600, fontSize:13,
                cursor:"pointer", background:"transparent", color:"#666",
                border:"1px solid rgba(0,0,0,0.10)" }}>
                Schliessen
              </button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
<script>
  var sourceEl = document.getElementById('app-source');
  var source = sourceEl.textContent;
  var output = Babel.transform(source, {
    presets: [["react", { runtime: "classic" }]],
    filename: "app.jsx"
  }).code;
  (0, eval)(output);
</script>
</body>
</html>
