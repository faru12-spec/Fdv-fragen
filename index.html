// Supabase-Anbindung: gemeinsamer Speicher statt lokalem window.storage,
// damit Korrekturen geraeteuebergreifend und ohne Export/Import synchron bleiben.
const SUPABASE_URL = "https://vvahjifduqicgiobiyxq.supabase.co";
const SUPABASE_KEY = "sb_publishable_WOoNJ3rc-kKemZp2cYSz4g_hMgkZgWh";
const SUPABASE_HEADERS = {
  "apikey": SUPABASE_KEY,
  "Authorization": "Bearer " + SUPABASE_KEY,
  "Content-Type": "application/json",
};

// Laedt alle gespeicherten Zeilen aus Supabase und baut daraus dasselbe
// "corrections"-Objekt (keyed by nr), das buildCorrections/mergeCorrections erwarten.
async function loadCorrectionsFromSupabase() {
  const res = await fetch(
    SUPABASE_URL + "/rest/v1/question_review?select=nr,approved,p,note,opt_tags,opt_notes",
    { headers: SUPABASE_HEADERS }
  );
  if (!res.ok) throw new Error("Supabase Ladefehler: " + res.status);
  const rows = await res.json();
  const out = {};
  rows.forEach(r => {
    out[r.nr] = {
      approved: r.approved,
      p: r.p,
      note: r.note,
      optTags: r.opt_tags,
      optNotes: r.opt_notes,
    };
  });
  return out;
}

// Speichert die uebergebenen Korrekturen als Upsert (ein Request pro Frage-Batch).
// Gibt bei Fehlern die genaue Serverantwort zurueck, damit sie in der App sichtbar gemacht werden kann.
async function saveCorrectionsToSupabase(corrections) {
  const rows = Object.keys(corrections).map(nr => ({
    nr: parseInt(nr, 10),
    approved: corrections[nr].approved,
    p: corrections[nr].p,
    note: corrections[nr].note,
    opt_tags: corrections[nr].optTags,
    opt_notes: corrections[nr].optNotes,
  }));
  if (rows.length === 0) return { ok: true };
  const res = await fetch(SUPABASE_URL + "/rest/v1/question_review", {
    method: "POST",
    headers: { "apikey": SUPABASE_KEY, "Content-Type": "application/json", "Prefer": "resolution=merge-duplicates" },
    body: JSON.stringify(rows),
  });
  if (res.ok) return { ok: true };
  let detail = "";
  try { detail = await res.text(); } catch (e) {}
  return { ok: false, status: res.status, detail };
}

// Nur die tatsaechlichen Aenderungen pro Frage sichern (nicht den ganzen Fragenkatalog).
// So bleiben die eigenen Korrekturen auch erhalten, wenn sich INITIAL_QS spaeter aendert
// (z.B. weil eine neue Version der Datei mit anderen/weiteren Fragen erstellt wird).
function buildCorrections(qs, minNr, maxNr) {
  const out = {};
  qs.forEach(q => {
    if (minNr != null && (q.nr < minNr || q.nr > maxNr)) return;
    const touched =
      q.approved ||
      q.p !== 1 ||
      q.note.trim() !== "" ||
      Object.values(q.optTags).some(a => a.length > 0) ||
      Object.values(q.optNotes || {}).some(n => n.trim() !== "");
    if (touched) {
      out[q.nr] = {
        approved: q.approved,
        p: q.p,
        note: q.note,
        optTags: q.optTags,
        optNotes: q.optNotes,
      };
    }
  });
  return out;
}

function mergeCorrections(baseQs, corrections) {
  if (!corrections) return baseQs;
  return baseQs.map(q => {
    const c = corrections[q.nr];
    return c ? { ...q, ...c } : q;
  });
}

ausschliesslich innerhalb von Tunneln, der durch Personal zum Aufenthalt genutzt werden darf.","c":false},{"l":"C","t":"Jeder unbefestigte Streifen entlang des Gleises, unabhängig von seiner Beschaffenheit.","c":false},{"l":"D","t":"Ein Weg im Gleisbereich, der ausschliesslich mit Schotter befestigt ist.","c":false}],"fdv":"Gehweg: ein Weg im Gleisbereich ausserhalb von Tunnel, der durch Personal zum Aufenthalt oder Arbeiten genutzt werden darf. Er ist auf Grund seiner Beschaffenheit (feiner Kies bzw. Sand oder asphaltiert, d.h. ohne Schotter) eindeutig erkennbar.","note":"","optTags":{"A":[],"B":[],"C":[],"D":[]},"optNotes":{"A":"","B":"","C":"","D":""}},{"nr":179,"p":1,"term":"Anschlussgleisbetreiberin","approved":false,"q":"Was ist die «Anschlussgleisbetreiberin» gemäss FDV R 300.1, Ziff. 2.5.2?","opts":[{"l":"A","t":"EBU, das eine Eisenbahninfrastruktur betreibt.","c":false},{"l":"B","t":"Der Anschliesser, der für den infrastrukturseitigen Betrieb des Anschlussgleises verantwortlich ist.","c":true},{"l":"C","t":"EVU, welches den Netzzugang auf einer Infrastruktur beansprucht.","c":false},{"l":"D","t":"Der Anschliesser, der ausschliesslich für den Gütertransport auf dem Anschlussgleis verantwortlich ist.","c":false}],"fdv":"Anschlussgleisbetreiberin: der Anschliesser, der für den infrastrukturseitigen Betrieb des Anschlussgleises verantwortlich ist.","note":"","optTags":{"A":[],"B":[],"C":[],"D":[]},"optNotes":{"A":"","B":"","C":"","D":""}},{"nr":180,"p":1,"term":"Arbeitsstellen-Koordinator (AKO)","approved":false,"q":"Was gilt für den «Arbeitsstellen-Koordinator/in (AKO)» gemäss FDV R 300.1, Ziff. 2.5.2?","opts":[{"l":"A","t":"Befinden sich in gesperrten Gleisen mehrere Arbeitsstellen, kann ein SC als AKO eingesetzt werden.","c":true},{"l":"B","t":"Der AKO ist ausschliesslich für die Koordination zwischen zwei benachbarten Bahnhöfen zuständig.","c":false},{"l":"C","t":"Befinden sich in einem gesperrten Gleis mehrere Arbeitsstellen, muss zwingend für jede ein eigener SC eingesetzt werden.","c":false},{"l":"D","t":"Der AKO ersetzt den Fahrdienstleiter bei Arbeiten im Gleisbereich.","c":false}],"fdv":"Arbeitsstellen-Koordinator/in (AKO): befinden sich in gesperrten Gleisen mehrere Arbeitsstellen, kann ein SC als AKO eingesetzt werden.","note":"","optTags":{"A":[],"B":[],"C":[],"D":[]},"optNotes":{"A":"","B":"","C":"","D":""}},{"nr":181,"p":1,"term":"Driver Machine Interface (DMI)","approved":false,"q":"Was ist das «Driver Machine Interface (DMI)» gemäss FDV R 300.1, Ziff. 2.5.2?","opts":[{"l":"A","t":"Bedien- und Anzeigeelement (Mensch-Maschine-Schnittstelle; MMI), unabhängig vom Standort im Fahrzeug.","c":false},{"l":"B","t":"Bedien- und Anzeigeelement im Führerstand.","c":true},{"l":"C","t":"Die Einrichtung auf dem Triebfahrzeug zur Abgabe von akustischen Signalen.","c":false},{"l":"D","t":"Bedien- und Anzeigeelement ausserhalb des Führerstands, z.B. im Passagierraum.","c":false}],"fdv":"Driver Machine Interface (DMI): Bedien- und Anzeigeelement im Führerstand.","note":"","optTags":{"A":[],"B":[],"C":[],"D":[]},"optNotes":{"A":"","B":"","C":"","D":""}},{"nr":182,"p":1,"term":"Gestörter Abschnitt","approved":false,"q":"Was ist ein «Gestörter Abschnitt» gemäss FDV R 300.1, Ziff. 2.5.2?","opts":[{"l":"A","t":"Ein Fahrweg, welcher durch ein gestörtes Element der Sicherungsanlage beeinflusst wird oder in welchem sich ein mittels Notbedienung in Grundstellung verbrachtes Element der Sicherungsanlage befindet. Dieser entspricht der Fahrstrasse, welche im Regelbetrieb ohne Notbedienung eingestellt werden kann. Er ist durch den FDL für jede Fahrt erneut zu bestimmen.","c":true},{"l":"B","t":"Jeder Fahrweg, der nach einer Störung dauerhaft für den Betrieb gesperrt bleibt.","c":false},{"l":"C","t":"Ein Fahrweg, welcher durch ein gestörtes Element der Sicherungsanlage beeinflusst wird und einmalig durch den FDL bestimmt und danach nicht mehr verändert wird.","c":false},{"l":"D","t":"Ein Fahrweg, welcher ausschliesslich durch Notbedienung eingestellt werden kann, unabhängig vom Regelbetrieb.","c":false}],"fdv":"Gestörter Abschnitt: ein Fahrweg, welcher durch ein gestörtes Element der Sicherungsanlage beeinflusst wird oder in welchem sich ein mittels Notbedienung in Grundstellung verbrachtes Element der Sicherungsanlage befindet. Dieser entspricht der Fahrstrasse, welche im Regelbetrieb ohne Notbedienung eingestellt werden kann. Er ist durch den FDL für jede Fahrt erneut zu bestimmen.","note":"","optTags":{"A":[],"B":[],"C":[],"D":[]},"optNotes":{"A":"","B":"","C":"","D":""}},{"nr":183,"p":1,"term":"Instruierte Person für elektrische Anlagen (IPEA)","approved":false,"q":"Was ist eine «Instruierte Person für elektrische Anlagen (IPEA)» gemäss FDV R 300.1, Ziff. 2.5.2?","opts":[{"l":"A","t":"Person mit Erfahrung im Umgang mit Starkstromanlagen, die Personen instruieren und ausbilden darf.","c":false},{"l":"B","t":"Person mit Berechtigung, um begrenzte, genau umschriebene Tätigkeiten in Starkstromanlagen auszuführen, gemäss Instruktion durch eine sachverständige Person. Sie kennt die örtlichen Verhältnisse und die zu treffenden Schutzmassnahmen.","c":true},{"l":"C","t":"Person, die für Schalthandlungen an elektrischen Anlagen instruiert oder sachverständig ist und diese immer im Auftrag ausführt.","c":false},{"l":"D","t":"Person mit unbeschränkter Berechtigung für sämtliche Tätigkeiten in Starkstromanlagen, ohne vorherige Instruktion.","c":false}],"fdv":"Instruierte Person für elektrische Anlagen (IPEA): Person mit Berechtigung, um begrenzte, genau umschriebene Tätigkeiten in Starkstromanlagen auszuführen, gemäss Instruktion durch eine sachverständige Person. Sie kennt die örtlichen Verhältnisse und die zu treffenden Schutzmassnahmen.","note":"","optTags":{"A":[],"B":[],"C":[],"D":[]},"optNotes":{"A":"","B":"","C":"","D":""}},{"nr":184,"p":1,"term":"Sachverständige Person für elektrische Anlagen (SPEA)","approved":false,"q":"Was ist eine «Sachverständige Person für elektrische Anlagen (SPEA)» gemäss FDV R 300.1, Ziff. 2.5.2?","opts":[{"l":"A","t":"Person mit Berechtigung, um begrenzte, genau umschriebene Tätigkeiten in Starkstromanlagen auszuführen, gemäss Instruktion durch eine andere Person.","c":false},{"l":"B","t":"Person, die für Schalthandlungen an elektrischen Anlagen instruiert oder sachverständig ist und diese immer im Auftrag ausführt, ausser in Notsituationen.","c":false},{"l":"C","t":"Person mit Erfahrung im Umgang mit Starkstromanlagen, kennt die örtlichen Verhältnisse und die zu treffenden Schutzmassnahmen. Sie kann z.B. als Betriebsinhaber, Anlageverantwortlicher, Arbeitsverantwortlicher oder Schaltberechtigte Person eingesetzt werden und darf Personen instruieren und ausbilden.","c":true},{"l":"D","t":"Person ohne praktische Erfahrung, die ausschliesslich theoretisch für Starkstromanlagen ausgebildet ist.","c":false}],"fdv":"Sachverständige Person für elektrische Anlagen (SPEA): Person mit Erfahrung im Umgang mit Starkstromanlagen, kennt die örtlichen Verhältnisse und die zu treffenden Schutzmassnahmen. Sie kann z.B. als Betriebsinhaber, Anlageverantwortlicher, Arbeitsverantwortlicher oder Schaltberechtigte Person eingesetzt werden und darf Personen instruieren und ausbilden.","note":"","optTags":{"A":[],"B":[],"C":[],"D":[]},"optNotes":{"A":"","B":"","C":"","D":""}},{"nr":185,"p":1,"term":"Schaltberechtigte Person","approved":false,"q":"Was gilt für die «Schaltberechtigte Person» gemäss FDV R 300.1, Ziff. 2.5.2?","opts":[{"l":"A","t":"Sie ist für Schalthandlungen an elektrischen Anlagen instruiert oder sachverständig. Sie führt Schalthandlungen immer im Auftrag aus, ausser in Notsituationen.","c":true},{"l":"B","t":"Sie darf Schalthandlungen ausschliesslich auf eigene Initiative ausführen, niemals im Auftrag.","c":false},{"l":"C","t":"Sie hat Erfahrung im Umgang mit Starkstromanlagen und darf Personen instruieren und ausbilden.","c":false},{"l":"D","t":"Sie darf begrenzte, genau umschriebene Tätigkeiten in Starkstromanlagen ausführen, gemäss Instruktion durch eine sachverständige Person.","c":false}],"fdv":"Schaltberechtigte Person: Person ist für Schalthandlungen an elektrischen Anlagen instruiert oder sachverständig. Sie führt Schalthandlungen immer im Auftrag aus, ausser in Notsituationen.","note":"","optTags":{"A":[],"B":[],"C":[],"D":[]},"optNotes":{"A":"","B":"","C":"","D":""}},{"nr":186,"p":1,"term":"Sicherheitsdispositiv (SIDI)","approved":false,"q":"Was ist das «Sicherheitsdispositiv (SIDI)» gemäss FDV R 300.1, Ziff. 2.5.2?","opts":[{"l":"A","t":"Festlegung der für eine Arbeitsstelle notwendigen Sicherheitsmassnahmen, sowie der durch die ISB in ihren Ausführungsbestimmungen vorgeschriebenen Angaben.","c":true},{"l":"B","t":"Die Stelle, die unter Verantwortung der ISB das SIDI mit den Sicherheitsmassnahmen vorschreibt und überwacht.","c":false},{"l":"C","t":"Verantwortliches Personal für die Durchführung der Sicherheitsmassnahmen auf der Arbeitsstelle.","c":false},{"l":"D","t":"Die einmalige, nicht anpassbare Festlegung der Sicherheitsmassnahmen zu Beginn einer Arbeitsstelle.","c":false}],"fdv":"Sicherheitsdispositiv (SIDI): Festlegung der für eine Arbeitsstelle notwendigen Sicherheitsmassnahmen, sowie der durch die ISB in ihren Ausführungsbestimmungen vorgeschriebenen Angaben.","note":"","optTags":{"A":[],"B":[],"C":[],"D":[]},"optNotes":{"A":"","B":"","C":"","D":""}},{"nr":187,"p":2,"term":"Begleitung der Züge (Ziff. 2.6.1)","approved":false,"q":"Was gilt gemäss FDV R 300.1, Ziff. 2.6.1 «Begleitung der Züge»?","opts":[{"l":"A","t":"Alle Züge müssen zwingend von einem Zugbegleiter/einer Zugbegleiterin (ZBE) begleitet werden.","c":false},{"l":"B","t":"Züge, welche die technischen Bedingungen erfüllen, verkehren in der Regel ohne ZBE. Die EVU bezeichnen in den Ausführungsbestimmungen die Züge, die begleitet werden.","c":true},{"l":"C","t":"Die Begleitung durch einen ZBE ist ausschliesslich dem Lokführer selbst überlassen, ohne Vorgaben des EVU.","c":false},{"l":"D","t":"Züge, welche die technischen Bedingungen erfüllen, verkehren immer mit ZBE, unabhängig von den Ausführungsbestimmungen des EVU.","c":false}],"fdv":"Begleitung der Züge: Züge, welche die technischen Bedingungen erfüllen, verkehren in der Regel ohne ZBE. Die EVU bezeichnen in den Ausführungsbestimmungen die Züge, die begleitet werden.","note":"","optTags":{"A":[],"B":[],"C":[],"D":[]},"optNotes":{"A":"","B":"","C":"","D":""}},{"nr":188,"p":1,"term":"Verzeichnis kilometrische Lage Bahnübergangsanlagen (Ziff. 2.6.2)","approved":false,"q":"Was gilt gemäss FDV R 300.1, Ziff. 2.6.2 zum «Verzeichnis über die kilometrische Lage der Bahnübergangsanlagen»?","opts":[{"l":"A","t":"Die EVU haben ein aktuelles Verzeichnis zu erstellen, das ausschliesslich dem Sicherheitschef zugänglich sein muss.","c":false},{"l":"B","t":"Die ISB haben ein aktuelles Verzeichnis über die kilometrische Lage der Bahnübergangsanlagen und deren Bahnübergänge zu erstellen. Mindestens dem FDL ist dieses Verzeichnis in geeigneter Weise zugänglich zu machen.","c":true},{"l":"C","t":"Ein solches Verzeichnis ist gesetzlich nicht vorgeschrieben, wird aber empfohlen.","c":false},{"l":"D","t":"Die ISB haben ein Verzeichnis zu erstellen, das jedoch nur bei Bedarf und ohne Zugänglichkeit für den FDL geführt wird.","c":false}],"fdv":"Verzeichnis über die kilometrische Lage der Bahnübergangsanlagen: die ISB haben ein aktuelles Verzeichnis über die kilometrische Lage der Bahnübergangsanlagen und deren Bahnübergänge zu erstellen. Mindestens dem FDL ist dieses Verzeichnis in geeigneter Weise zugänglich zu machen.","note":"","optTags":{"A":[],"B":[],"C":[],"D":[]},"optNotes":{"A":"","B":"","C":"","D":""}},{"nr":189,"p":2,"term":"Checklisten Fahrdienst - Anwendungspflicht (Ziff. 2.6.3)","approved":false,"q":"In welchen Fällen ist gemäss FDV R 300.1, Ziff. 2.6.3 das Erstellen und Anwenden der Checkliste Fahrdienst (CL-F) im Bahnbetrieb verbindlich?","opts":[{"l":"A","t":"Ausschliesslich bei der Behebung von Störungen, in keinem anderen Fall.","c":false},{"l":"B","t":"Wenn Rangierbewegungen auf die Strecke verkehren, zur Behebung von Störungen, beim Einführen/Aufheben von betrieblichen Sicherheitsmassnahmen bei Arbeiten im Gleisbereich, sowie in zusätzlichen vom EBU vorgeschriebenen Fällen.","c":true},{"l":"C","t":"Nur wenn der Fahrdienstleiter dies im Einzelfall als sinnvoll erachtet.","c":false},{"l":"D","t":"Ausschliesslich beim Einführen von Sicherheitsmassnahmen bei Arbeiten im Gleisbereich, in keinem anderen Fall.","c":false}],"fdv":"Checklisten Fahrdienst (CL-F): das Erstellen und Anwenden der CL-F ist im Bahnbetrieb verbindlich, wenn Rangierbewegungen auf die Strecke verkehren, zur Behebung von Störungen, zum Einführen/Aufheben von betrieblichen Sicherheitsmassnahmen bei Arbeiten im Gleisbereich, sowie in den zusätzlichen vom EBU vorgeschriebenen Fällen. Die FDV bilden die Grundlage für die Erstellung der CL-F.","note":"","optTags":{"A":[],"B":[],"C":[],"D":[]},"optNotes":{"A":"","B":"","C":"","D":""}},{"nr":190,"p":1,"term":"Energieeffizienz (Ziff. 2.6.4)","approved":false,"q":"Was gilt gemäss FDV R 300.1, Ziff. 2.6.4 «Energieeffizienz»?","opts":[{"l":"A","t":"Die ISB und die EVU unterstützen den wirtschaftlichen Einsatz von Energie, soweit die Sicherheit nicht negativ beeinflusst wird. Sie erlassen die dazu notwendigen Betriebsvorschriften.","c":true},{"l":"B","t":"Energieeffizienz hat immer Vorrang vor Sicherheitsüberlegungen.","c":false},{"l":"C","t":"Ausschliesslich die ISB sind für Energieeffizienz-Massnahmen zuständig, die EVU haben keine diesbezügliche Verantwortung.","c":false},{"l":"D","t":"Die ISB und die EVU unterstützen den wirtschaftlichen Einsatz von Energie unabhängig davon, ob die Sicherheit dadurch beeinflusst wird.","c":false}],"fdv":"Energieeffizienz: die ISB und die EVU unterstützen den wirtschaftlichen Einsatz von Energie, soweit die Sicherheit nicht negativ beeinflusst wird. Sie erlassen die dazu notwendigen Betriebsvorschriften.","note":"","optTags":{"A":[],"B":[],"C":[],"D":[]},"optNotes":{"A":"","B":"","C":"","D":""}},{"nr":191,"p":2,"term":"Abstimmung bei geteilten Funktionen (Ziff. 2.7)","approved":false,"q":"Was gilt gemäss FDV R 300.1, Ziff. 2.7, wenn fahrdienstliche Aufgaben einer Funktion durch verschiedene Personen wahrgenommen werden?","opts":[{"l":"A","t":"Die Beteiligten sprechen sich über die Ausgangslage, den Stand der Arbeit und das konkrete Vorgehen ab, insbesondere bei geographischer oder funktionaler Trennung der Zuständigkeiten sowie bei zeitlicher Staffelung.","c":true},{"l":"B","t":"Jede Person arbeitet unabhängig, eine Absprache ist nur bei zeitlicher Staffelung nötig.","c":false},{"l":"C","t":"Eine Absprache ist nur bei geographischer Trennung nötig, nicht bei funktionaler Trennung oder zeitlicher Staffelung.","c":false},{"l":"D","t":"Eine gegenseitige Absprache ist gesetzlich nicht vorgeschrieben, aber empfohlen.","c":false}],"fdv":"Einsatz und Verhalten des Personals: werden fahrdienstliche Aufgaben einer Funktion durch verschiedene Personen wahrgenommen, sprechen sich die Beteiligten über die Ausgangslage, den Stand der Arbeit und das konkrete Vorgehen ab. Dies gilt insbesondere bei geographischer oder funktionaler Trennung der Zuständigkeiten sowie bei zeitlicher Staffelung.","note":"","optTags":{"A":[],"B":[],"C":[],"D":[]},"optNotes":{"A":"","B":"","C":"","D":""}},{"nr":192,"p":2,"term":"Mehrere Funktionen durch eine Person (Ziff. 2.7)","approved":false,"q":"Was gilt gemäss FDV R 300.1, Ziff. 2.7, wenn mehrere Funktionen durch eine einzelne Person wahrgenommen werden?","opts":[{"l":"A","t":"Diese Person stellt die korrekte Ausführung aller betreffenden fahrdienstlichen Tätigkeiten sicher.","c":true},{"l":"B","t":"Diese Person darf nur eine der zugewiesenen Funktionen tatsächlich ausüben.","c":false},{"l":"C","t":"Es ist zwingend eine zweite Person beizuziehen, welche die korrekte Ausführung kontrolliert.","c":false},{"l":"D","t":"Die Verantwortung für die korrekte Ausführung verteilt sich automatisch auf alle beteiligten Stellen des EBU.","c":false}],"fdv":"Werden mehrere Funktionen durch eine einzelne Person wahrgenommen, stellt diese Person die korrekte Ausführung aller betreffenden fahrdienstlichen Tätigkeiten sicher.","note":"","optTags":{"A":[],"B":[],"C":[],"D":[]},"optNotes":{"A":"","B":"","C":"","D":""}},{"nr":193,"p":1,"term":"Dienstübergabe (Ziff. 2.7)","approved":false,"q":"Was gilt gemäss FDV R 300.1, Ziff. 2.7 bei der Dienstübergabe?","opts":[{"l":"A","t":"Die abtretende Person übergibt die erforderlichen Informationen an die nachfolgende. Erfolgt keine direkte Übergabe, sind Besonderheiten schriftlich zu vermitteln.","c":true},{"l":"B","t":"Eine Übergabe von Informationen ist nur bei direkter, mündlicher Übergabe vorgeschrieben; ohne direkten Kontakt entfällt sie.","c":false},{"l":"C","t":"Die nachfolgende Person ist verpflichtet, sich die notwendigen Informationen eigenständig zu beschaffen.","c":false},{"l":"D","t":"Besonderheiten müssen ausschliesslich mündlich, niemals schriftlich, vermittelt werden.","c":false}],"fdv":"Bei Dienstübergabe übergibt die abtretende Person die erforderlichen Informationen an die nachfolgende. Erfolgt keine direkte Übergabe, sind Besonderheiten schriftlich zu vermitteln.","note":"","optTags":{"A":[],"B":[],"C":[],"D":[]},"optNotes":{"A":"","B":"","C":"","D":""}},{"nr":194,"p":1,"term":"Arbeits- und Ruhezeit (Ziff. 2.7.1)","approved":false,"q":"Was gilt gemäss FDV R 300.1, Ziff. 2.7.1 zur Arbeits- und Ruhezeit?","opts":[{"l":"A","t":"Personen, die fahrdienstliche Tätigkeiten ausüben, sind für die Einhaltung der gesetzlichen Vorgaben über die Arbeits- und Ruhezeit mitverantwortlich.","c":true},{"l":"B","t":"Die Einhaltung der Arbeits- und Ruhezeit liegt ausschliesslich in der Verantwortung des Arbeitgebers, nicht des Personals.","c":false},{"l":"C","t":"Gesetzliche Vorgaben zur Arbeits- und Ruhezeit gelten für fahrdienstliches Personal nicht.","c":false},{"l":"D","t":"Die Verantwortung für die Arbeits- und Ruhezeit trägt ausschliesslich der Sicherheitschef.","c":false}],"fdv":"Personen, die fahrdienstliche Tätigkeiten ausüben, sind für die Einhaltung der gesetzlichen Vorgaben über die Arbeits- und Ruhezeit mitverantwortlich.","note":"","optTags":{"A":[],"B":[],"C":[],"D":[]},"optNotes":{"A":"","B":"","C":"","D":""}}];

const tagById   = (id) => TAGS.find(t => t.id === id);
const prioByVal = (v)  => PRIO.find(p => p.value === v);
const hasIssues = (q)  =>
  q.note.trim() !== "" ||
  Object.values(q.optTags).some(a => a.length > 0) ||
  Object.values(q.optNotes || {}).some(n => n.trim() !== "");

function TagPill({ tag, onRemove }) {
  const t = tagById(tag);
  if (!t) return null;
  return (
    <span style={{ display:"inline-flex", alignItems:"center", gap:4,
      padding:"2px 8px", borderRadius:10, background:t.bg, color:t.color,
      fontSize:11, fontWeight:600 }}>
      {t.label}
      {onRemove && (
        <button onClick={onRemove} style={{ background:"none", border:"none",
          cursor:"pointer", color:t.color, padding:0, fontSize:13, lineHeight:1 }}>x</button>
      )}
    </span>
  );
}

function TagSelector({ selected, onChange }) {
  return (
    <div style={{ display:"flex", flexWrap:"wrap", gap:5, marginTop:4 }}>
      {TAGS.map(t => {
        const on = selected.includes(t.id);
        return (
          <button key={t.id} onClick={() =>
            onChange(on ? selected.filter(x => x !== t.id) : [...selected, t.id])
          } style={{
            padding:"3px 10px", borderRadius:10, fontSize:11, fontWeight:600,
            cursor:"pointer",
            background: on ? t.bg : "#f0f0f0",
            color:       on ? t.color : "#888",
            border:      on ? "1.5px solid " + t.color : "1.5px solid #ddd",
          }}>{t.label}</button>
        );
      })}
    </div>
  );
}

function QuestionRow({ q, open, onToggle, onChange }) {
  const prio     = prioByVal(q.p);
  const issues   = hasIssues(q);
  const optNotes = q.optNotes || { A:"", B:"", C:"", D:"" };

  return (
    <div style={{
      borderRadius:10, marginBottom:8, overflow:"hidden",
      border:"1px solid " + (q.approved ? "#ccc" : issues ? "#e8860a" : "rgba(0,0,0,0.10)"),
      background: q.approved ? "#fafafa" : "#fff",
      opacity: q.approved ? 0.72 : 1,
    }}>
      <div style={{ display:"flex", alignItems:"center", gap:10,
        padding:"11px 14px", background: open ? "#f8f9fc" : "transparent" }}>

        <div onClick={e => e.stopPropagation()} style={{ flexShrink:0 }}>
          <label style={{ display:"flex", alignItems:"center", cursor:"pointer", userSelect:"none" }}>
            <div style={{
              width:20, height:20, borderRadius:5, flexShrink:0,
              border: q.approved ? "none" : "2px solid #ccc",
              background: q.approved ? "#1a7a3c" : "#fff",
              display:"flex", alignItems:"center", justifyContent:"center",
            }}>
              {q.approved && <span style={{ color:"#fff", fontSize:13, lineHeight:1 }}>v</span>}
            </div>
            <input type="checkbox" checked={q.approved}
              onChange={e => onChange({ approved: e.target.checked })}
              style={{ display:"none" }} />
          </label>
        </div>

        <span style={{
          minWidth:26, height:26, borderRadius:"50%", flexShrink:0,
          background: q.approved ? "#bbb" : "#1a3a6b", color:"#fff",
          display:"flex", alignItems:"center", justifyContent:"center",
          fontSize:11, fontWeight:700,
        }}>{q.nr}</span>

        <span onClick={onToggle} style={{
          flex:1, fontSize:14, fontWeight:500, cursor:"pointer", userSelect:"none",
          color: q.approved ? "#666" : "#1a1a1a",
          textDecoration: q.approved ? "line-through" : "none",
        }}>{q.term}{q.multiSelect && (
          <span style={{ fontSize:10, fontWeight:700, marginLeft:8,
            background:"#5b2d8e", color:"#fff", padding:"1px 7px", borderRadius:7 }}>
            MEHRFACH
          </span>
        )}</span>

        {issues && !q.approved && (
          <span style={{ fontSize:11, background:"#fff3e0", color:"#a05000",
            padding:"2px 8px", borderRadius:8, fontWeight:600, flexShrink:0 }}>
            Korrekturen
          </span>
        )}
        <span style={{ fontSize:11, fontWeight:600, padding:"2px 9px",
          borderRadius:8, background:prio.bg, color:prio.color, flexShrink:0 }}>
          {prio.label}
        </span>
        <span onClick={onToggle} style={{ color:"#666", fontSize:13,
          flexShrink:0, cursor:"pointer", userSelect:"none" }}>
          {open ? "v" : ">"}
        </span>
      </div>

      {open && (
        <div style={{ borderTop:"1px solid rgba(0,0,0,0.10)", padding:"14px 16px 18px" }}>

          <div style={{ fontSize:14, fontWeight:600, color:"#1a1a1a",
            marginBottom:14, lineHeight:1.5 }}>
            {q.q}
          </div>

          <div style={{ marginBottom:16 }}>
            <div style={{ fontSize:11, fontWeight:700, letterSpacing:"0.06em",
              color:"#666", marginBottom:10 }}>
              {q.multiSelect ? "ANTWORTEN (Mehrfachauswahl - mehrere richtig)" : "ANTWORTEN"}
            </div>
            {q.opts.map(opt => (
              <div key={opt.l} style={{
                marginBottom:10, padding:"10px 12px", borderRadius:9,
                background: opt.c ? "#edf7f0" : "#f8f9fa",
                border: "1px solid " + (opt.c ? "#1a7a3c" : "rgba(0,0,0,0.10)"),
              }}>
                <div style={{ display:"flex", alignItems:"flex-start", gap:8, marginBottom:8 }}>
                  <span style={{
                    minWidth:22, height:22, borderRadius:"50%", flexShrink:0,
                    background: opt.c ? "#1a7a3c" : "#ddd",
                    color: opt.c ? "#fff" : "#555",
                    display:"flex", alignItems:"center", justifyContent:"center",
                    fontSize:11, fontWeight:700,
                  }}>{opt.l}</span>
                  <span style={{ fontSize:13, lineHeight:1.5,
                    color: opt.c ? "#1a7a3c" : "#333",
                    fontWeight: opt.c ? 600 : 400, flex:1 }}>
                    {opt.t}
                    {opt.c && (
                      <span style={{ fontSize:11, marginLeft:6,
                        background:"#1a7a3c", color:"#fff",
                        padding:"1px 6px", borderRadius:6 }}>KORREKT</span>
                    )}
                  </span>
                </div>

                {q.optTags[opt.l].length > 0 && (
                  <div style={{ display:"flex", flexWrap:"wrap", gap:4,
                    marginBottom:6, marginLeft:30 }}>
                    {q.optTags[opt.l].map(tag => (
                      <TagPill key={tag} tag={tag} onRemove={() => {
                        onChange({ optTags: { ...q.optTags,
                          [opt.l]: q.optTags[opt.l].filter(t => t !== tag) } });
                      }} />
                    ))}
                  </div>
                )}

                <div style={{ marginLeft:30 }}>
                  <TagSelector
                    selected={q.optTags[opt.l]}
                    onChange={newTags => onChange({ optTags: { ...q.optTags, [opt.l]: newTags } })}
                  />
                </div>

                <div style={{ marginLeft:30, marginTop:7 }}>
                  <textarea
                    value={optNotes[opt.l] || ""}
                    onChange={e => onChange({ optNotes: { ...optNotes, [opt.l]: e.target.value } })}
                    placeholder={"Notiz zu Antwort " + opt.l + " ..."}
                    rows={2}
                    style={{
                      width:"100%", padding:"6px 10px", borderRadius:7,
                      border:"1px solid rgba(0,0,0,0.10)", fontSize:12,
                      fontFamily:"inherit", resize:"vertical",
                      background: (optNotes[opt.l]||"").trim() ? "#fffde7" : "rgba(255,255,255,0.7)",
                      outline:"none", color:"#1a1a1a",
                    }} />
                </div>
              </div>
            ))}
          </div>

          <div style={{ marginBottom:14, padding:"10px 12px", borderRadius:8,
            background:"#f0f4fa", borderLeft:"3px solid #1a3a6b",
            fontSize:13, color:"#333", lineHeight:1.6 }}>
            <div style={{ fontSize:11, fontWeight:700, color:"#1a3a6b",
              marginBottom:4, letterSpacing:"0.05em" }}>FDV-ORIGINALTEXT</div>
            {q.fdv}
          </div>

          <div style={{ marginBottom:14 }}>
            <div style={{ fontSize:11, fontWeight:700, color:"#666",
              letterSpacing:"0.06em", marginBottom:7 }}>PRIORITAET</div>
            <div style={{ display:"flex", gap:6, flexWrap:"wrap" }}>
              {PRIO.map(opt => (
                <button key={opt.value} onClick={() => onChange({ p: opt.value })} style={{
                  padding:"5px 14px", borderRadius:8, fontSize:12, fontWeight:600,
                  cursor:"pointer",
                  background: q.p === opt.value ? opt.bg : "#f4f5f7",
                  color:       q.p === opt.value ? opt.color : "#888",
                  border:      q.p === opt.value ? "1.5px solid " + opt.color : "1.5px solid #ddd",
                }}>{opt.label}</button>
              ))}
            </div>
          </div>

          <div>
            <div style={{ fontSize:11, fontWeight:700, color:"#666",
              letterSpacing:"0.06em", marginBottom:6 }}>GESAMTNOTIZ</div>
            <textarea value={q.note}
              onChange={e => onChange({ note: e.target.value })}
              placeholder="Allgemeine Anmerkungen, fehlende Fragen, Korrekturvorschlaege ..."
              rows={3}
              style={{
                width:"100%", padding:"9px 12px", borderRadius:8,
                border:"1px solid rgba(0,0,0,0.10)", fontSize:13,
                fontFamily:"inherit", resize:"vertical",
                background: q.note.trim() ? "#fffde7" : "#fafafa",
                outline:"none", color:"#1a1a1a",
              }} />
          </div>
        </div>
      )}
    </div>
  );
}

function App() {
  const [qs, setQs]           = useState(INITIAL_QS);
  const [openSet, setOpenSet] = useState(() =>
    new Set(INITIAL_QS.filter(q => !q.approved).map(q => q.nr))
  );
  const [search, setSearch]           = useState("");
  const [filterOpen, setFilterOpen]   = useState(false);
  const [filterIssues, setFilterIssues] = useState(false);
  const [filterPrio, setFilterPrio]   = useState(0);

  // "idle" | "loading" | "saving" | "saved" | "error"
  const [saveState, setSaveState] = useState("loading");
  const saveTimer = useRef(null);

  // Beim Start: gespeicherten Stand aus Supabase laden und ueber die aktuelle Fragenliste legen.
  // Ist die Datenbank noch leer (allererster Start mit dieser Anbindung), wird der im
  // Code bereits vorhandene Stand (INITIAL_QS) einmalig hochgeladen, damit die Datenbank
  // ab sofort die Quelle der Wahrheit ist.
  useEffect(() => {
    let cancelled = false;
    (async () => {
      try {
        const corrections = await loadCorrectionsFromSupabase();
        if (cancelled) return;
        if (corrections && Object.keys(corrections).length > 0) {
          const merged = mergeCorrections(INITIAL_QS, corrections);
          setQs(merged);
          setOpenSet(new Set(merged.filter(q => !q.approved).map(q => q.nr)));
        } else {
          // Datenbank leer -> aktuellen Stand aus dem Code als Erstbefuellung hochladen
          const seed = buildCorrections(INITIAL_QS);
          await saveCorrectionsToSupabase(seed);
        }
      } catch (e) {
        // Netzwerkfehler o.ae. - beim allerersten Mal normal, App bleibt mit INITIAL_QS nutzbar.
      } finally {
        if (!cancelled) setSaveState("idle");
      }
    })();
    return () => { cancelled = true; };
  }, []);

  const [saveErrorDetail, setSaveErrorDetail] = useState("");

  const persist = useCallback(async (currentQs) => {
    setSaveState("saving");
    try {
      const corrections = buildCorrections(currentQs);
      const result = await saveCorrectionsToSupabase(corrections);
      if (!result.ok) {
        setSaveErrorDetail("HTTP " + result.status + ": " + (result.detail || "").slice(0, 300));
        throw new Error("Speichern fehlgeschlagen");
      }
      setSaveErrorDetail("");
      setSaveState("saved");
    } catch (e) {
      if (!saveErrorDetail) setSaveErrorDetail(String(e && e.message ? e.message : e));
      setSaveState("error");
    }
  }, []);

  const updateQ = useCallback((nr, patch) => {
    setQs(prev => {
      const next = prev.map(q => q.nr === nr ? { ...q, ...patch } : q);
      if (saveTimer.current) clearTimeout(saveTimer.current);
      saveTimer.current = setTimeout(() => persist(next), 700);
      return next;
    });
    if (patch.approved === true)
      setOpenSet(prev => { const s = new Set(prev); s.delete(nr); return s; });
    else if (patch.approved === false)
      setOpenSet(prev => new Set([...prev, nr]));
  }, [persist]);

  const saveNow = useCallback(() => {
    if (saveTimer.current) clearTimeout(saveTimer.current);
    persist(qs);
  }, [qs, persist]);

  const download = useCallback(() => {
    const blob = new Blob([JSON.stringify(qs, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "fdv_korrekturen.json";
    a.click();
    URL.revokeObjectURL(url);
  }, [qs]);

  // Export ueber Dialog: auf dem Handy funktioniert der Blob-Download in vielen
  // Browsern/WebViews nicht. Kopieren in die Zwischenablage bzw. das native
  // Teilen-Menue funktionieren dagegen zuverlaessig.
  const [exportOpen, setExportOpen] = useState(false);
  const [exportText, setExportText] = useState("");
  const [exportRange, setExportRange] = useState(null); // z.B. [1,50]
  const [copyState, setCopyState]   = useState("idle"); // idle | copied | error
  const exportRef = useRef(null);

  const EXPORT_RANGES = [[1,50],[51,100],[101,150],[151,200]];

  const openExport = useCallback(() => {
    setExportRange(null);
    setExportText("");
    setCopyState("idle");
    setExportOpen(true);
  }, []);

  const chooseExportRange = useCallback((minNr, maxNr) => {
    setExportRange([minNr, maxNr]);
    setExportText(JSON.stringify(buildCorrections(qs, minNr, maxNr), null, 2));
    setCopyState("idle");
  }, [qs]);

  useEffect(() => {
    if (exportOpen && exportRange && exportRef.current) {
      exportRef.current.focus();
      exportRef.current.select();
    }
  }, [exportOpen, exportRange]);

  const copyExport = useCallback(async () => {
    try {
      await navigator.clipboard.writeText(exportText);
      setCopyState("copied");
      return;
    } catch (e) { /* Clipboard-API evtl. nicht erlaubt - Fallback unten */ }
    try {
      exportRef.current && exportRef.current.select();
      const ok = document.execCommand("copy");
      setCopyState(ok ? "copied" : "error");
    } catch (e) {
      setCopyState("error");
    }
  }, [exportText]);

  const canShare = typeof navigator !== "undefined" && !!navigator.share;
  const shareExport = useCallback(async () => {
    try {
      await navigator.share({ title: "FDV Korrekturen", text: exportText });
    } catch (e) { /* abgebrochen oder nicht unterstuetzt - ignorieren */ }
  }, [exportText]);

  // Import: verlaesslichster Weg, Korrekturen ueber Sitzungen/neu geoeffnete
  // Dateien hinweg zu uebernehmen, unabhaengig davon ob der automatische
  // Speicher (window.storage) fuer diese Artefakt-Instanz greift.
  const [importOpen, setImportOpen] = useState(false);
  const [importText, setImportText] = useState("");
  const [importState, setImportState] = useState("idle"); // idle | applied | error

  const openImport = useCallback(() => {
    setImportText("");
    setImportState("idle");
    setImportOpen(true);
  }, []);

  const applyImport = useCallback(() => {
    try {
      const corrections = JSON.parse(importText);
      setQs(prev => {
        const merged = mergeCorrections(prev, corrections);
        setOpenSet(new Set(merged.filter(q => !q.approved).map(q => q.nr)));
        persist(merged);
        return merged;
      });
      setImportState("applied");
    } catch (e) {
      setImportState("error");
    }
  }, [importText, persist]);

  const visible = qs.filter(q => {
    if (search && !q.term.toLowerCase().includes(search.toLowerCase())
        && !String(q.nr).includes(search)) return false;
    if (filterOpen   && q.approved)    return false;
    if (filterIssues && !hasIssues(q)) return false;
    if (filterPrio   && q.p !== filterPrio) return false;
    return true;
  });

  const grpA = visible.filter(q => q.nr <= 81);
  const grpB = visible.filter(q => q.nr >= 82);

  const totalOpen     = qs.filter(q => !q.approved).length;
  const totalApproved = qs.filter(q =>  q.approved).length;
  const totalIssues   = qs.filter(hasIssues).length;

  const toggle = (nr) => setOpenSet(prev => {
    const s = new Set(prev); s.has(nr) ? s.delete(nr) : s.add(nr); return s;
  });

  const FBtn = ({ active, bg, col, bdr, onClick, children }) => (
    <button onClick={onClick} style={{
      padding:"7px 14px", borderRadius:8, fontSize:12, fontWeight:600, cursor:"pointer",
      background: active ? bg   : "#f4f5f7",
      color:      active ? col  : "#666",
      border:     active ? "1.5px solid " + bdr : "1px solid rgba(0,0,0,0.10)",
    }}>{children}</button>
  );

  return (
    <div style={{ fontFamily:"-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif",
      background:"#f4f5f7", minHeight:"100vh" }}>

      <div style={{ background:"#1a3a6b", color:"#fff", padding:"14px 20px",
        display:"flex", alignItems:"center", gap:14, flexWrap:"wrap" }}>
        <div>
          <div style={{ fontWeight:700, fontSize:16 }}>FDV R 300.1 - Frageneinstellungen</div>
          <div style={{ fontSize:12, opacity:0.75, marginTop:2 }}>
            {qs.length} Fragen - {totalApproved} geprueft OK - {totalOpen} offen - {totalIssues} mit Korrekturen
          </div>
        </div>
        <div style={{ flex:1 }} />

        <div style={{ fontSize:12, opacity:0.85, minWidth:110, textAlign:"right" }}>
          {saveState === "loading" && "Lade gespeicherten Stand..."}
          {saveState === "saving"  && "Speichert..."}
          {saveState === "saved"   && "✓ Gespeichert"}
          {saveState === "error"   && "⚠ Fehler beim Speichern"}
          {saveState === "idle"    && ""}
        </div>

        <button onClick={saveNow} disabled={saveState === "saving"} style={{
          padding:"8px 20px", borderRadius:8, border:"none", fontWeight:700,
          fontSize:13, cursor: saveState === "saving" ? "default" : "pointer",
          background: saveState === "error" ? "#b83030" : "#e8860a", color:"#fff",
          opacity: saveState === "saving" ? 0.7 : 1,
        }}>
          {saveState === "error" ? "Erneut speichern" : "Jetzt speichern"}
        </button>

        <button onClick={openImport} title="Zuvor exportierte Korrekturen einspielen" style={{
          padding:"8px 16px", borderRadius:8, fontWeight:600,
          fontSize:13, cursor:"pointer", background:"transparent", color:"#fff",
          border:"1.5px solid rgba(255,255,255,0.5)",
        }}>Import</button>

        <button onClick={openExport} title="Korrekturen zum Kopieren/Teilen anzeigen" style={{
          padding:"8px 16px", borderRadius:8, fontWeight:600,
          fontSize:13, cursor:"pointer", background:"transparent", color:"#fff",
          border:"1.5px solid rgba(255,255,255,0.5)",
        }}>Export</button>
      </div>

      {saveState === "error" && saveErrorDetail && (
        <div style={{ background:"#fbeaea", color:"#7a1f1f", padding:"8px 20px",
          fontSize:12, fontFamily:"monospace", wordBreak:"break-word",
          borderBottom:"1px solid rgba(0,0,0,0.08)" }}>
          Speicherfehler-Detail: {saveErrorDetail}
        </div>
      )}

      <div style={{ background:"#fff", borderBottom:"1px solid rgba(0,0,0,0.10)",
        padding:"10px 20px", display:"flex", gap:8, alignItems:"center", flexWrap:"wrap" }}>
        <input value={search} onChange={e => setSearch(e.target.value)}
          placeholder="Suche nach Begriff oder Nr."
          style={{ padding:"7px 12px", borderRadius:8,
            border:"1px solid rgba(0,0,0,0.10)", fontSize:13,
            outline:"none", minWidth:210 }} />
        <FBtn active={filterOpen} bg="#fbeaea" col="#b83030" bdr="#b83030"
          onClick={() => setFilterOpen(v => !v)}>
          Noch offen ({totalOpen})
        </FBtn>
        <FBtn active={filterIssues} bg="#fff3e0" col="#a05000" bdr="#e8860a"
          onClick={() => setFilterIssues(v => !v)}>
          Mit Korrekturen ({totalIssues})
        </FBtn>
        {PRIO.map(opt => (
          <FBtn key={opt.value}
            active={filterPrio === opt.value}
            bg={opt.bg} col={opt.color} bdr={opt.color}
            onClick={() => setFilterPrio(filterPrio === opt.value ? 0 : opt.value)}>
            {opt.label}
          </FBtn>
        ))}
        {(search || filterOpen || filterIssues || filterPrio > 0) && (
          <button onClick={() => { setSearch(""); setFilterOpen(false);
            setFilterIssues(false); setFilterPrio(0); }} style={{
            padding:"7px 12px", borderRadius:8, fontSize:12, cursor:"pointer",
            background:"#f4f5f7", color:"#666", border:"1px solid rgba(0,0,0,0.10)" }}>
            Zuruecksetzen
          </button>
        )}
        <div style={{ marginLeft:"auto", fontSize:12, color:"#666" }}>
          {visible.length} von {qs.length}
        </div>
      </div>

      <div style={{ maxWidth:840, margin:"0 auto", padding:"16px 16px 40px" }}>

        {grpA.length > 0 && (
          <div>
            <div style={{ fontSize:11, fontWeight:700, color:"#fff",
              background:"#1a3a6b", padding:"6px 14px", borderRadius:8,
              marginBottom:10, display:"inline-block" }}>
              GRUPPE A - BEGRIFFE (Ziff. 2.5.2) - Fragen 1-81
            </div>
            {grpA.map(q => (
              <QuestionRow key={q.nr} q={q}
                open={openSet.has(q.nr)}
                onToggle={() => toggle(q.nr)}
                onChange={patch => updateQ(q.nr, patch)} />
            ))}
          </div>
        )}

        {grpB.length > 0 && (
          <div style={{ marginTop:16 }}>
            <div style={{ fontSize:11, fontWeight:700, color:"#fff",
              background:"#1a3a6b", padding:"6px 14px", borderRadius:8,
              marginBottom:10, display:"inline-block" }}>
              GRUPPE B - ZIFFERN 2.1-2.11 - Fragen 82-96
            </div>
            {grpB.map(q => (
              <QuestionRow key={q.nr} q={q}
                open={openSet.has(q.nr)}
                onToggle={() => toggle(q.nr)}
                onChange={patch => updateQ(q.nr, patch)} />
            ))}
          </div>
        )}

        {visible.length === 0 && (
          <div style={{ textAlign:"center", color:"#666", padding:60, fontSize:15 }}>
            Keine Fragen gefunden.
          </div>
        )}

        <div style={{ marginTop:24, padding:"14px 16px", borderRadius:10,
          background:"#e8eef7", color:"#1a3a6b", fontSize:13, lineHeight:1.6 }}>
          Deine Aenderungen werden jetzt direkt in einer gemeinsamen Online-Datenbank
          gespeichert (kurz nach jeder Anpassung) - geraeteuebergreifend und dauerhaft,
          kein Export/Import mehr noetig. "Export" bleibt als Kopiermoeglichkeit erhalten,
          falls du den aktuellen Stand mal manuell weitergeben willst.
        </div>
      </div>

      {exportOpen && (
        <div onClick={() => setExportOpen(false)} style={{
          position:"fixed", inset:0, background:"rgba(0,0,0,0.55)",
          display:"flex", alignItems:"center", justifyContent:"center",
          zIndex:1000, padding:16 }}>
          <div onClick={e => e.stopPropagation()} style={{
            background:"#fff", borderRadius:12, padding:20, width:"100%",
            maxWidth:560, maxHeight:"82vh", display:"flex", flexDirection:"column" }}>

            <div style={{ fontWeight:700, fontSize:15, color:"#1a3a6b", marginBottom:6 }}>
              Korrekturen exportieren
            </div>
            <div style={{ fontSize:12, color:"#666", marginBottom:10, lineHeight:1.5 }}>
              Der direkte Datei-Download funktioniert auf dem Handy oft nicht, und ein
              Export mit allen Fragen auf einmal kann beim Kopieren abgeschnitten werden.
              Wähle einen Bereich, kopiere ihn, schick ihn ab - dann den nächsten Bereich.
            </div>

            <div style={{ display:"flex", gap:8, marginBottom:12, flexWrap:"wrap" }}>
              {EXPORT_RANGES.map(([lo, hi]) => {
                const active = exportRange && exportRange[0] === lo && exportRange[1] === hi;
                const count = qs.filter(q => q.nr >= lo && q.nr <= hi).length;
                if (count === 0) return null;
                return (
                  <button key={lo} onClick={() => chooseExportRange(lo, hi)} style={{
                    padding:"9px 16px", borderRadius:8, fontWeight:700, fontSize:13,
                    cursor:"pointer", border: active ? "none" : "1px solid rgba(0,0,0,0.15)",
                    background: active ? "#1a3a6b" : "#f4f5f7",
                    color: active ? "#fff" : "#1a3a6b" }}>
                    Export {lo}-{hi}
                  </button>
                );
              })}
            </div>

            {exportRange ? (
              <>
                <textarea ref={exportRef} readOnly value={exportText}
                  onFocus={e => e.target.select()}
                  style={{ flex:1, minHeight:220, fontFamily:"monospace", fontSize:11,
                    padding:10, borderRadius:8, border:"1px solid rgba(0,0,0,0.15)",
                    resize:"none", background:"#fafafa", color:"#1a1a1a" }} />

                <div style={{ display:"flex", gap:8, marginTop:14, flexWrap:"wrap" }}>
                  <button onClick={copyExport} style={{
                    padding:"9px 16px", borderRadius:8, border:"none", fontWeight:700,
                    fontSize:13, cursor:"pointer", color:"#fff",
                    background: copyState === "error" ? "#b83030" : "#1a7a3c" }}>
                    {copyState === "copied" ? "✓ Kopiert"
                      : copyState === "error" ? "Fehler - Text oben manuell markieren"
                      : "In Zwischenablage kopieren"}
                  </button>
                  {canShare && (
                    <button onClick={shareExport} style={{
                      padding:"9px 16px", borderRadius:8, fontWeight:600, fontSize:13,
                      cursor:"pointer", background:"#e8eef7", color:"#1a3a6b",
                      border:"1px solid rgba(0,0,0,0.10)" }}>
                      Teilen
                    </button>
                  )}
                  <button onClick={download} style={{
                    padding:"9px 16px", borderRadius:8, fontWeight:600, fontSize:13,
                    cursor:"pointer", background:"#f4f5f7", color:"#666",
                    border:"1px solid rgba(0,0,0,0.10)" }}>
                    Als Datei (Desktop)
                  </button>
                </div>
              </>
            ) : (
              <div style={{ flex:1, display:"flex", alignItems:"center", justifyContent:"center",
                color:"#999", fontSize:13, minHeight:120 }}>
                Bitte zuerst einen Bereich wählen.
              </div>
            )}

            <div style={{ display:"flex", marginTop:14 }}>
              <div style={{ flex:1 }} />
              <button onClick={() => setExportOpen(false)} style={{
                padding:"9px 16px", borderRadius:8, fontWeight:600, fontSize:13,
                cursor:"pointer", background:"transparent", color:"#666",
                border:"1px solid rgba(0,0,0,0.10)" }}>
                Schliessen
              </button>
            </div>
          </div>
        </div>
      )}

      {importOpen && (
        <div onClick={() => setImportOpen(false)} style={{
          position:"fixed", inset:0, background:"rgba(0,0,0,0.55)",
          display:"flex", alignItems:"center", justifyContent:"center",
          zIndex:1000, padding:16 }}>
          <div onClick={e => e.stopPropagation()} style={{
            background:"#fff", borderRadius:12, padding:20, width:"100%",
            maxWidth:560, maxHeight:"82vh", display:"flex", flexDirection:"column" }}>

            <div style={{ fontWeight:700, fontSize:15, color:"#1a3a6b", marginBottom:6 }}>
              Korrekturen importieren
            </div>
            <div style={{ fontSize:12, color:"#666", marginBottom:10, lineHeight:1.5 }}>
              Fuege hier den zuvor exportierten Korrekturen-Text ein. Er wird ueber die
              aktuelle Fragenliste gelegt - bereits vorhandene Bewertungen zu denselben
              Fragen werden dabei ueberschrieben.
            </div>

            <textarea value={importText}
              onChange={e => { setImportText(e.target.value); setImportState("idle"); }}
              placeholder="Hier den kopierten JSON-Text einfuegen ..."
              style={{ flex:1, minHeight:220, fontFamily:"monospace", fontSize:11,
                padding:10, borderRadius:8, border:"1px solid rgba(0,0,0,0.15)",
                resize:"none", background:"#fafafa", color:"#1a1a1a" }} />

            {importState === "error" && (
              <div style={{ marginTop:8, fontSize:12, color:"#b83030" }}>
                Das sieht nicht nach gueltigem JSON aus. Bitte den kompletten Text aus dem
                Export-Dialog einfuegen.
              </div>
            )}
            {importState === "applied" && (
              <div style={{ marginTop:8, fontSize:12, color:"#1a7a3c" }}>
                ✓ Korrekturen uebernommen.
              </div>
            )}

            <div style={{ display:"flex", gap:8, marginTop:14, flexWrap:"wrap" }}>
              <button onClick={applyImport} disabled={!importText.trim()} style={{
                padding:"9px 16px", borderRadius:8, border:"none", fontWeight:700,
                fontSize:13, cursor: importText.trim() ? "pointer" : "default",
                color:"#fff", background:"#1a7a3c",
                opacity: importText.trim() ? 1 : 0.5 }}>
                Anwenden
              </button>
              <div style={{ flex:1 }} />
              <button onClick={() => setImportOpen(false)} style={{
                padding:"9px 16px", borderRadius:8, fontWeight:600, fontSize:13,
                cursor:"pointer", background:"transparent", color:"#666",
                border:"1px solid rgba(0,0,0,0.10)" }}>
                Schliessen
              </button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>

  var source = sourceEl.textContent;
  var output = Babel.transform(source, {
    presets: [["react", { runtime: "classic" }]],
    filename: "app.jsx"
  }).code;
  (0, eval)(output);
</script>
</body>
